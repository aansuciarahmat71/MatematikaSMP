  const sdChips = (items, on, attr) => items.map((it) => '<button type="button" class="chip" ' + attr + '="' + it[0] + '" aria-pressed="' + (it[0] === on) + '">' + it[1] + '</button>').join('');

  function sdAudio() {
    const bar = $('#sdbar'); if (!bar) return;
    if (!SDMODS[sds.sub].n[sds.tab]) { bar.innerHTML = ''; return; }
    if (!TTS.ok) { bar.innerHTML = '<div class="card"><p class="muted" style="margin:0">Browser ini belum mendukung suara pembaca. Coba buka di Chrome, Edge, atau Safari.</p></div>'; return; }
    bar.innerHTML = '<div class="card"><div class="ansrow"><button type="button" class="btn" id="spk">Dengarkan penjelasan</button></div></div>';
    $('#spk').addEventListener('click', () => { if (TTS.on) { stopSpeech(); setSpkBtn(); } else speak(SDMODS[sds.sub].n[sds.tab]); });
  }

  const sdDotGrid = (n, cls) => '<div class="sd-dots">' + sdRange(1, n).map(() => '<span class="sd-dot ' + (cls || '') + '"></span>').join('') + '</div>';
  const sdGroup = (h, label) => '<div class="sd-dg">' + h + '<span class="sd-cap">' + label + '</span></div>';
  const sdBox = (label) => sdGroup('<div class="sd-box">10</div>', label);

  /* ----- 1. Peta penjumlahan ----- */
  function sdStairs(items, topIdx) {
    return '<div class="sd-stairs" role="img" aria-label="Tangga: ' + items.join(', ') + '">' +
      items.map((t, i) => '<span class="sd-st' + (i === topIdx ? ' t' : '') + '" style="min-height:' + (17 + i * 13) + 'px">' + t + '</span>').join('') + '</div>';
  }
  function sdPeta(c) {
    c.innerHTML = '<div class="card"><h3>A. Penjumlahan</h3><p>Semua penjumlahan dibagi dua kelompok menurut hasilnya.</p><div class="sd-two">' +
      '<div class="sd-grp"><span class="sd-badge">A</span><h4>Hasilnya ≤ 10</h4>' + sdStairs(['1 – 5', '6', '7', '8', '9', '10'], 5) +
      '<p style="margin:0">Hasil penjumlahannya sama dengan <b>1 sampai 10</b>.</p><p style="margin:4px 0 0"><span class="sd-lv">Dasar</span></p></div>' +
      '<div class="sd-grp"><span class="sd-badge">B</span><h4>Hasilnya &gt; 10</h4>' + sdStairs(['9+', '8+', '7+', '6+'], -1) +
      '<p style="margin:0">Hasil penjumlahan sama dengan <b>11 – 19</b>.</p><p style="margin:4px 0 0"><span class="sd-lv">Mahir</span></p></div></div>' +
      '<div class="sd-note">Mulai dari level dasar: kenal bilangan.</div></div>' +
      '<div class="card"><h3>Masuk kelompok mana?</h3><p class="muted" style="margin:0 0 8px">Isi dua bilangan 1 sampai 9.</p>' +
      '<div class="ins"><label class="ni"><span>Bilangan 1</span><input class="field num" id="pka" type="text" inputmode="numeric" maxlength="1" value="9"></label><span class="big" aria-hidden="true" style="padding-bottom:10px">+</span>' +
      '<label class="ni"><span>Bilangan 2</span><input class="field num" id="pkb" type="text" inputmode="numeric" maxlength="1" value="5"></label></div>' +
      '<p class="verdict" id="pkr" aria-live="polite"></p></div>';
    const upd = () => {
      const a = parseInt($('#pka').value, 10), b = parseInt($('#pkb').value, 10), r = $('#pkr');
      if (!(a >= 1 && a <= 9 && b >= 1 && b <= 9)) { r.textContent = 'Isi dua bilangan 1 sampai 9.'; return; }
      const s = a + b;
      r.textContent = a + ' + ' + b + ' = ' + s + '. ' + (s > 10 ? 'Hasilnya lebih dari 10, jadi masuk kelompok B (mahir, hasil 11 – 19).' : 'Hasilnya 10 atau kurang, jadi masuk kelompok A (dasar, hasil 1 – 10).');
    };
    $('#pka').addEventListener('input', upd); $('#pkb').addEventListener('input', upd); upd();
  }

  /* ----- 2. Mengenal bilangan ----- */
  function sdKenal(c) {
    const star = '<svg class="sd-star" viewBox="0 0 24 24" aria-hidden="true"><polygon points="12,2 15.1,8.6 22,9.3 16.8,14 18.2,21 12,17.5 5.8,21 7.2,14 2,9.3 8.9,8.6"/></svg>';
    c.innerHTML = '<div class="card" id="kn"><h3>Mengenal bilangan</h3><p class="muted" style="margin:0 0 8px">Bilangan menyatakan banyaknya benda. Ketuk satu baris untuk mendengar namanya.</p>' +
      sdRange(1, 5).map((n) => '<button type="button" class="sd-srow" data-n="' + n + '" aria-label="' + n + ' bintang, ' + terb(n) + '"><span class="sd-stars">' + star.repeat(n) + '</span><span class="n">' + n + '</span></button>').join('') + '</div><div id="sdpr"></div>';
    sdHitungLatihan($('#sdpr'));
    $('#kn').addEventListener('click', (e) => {
      const b = e.target.closest('[data-n]'); if (!b) return;
      $$('.sd-srow', c).forEach((x) => x.classList.toggle('on', x === b));
      if (TTS.ok) speak(terb(+b.dataset.n) + '.');
    });
  }

  /* ----- latihan menghitung benda (Mengenal bilangan) ----- */
  function sdHitungLatihan(host) {
    let pr = null, prev = null, counted = false, done = false, k = 0;
    const stat = () => '<span>Benar <b>' + store.sd.ok + '</b> dari <b>' + store.sd.total + '</b></span>';
    function draw() {
      pr = sdHitung(prev); prev = { nama: pr.nama, n: pr.n }; counted = false; done = false; k = 0;
      host.innerHTML = '<div class="card"><h3>Latihan: hitung bendanya</h3><p class="muted" style="margin:0">Ketuk benda satu per satu untuk membantu menghitung, lalu pilih jawabannya.</p>' +
        '<div class="sd-things" role="group" aria-label="Benda yang harus dihitung">' + pr.items.map((it) => '<button type="button" class="sd-th" aria-label="Benda, ketuk untuk menghitung">' + it.e + '</button>').join('') + '</div>' +
        '<p class="qtext" style="font-size:22px;margin:6px 0">Ada berapa <b>' + pr.nama + '</b>?</p>' +
        '<div class="sd-numpad" id="np" role="group" aria-label="Pilih jawaban">' + sdRange(1, 5).map((n) => '<button type="button" class="sd-nb" data-n="' + n + '">' + n + '</button>').join('') + '</div>' +
        '<div id="nfb" aria-live="polite"></div><div class="row"><button type="button" class="chip sm" id="nnew">Soal lain</button></div><p class="stats" id="nst">' + stat() + '</p></div>';
      host.querySelector('#nnew').addEventListener('click', draw);
      $$('.sd-th', host).forEach((b) => b.addEventListener('click', () => {
        if (b.hasAttribute('data-c')) return;
        k++; b.setAttribute('data-c', k); b.classList.add('m');
        if (TTS.ok) speak(terb(k) + '.');
      }));
      host.querySelector('#np').addEventListener('click', (e) => {
        const b = e.target.closest('[data-n]'); if (!b || done) return;
        const ok = +b.dataset.n === pr.n, fb = host.querySelector('#nfb');
        if (!counted) { counted = true; store.sd.total++; if (ok) store.sd.ok++; save(); host.querySelector('#nst').innerHTML = stat(); }
        if (ok) {
          done = true; b.classList.add('ok');
          fb.innerHTML = '<div class="fb ok"><strong class="t">Benar!</strong> Ada ' + terb(pr.n) + ' ' + pr.nama + '.</div>';
          if (TTS.ok) speak(terb(pr.n) + ' ' + pr.nama + '.');
        } else {
          b.classList.add('bad'); b.disabled = true;
          fb.innerHTML = '<div class="fb bad"><strong class="t">Belum tepat.</strong> Hitung lagi satu per satu, hanya ' + pr.nama + '.</div>';
        }
      });
    }
    draw();
  }

  /* ----- latihan acak (dipakai banyak bagian) ----- */
  function sdPractice(host, kind, show) {
    const DEF = { dasar: 10, n9: 10, kl0: 10, kl1: 10, kl4: 10, mahir: 15, kl2: 15, kl3: 15, d1: 15, d2: 20, kls: 20, d3: 30, d4: 40, p31: 20, p32: 30, p3s: 40, s1: 20, s2: 30, s3: 40, s4: 50, fa: 40, fs: 40, fm: 40, fd: 45, fz: 30, pwm: 40, pwd: 40, pwp: 40, pwr: 40, pwv: 30, q5: 30, q50: 45, stack: 30 };
    let pr = sdProblem(kind), counted = false, st = 'ready', lim = DEF[kind] || 20, t0 = 0, tm = null, msg = '';
    const fmt = (s) => s.toFixed(1).replace('.', ',');
    const bests = () => { if (!store.sd.best) store.sd.best = {}; return store.sd.best; };
    const stat = () => '<span>Benar <b>' + store.sd.ok + '</b> dari <b>' + store.sd.total + '</b></span>' + (bests()[kind] ? '<span>Tercepat <b>' + fmt(bests()[kind]) + '</b> detik</span>' : '');
    const stop = () => { if (tm) { clearInterval(tm); tm = null; } };
    const chips = () => '<div class="qn" style="margin-top:12px">Waktu</div><div class="chips" id="tl" role="group" aria-label="Pilih waktu">' +
      sdChips(Array.from(new Set([10, 20, 30, 60, lim])).sort((x, y) => x - y).map((x) => [x, x + ' detik']), lim, 'data-s') + '</div>';
    const ansForm = (off) => {
      const two = pr.rem !== undefined || pr.fr, l1 = pr.fr ? 'Pembilang' : 'Hasil', l2 = pr.fr ? 'Penyebut' : 'Sisa';
      return '<form class="ansrow" id="pf" autocomplete="off"><input class="field" style="width:' + (two ? 100 : 150) + 'px" id="pi" type="text" inputmode="numeric" aria-label="' + (two ? l1 : 'Jawabanmu') + '"' + (two ? ' placeholder="' + l1 + '"' : '') + off + '>' +
        (two ? '<input class="field" style="width:100px" id="pi2" type="text" inputmode="numeric" aria-label="' + l2 + '" placeholder="' + l2 + '"' + off + '>' : '') + '<button class="btn" type="submit"' + off + '>Periksa</button></form>';
    };
    function prompt() {
      if (pr.html) return '<p class="qtext eq" style="font-size:24px">' + pr.html + ' = …</p>' + (pr.fr ? '<p class="muted" style="margin:6px 0 0;font-size:14px">Tulis hasil sebagai pembilang dan penyebut (kebalikan dari pangkat positifnya).</p>' : '');
      if (pr.fr) return '<p class="qtext eq" style="font-size:24px">' + frH(pr.a, pr.b) + (pr.op ? ' ' + pr.op + ' ' + frH(pr.c, pr.d) : '') + ' = …</p><p class="muted" style="margin:6px 0 0;font-size:14px">Tulis hasil paling sederhana sebagai pembilang dan penyebut. Bilangan bulat: penyebut 1.</p>';
      if (pr.list) return '<table class="sd-run" aria-label="Jumlahkan ke bawah">' + pr.list.map((x, i) => '<tr><td>' + x + '</td><td class="sb">' + (i === pr.list.length - 1 ? '+' : '') + '</td></tr>').join('') + '<tr class="ln"><td>?</td><td></td></tr></table>';
      return '<p class="qtext eq" style="font-size:24px">' + pr.a + ' ' + (pr.op || '+') + ' ' + pr.b + ' = …' + (pr.rem !== undefined ? ' sisa …' : '') + '</p>';
    }
    const eqText = () => (pr.show ? pr.show : pr.list ? 'jumlahnya ' + pr.ans : pr.a + ' ' + (pr.op || '+') + ' ' + pr.b + ' = ' + pr.ans + (pr.rem !== undefined ? ' sisa ' + pr.rem : ''));
    function count(ok) {
      if (counted) return;
      counted = true; store.sd.total++; if (ok) store.sd.ok++; save();
      const s = host.querySelector('#pst'); if (s) s.innerHTML = stat();
    }
    function draw() {
      stop();
      const q = (s) => host.querySelector(s);
      let h = '<div class="card"><h3>Latihan</h3>';
      if (st === 'ready') {
        h += '<p class="muted" style="margin:0">Jawab secepat mungkin sebelum waktu habis. Kalau habis, jawabannya ditampilkan.</p>' + chips() + '<div class="row"><button type="button" class="btn" id="pgo">Mulai</button></div>';
      } else {
        const off = st === 'done' ? ' disabled' : '';
        h += '<div class="qn">' + (pr.lab || (pr.op ? 'Hitunglah' : 'Jumlahkan')) + '</div>' + prompt() +
          (st === 'run' ? '<div class="sd-timer" role="timer" aria-label="Sisa waktu"><div class="sd-tbar"><i id="tbar"></i></div><b id="tnum">' + lim + '</b></div>' : '') +
          ansForm(off) +
          '<div id="pfb" aria-live="polite">' + msg + '</div>';
        if (st === 'done') h += '<div class="row"><button type="button" class="btn" id="pnext">Soal berikutnya</button>' + (show ? '<button type="button" class="chip sm" id="pshow">Bahas di atas</button>' : '') + '</div>' + chips();
      }
      host.innerHTML = h + '<p class="stats" id="pst">' + stat() + '</p></div>';
      const tl = q('#tl'); if (tl) tl.addEventListener('click', (e) => { const b = e.target.closest('[data-s]'); if (b) { lim = +b.dataset.s; draw(); } });
      const go = q('#pgo'); if (go) go.addEventListener('click', begin);
      const nx = q('#pnext'); if (nx) nx.addEventListener('click', () => { pr = sdProblem(kind); begin(); });
      const sh = q('#pshow'); if (sh) sh.addEventListener('click', () => (pr.list ? show(pr.list) : show(pr.a, pr.b, pr)));
      if (st === 'run') { q('#pf').addEventListener('submit', submit); q('#pi').focus(); tm = setInterval(tick, 100); }
    }
    function begin() { counted = false; msg = ''; st = 'run'; t0 = performance.now(); draw(); }
    function tick() {
      if (!host.isConnected) { stop(); return; }
      const rem = lim - (performance.now() - t0) / 1000;
      if (rem <= 0) { finish(false); return; }
      const n = host.querySelector('#tnum'), bar = host.querySelector('#tbar'), box = host.querySelector('.sd-timer');
      if (n) n.textContent = Math.ceil(rem);
      if (bar) bar.style.width = (rem / lim * 100) + '%';
      if (box) box.classList.toggle('low', rem <= 3);
    }
    function submit(e) {
      e.preventDefault();
      const inp = host.querySelector('#pi'), v = parseAns(inp.value), fb = host.querySelector('#pfb');
      if (isNaN(v)) { fb.innerHTML = '<div class="fb bad"><strong class="t">Tulis jawabanmu dulu</strong> berupa bilangan bulat.</div>'; return; }
      if (pr.fr) {
        const v2 = parseAns(host.querySelector('#pi2').value);
        if (isNaN(v2)) { fb.innerHTML = '<div class="fb bad"><strong class="t">Tulis pembilang dan penyebutnya</strong> berupa bilangan bulat.</div>'; return; }
        if (v2 <= 0) { fb.innerHTML = '<div class="fb bad"><strong class="t">Penyebut harus lebih dari 0.</strong></div>'; return; }
        if (v === pr.ansN && v2 === pr.ansD) { finish(true); return; }
        if (v * pr.ansD === pr.ansN * v2) { fb.innerHTML = '<div class="fb bad"><strong class="t">Nilainya sudah tepat,</strong> tetapi belum paling sederhana. Sederhanakan lagi.</div>'; inp.select(); return; }
        count(false);
        fb.innerHTML = '<div class="fb bad"><strong class="t">Belum tepat.</strong> Coba lagi selagi waktu masih ada.</div>';
        inp.select();
        return;
      }
      if (pr.rem !== undefined) {
        const v2 = parseAns(host.querySelector('#pi2').value);
        if (isNaN(v2)) { fb.innerHTML = '<div class="fb bad"><strong class="t">Tulis hasil bagi dan sisanya</strong> berupa bilangan bulat. Kalau tidak ada sisa, tulis 0.</div>'; return; }
        if (v === pr.ans && v2 === pr.rem) { finish(true); return; }
        count(false);
        fb.innerHTML = '<div class="fb bad"><strong class="t">Belum tepat.</strong> ' + (v === pr.ans ? 'Hasil baginya sudah tepat, periksa lagi sisanya.' : v2 === pr.rem ? 'Sisanya sudah tepat, periksa lagi hasil baginya.' : 'Coba lagi selagi waktu masih ada.') + '</div>';
        inp.select();
        return;
      }
      if (v === pr.ans) { finish(true); return; }
      count(false);
      fb.innerHTML = '<div class="fb bad"><strong class="t">Belum tepat.</strong> Coba lagi selagi waktu masih ada.</div>';
      inp.select();
    }
    function finish(ok) {
      stop();
      const used = Math.round((performance.now() - t0) / 100) / 10;
      count(ok);
      if (ok) {
        const B = bests(); let rec = '';
        if (!B[kind] || used < B[kind]) { B[kind] = used; rec = ' Rekor tercepat baru!'; save(); }
        msg = '<div class="fb ok"><strong class="t">Benar!</strong> Selesai dalam ' + fmt(used) + ' detik.' + rec + '</div>';
      } else msg = '<div class="fb bad"><strong class="t">Waktu habis!</strong> Jawabannya: <b>' + supify(eqText()) + '</b></div>';
      st = 'done'; draw();
    }
    draw();
  }

  /* ----- 3. Hasil 1 sampai 10 ----- */
  function sdSepuluh(c) {
    const trees = sdRange(1, 9).map((n) => '<div class="sd-tree"><div class="hd">' + n + '</div><div class="pr">' + sdPairs(n).map((p) => p[0] + ' <i>+</i> ' + p[1]).join('<br>') + '</div></div>').join('');
    const T = [[9, 1, 'S', 'Sembilan, Satu'], [8, 2, 'D', 'Delapan, Dua'], [7, 3, 'T', 'Tujuh, Tiga'], [6, 4, 'É', 'Enam, Empat'], [5, 5, 'L', 'Lima, Lima']];
    c.innerHTML = '<div class="card"><h3>Penjumlahan yang hasilnya 1 – 10</h3><div class="sd-trees">' + trees + '</div>' +
      '<p class="muted" style="margin:10px 0 0">Jika ditunjukkan dengan jari: 2 = 1 jari + 1 jari. Ini 2, dan ini juga 2.</p>' +
      '<h4 style="margin:16px 0 0;font:800 18px var(--f-display)">Sepuluh punya lima pasangan</h4><div class="sd-ten">' +
      T.map((t) => '<div class="sd-tree"><div class="hd">10</div><div class="pr">' + t[0] + ' <i>+</i> ' + t[1] + '</div><div class="ar">↓</div><div class="pr">' + t[0] + '&nbsp;&nbsp;' + t[1] + '</div><div class="lt">' + t[2] + ' ' + t[2] + '</div><div class="nm">' + t[3] + '</div></div>').join('') + '</div>' +
      '<div class="sd-note">Huruf depan kedua bilangan sama, jadi mudah diingat: S S, D D, T T, É É, L L.</div></div><div id="sdpr"></div>';
    sdPractice($('#sdpr'), 'dasar');
  }

  /* ----- 4 dan 5. Titik dan kotak 10 ----- */
  function sdDotsHTML(a, b, step) {
    const D = sdDots(a, b), max = D.ten ? 1 : 3, st = Math.min(step, max), plus = '<span class="sd-plus" aria-hidden="true">+</span>';
    let L, R = sdGroup(sdDotGrid(D.ten ? b : (st >= 1 ? D.rest : b), 'o'), (D.ten ? b : (st >= 1 ? D.rest : b)) + ' titik'), cap, res = '';
    if (D.ten) {
      L = sdBox('10 titik');
      cap = st === 0 ? '10 titik diwakili satu kotak. Tambahkan ' + b + ' titik.' : '10 titik sudah penuh, tinggal ditambah ' + b + ' titik.';
      if (st === 1) res = '<div class="sd-res">10 + ' + b + ' = <b>' + D.sum + '</b></div>';
    } else if (st === 0) {
      L = sdGroup(sdDotGrid(a), a + ' titik'); cap = a + ' titik ditambah ' + b + ' titik.';
    } else if (st === 1) {
      L = sdGroup('<div class="sd-dots">' + sdRange(1, a).map(() => '<span class="sd-dot"></span>').join('') + sdRange(1, D.move).map(() => '<span class="sd-dot m"></span>').join('') + '</div>', '10 titik');
      cap = a + ' titik kurang ' + D.move + ' untuk jadi 10. Ambil ' + D.move + ' titik dari ' + b + ', pindahkan ke ' + a + '. Tersisa ' + D.rest + ' titik.';
    } else {
      L = sdBox('10 titik'); cap = '10 titik diwakili satu kotak. Sisa ' + D.rest + ' titik.';
      if (st === 3) res = '<div class="sd-res">' + a + ' + ' + b + ' = 10 + ' + D.rest + ' = <b>' + D.sum + '</b></div>';
    }
    return { html: '<div class="sd-demo">' + L + plus + R + '</div>' + res, cap: cap, max: max };
  }

  function sdDotsDemo(host, fixedNine) {
    if (fixedNine) sds.a = 9;
    const okB = () => { const v = sdValidB(sds.a); if (v.indexOf(sds.b) < 0) sds.b = v[Math.floor(v.length / 2)]; };
    okB();
    host.innerHTML = (fixedNine ? '' : '<p class="muted" style="margin:0 0 6px">Pilih bilangan pertama:</p><div class="chips" id="sda" role="group" aria-label="Bilangan pertama"></div>') +
      '<p class="muted" style="margin:10px 0 6px">Pilih bilangan yang ditambahkan:</p><div class="chips" id="sdb" role="group" aria-label="Bilangan kedua"></div>' +
      '<div id="sdd" aria-live="polite"></div><div class="spline" id="sdcap"></div>' +
      '<div class="row"><button type="button" class="btn ghost" id="sdprev">Mundur</button><button type="button" class="btn" id="sdnext">Lanjut</button></div>';
    function paint() {
      okB();
      if (!fixedNine) host.querySelector('#sda').innerHTML = sdChips([10, 9, 8, 7, 6].map((x) => [x, x + ' +']), sds.a, 'data-a');
      host.querySelector('#sdb').innerHTML = sdChips(sdValidB(sds.a).map((x) => [x, String(x)]), sds.b, 'data-b');
      const r = sdDotsHTML(sds.a, sds.b, sds.step);
      host.querySelector('#sdd').innerHTML = r.html; host.querySelector('#sdcap').textContent = r.cap;
      host.querySelector('#sdprev').disabled = sds.step === 0;
      host.querySelector('#sdnext').textContent = sds.step >= r.max ? 'Ulangi' : 'Lanjut';
    }
    host.addEventListener('click', (e) => {
      const a = e.target.closest('[data-a]'), b = e.target.closest('[data-b]');
      if (a) { sds.a = +a.dataset.a; sds.step = 0; paint(); }
      else if (b) { sds.b = +b.dataset.b; sds.step = 0; paint(); }
      else if (e.target.id === 'sdprev') { if (sds.step > 0) { sds.step--; paint(); } }
      else if (e.target.id === 'sdnext') { const m = sdDotsHTML(sds.a, sds.b, 0).max; sds.step = sds.step >= m ? 0 : sds.step + 1; paint(); }
    });
    paint();
    return { show: (a, b) => { const big = Math.max(a, b), sm = Math.min(a, b); sds.a = fixedNine ? 9 : big; sds.b = fixedNine ? b : sm; sds.step = 0; paint(); host.scrollIntoView({ block: 'start', behavior: 'smooth' }); } };
  }

  function sdSembilan(c) {
    c.innerHTML = '<div class="card"><h3>Contoh 9+</h3><p style="margin:0">Sembilan titik hanya kurang satu untuk jadi 10. <mark>Pindahkan satu titik</mark> dari bilangan yang ditambahkan.</p><div id="sdx"></div>' +
      '<h4 style="margin:16px 0 6px;font:800 17px var(--f-display)">Dengan demikian</h4><div class="rule">Sembilan agar jadi 10<br>Satu titik dipindahkan<br>Berarti titik b: ambil 1, tinggal (b − 1)<br><br>9 + 8: ambil 1 → 10 + 7 = 17<br>9 + 9: ambil 1 → 10 + 8 = 18</div></div><div id="sdpr"></div>';
    sdPractice($('#sdpr'), 'n9', sdDotsDemo($('#sdx'), true).show);
  }

  function sdLima(c) {

  /* ----- kartu hitung dengan isian dan contoh (dipakai 3 bagian) ----- */
  function sdCalcCard(host, cfg) {
    const mx = { d1: [2, 1], d2: [2, 2], d3: [3, 3], d4: [4, 4], p31: [3, 1], p32: [3, 2], p3s: [3, 2], s1: [2, 1], s2: [2, 2], s3: [3, 3], s4: [4, 4] }[cfg.kind], OP = cfg.op || '+';
    let cur = { a: cfg.ex[0][0], b: cfg.ex[0][1] }, v = 0, st = 0;
    const ns = () => (typeof cfg.steps === 'function' ? cfg.steps(cur.a, cur.b) : cfg.steps);
    host.innerHTML = '<div class="card pop cmp"><h3>' + cfg.title + '</h3>' + (cfg.desc ? '<p class="muted cmpdesc" style="margin:4px 0 8px">' + cfg.desc + '</p>' : '') +
      '<div class="chips" id="cex">' + cfg.ex.map((p, i) => '<button type="button" class="chip sm" data-i="' + i + '">' + p[0] + ' ' + OP + ' ' + p[1] + '</button>').join('') + '</div>' +
      '<form class="ins" id="cf" autocomplete="off" style="margin-top:10px"><label class="ni"><span>Pertama</span><input class="field num" id="ca" type="text" inputmode="numeric" maxlength="' + mx[0] + '"></label><span class="big" aria-hidden="true" style="padding-bottom:10px">' + OP + '</span>' +
      '<label class="ni"><span>Kedua</span><input class="field num" id="cb" type="text" inputmode="numeric" maxlength="' + mx[1] + '"></label><button class="btn" type="submit">Hitung</button><button class="btn ghost" type="button" id="crand">Acak</button></form>' +
      '<p class="err" id="cerr" style="margin:8px 0 0"></p>' + (cfg.steps ? STEPROW : '') + (cfg.tabs ? '<div class="chips" id="ctabs" style="margin-top:10px" role="group" aria-label="Cara"></div>' : '') + '<div id="cout" style="margin-top:6px" aria-live="polite"></div></div>';
    const q = (s) => host.querySelector(s);
    function paint() {
      q('#ca').value = cur.a; q('#cb').value = cur.b; q('#cerr').textContent = '';
      if (cfg.tabs) q('#ctabs').innerHTML = sdChips(cfg.tabs.map((t, i) => [i, t]), v, 'data-v');
      q('#cout').innerHTML = cfg.render(cur.a, cur.b, v, st);
      if (cfg.steps) { q('#cstep').hidden = cfg.stepTab != null && v !== cfg.stepTab; q('#cmu').disabled = st === 0; q('#cma').textContent = st >= ns() ? 'Ulangi' : 'Lanjut'; }
    }
    host.addEventListener('click', (e) => {
      const x = e.target.closest('[data-i]'), t = e.target.closest('[data-v]');
      if (x) { cur = { a: cfg.ex[+x.dataset.i][0], b: cfg.ex[+x.dataset.i][1] }; st = 0; paint(); }
      else if (t) { v = +t.dataset.v; sds.view = v; paint(); }
      else if (e.target.id === 'crand') { const p = sdProblem(cfg.kind); cur = { a: p.a, b: p.b }; st = 0; paint(); }
      else if (e.target.id === 'cmu') { if (st > 0) { st--; paint(); } }
      else if (e.target.id === 'cma') { st = st >= ns() ? 0 : st + 1; paint(); }
    });
    q('#cf').addEventListener('submit', (e) => {
      e.preventDefault();
      const r = sdCheck(cfg.kind, q('#ca').value, q('#cb').value);
      if (r.err) { q('#cerr').textContent = r.err; return; }
      cur = { a: r.a, b: r.b }; st = 0; paint();
    });
    v = cfg.tabs ? Math.min(sds.view, cfg.tabs.length - 1) : 0;
    paint();
    return { show: (a, b) => { cur = { a: a, b: b }; st = 0; paint(); host.scrollIntoView({ block: 'start', behavior: 'smooth' }); } };
  }

  /* ----- Penjumlahan 2 dan 3 digit: hasil tiap kolom ditulis dalam satu baris, angka kecil (di samping) = disimpan ----- */
  const sdCell = (big, small, on) => '<td' + (on ? ' class="on"' : '') + '>' + big + (small ? '<sup class="sv">' + small + '</sup>' : '') + '</td>';
  const sdLine = (n) => '<tr class="ln"><td></td>' + sdRange(1, n).map(() => '<td></td>').join('') + '</tr>';

  function sdCara2HTML(a, b, st) {
    const G = sdCara2(a, b), cols = ['Ratusan', 'Puluhan', 'Satuan'], hl = (i, f) => (f && i === 1 ? ' class="on"' : '') ;
    const opRow = (arr, lab) => '<tr><td' + (lab ? ' class="pl">+' : '>') + '</td>' + arr.map((x, i) => '<td' + ((st === 1 && i === 1) || (st === 2 && i === 2) ? ' class="on"' : '') + '>' + x + '</td>').join('') + '</tr>';
    let h = '<table class="sd-add" aria-label="Penjumlahan dua digit"><tr class="hd"><td></td>' + cols.map((c) => '<td>' + c + '</td>').join('') + '</tr>' +
      opRow(['', G.a1, G.a0], false) + opRow(['', b >= 10 ? G.b1 : '', G.b0], true) + sdLine(3);
    if (st >= 1) h += '<tr class="rs"><td></td>' + sdCell(G.x1 || '', '', st === 1 && G.x1) + sdCell(G.x2, st >= 2 && G.y1 ? G.y1 : '', st === 1 || (st === 2 && G.y1)) + sdCell(st >= 2 ? G.y2 : '', '', st === 2) + '</tr>';
    if (st >= 3) h += sdLine(3) + (G.tc ? '<tr class="cy"><td></td><td>' + G.tc + '</td><td></td><td></td></tr>' : '') + '<tr class="rs"><td></td>' + G.digits.map((x, i) => '<td>' + (i === 0 && !x ? '' : x) + '</td>').join('') + '</tr>';
    h += '</table>';
    let txt;
    if (st === 0) txt = 'Tekan Lanjut. Jumlahkan langsung puluhan dengan puluhan, satuan dengan satuan.';
    else if (st === 1) txt = 'Puluhan: ' + G.a1 + ' + ' + (b >= 10 ? G.b1 : 0) + ' = ' + G.s0 + '. ' + (G.x1 ? 'Tulis ' + G.x1 + ' di kolom ratusan dan ' + G.x2 + ' di kolom puluhan.' : 'Tulis ' + G.x2 + ' di kolom puluhan.');
    else if (st === 2) txt = 'Satuan: ' + G.a0 + ' + ' + G.b0 + ' = ' + G.s1 + '. Tulis ' + G.y2 + ' di kolom satuan' + (G.y1 ? ', dan ' + G.y1 + ' kecil disimpan di samping kolom puluhan.' : '.');
    else txt = 'Jumlahkan ke bawah. Satuan: ' + G.y2 + '. Puluhan: ' + G.x2 + ' + ' + G.y1 + ' = ' + G.t + (G.tc ? ', tulis ' + (G.t - 10) + ' dan simpan 1 kecil ke ratusan' : '') + '.' + (G.digits[0] ? ' Ratusan: ' + G.digits[0] + '.' : '') + ' Hasilnya ' + G.total + '.';
    return h + '<p class="spline" style="margin-top:8px">' + txt + '</p>' + (st >= 3 ? '<div class="sd-res">' + a + ' + ' + b + ' = <b>' + G.total + '</b></div>' : '');
  }

  function sdCara3HTML(a, b, st) {
    const G = sdCara3(a, b), cols = ['Ribuan', 'Ratusan', 'Puluhan', 'Satuan'];
    const p2 = Math.floor(G.s2 / 10), q2 = G.s2 % 10, p1 = Math.floor(G.s1 / 10), q1 = G.s1 % 10, p0 = Math.floor(G.s0 / 10), q0 = G.s0 % 10;
    const opRow = (arr, lab) => '<tr><td' + (lab ? ' class="pl">+' : '>') + '</td>' + arr.map((x, i) => '<td' + (st >= 1 && st <= 3 && i === st ? ' class="on"' : '') + '>' + x + '</td>').join('') + '</tr>';
    let h = '<table class="sd-add" aria-label="Penjumlahan tiga digit"><tr class="hd"><td></td>' + cols.map((c) => '<td>' + c + '</td>').join('') + '</tr>' +
      opRow(['', G.a2, G.a1, G.a0], false) + opRow(['', G.b2, G.b1, G.b0], true) + sdLine(4);
    if (st >= 1) h += '<tr class="rs"><td></td>' + sdCell(p2 || '', '', st === 1 && p2) + sdCell(q2, st >= 2 && p1 ? p1 : '', st === 1 || (st === 2 && p1)) +
      sdCell(st >= 2 ? q1 : '', st >= 3 && p0 ? p0 : '', st === 2 || (st === 3 && p0)) + sdCell(st >= 3 ? q0 : '', '', st === 3) + '</tr>';
    if (st >= 4) h += sdLine(4) + (G.k1 || G.k2 ? '<tr class="cy"><td></td><td>' + (G.k2 || '') + '</td><td>' + (G.k1 || '') + '</td><td></td><td></td></tr>' : '') +
      '<tr class="rs"><td></td>' + G.digits.map((x, i) => '<td>' + (i === 0 && !x ? '' : x) + '</td>').join('') + '</tr>';
    h += '</table>';
    let txt;
    if (st === 0) txt = 'Tekan Lanjut. Jumlahkan langsung ratusan, puluhan, dan satuan.';
    else if (st === 1) txt = 'Ratusan: ' + G.a2 + ' + ' + G.b2 + ' = ' + G.s2 + '. ' + (p2 ? 'Tulis ' + p2 + ' di kolom ribuan dan ' + q2 + ' di kolom ratusan.' : 'Tulis ' + q2 + ' di kolom ratusan.');
    else if (st === 2) txt = 'Puluhan: ' + G.a1 + ' + ' + G.b1 + ' = ' + G.s1 + '. Tulis ' + q1 + ' di kolom puluhan' + (p1 ? ', dan ' + p1 + ' kecil disimpan di samping kolom ratusan.' : '.');
    else if (st === 3) txt = 'Satuan: ' + G.a0 + ' + ' + G.b0 + ' = ' + G.s0 + '. Tulis ' + q0 + ' di kolom satuan' + (p0 ? ', dan ' + p0 + ' kecil disimpan di samping kolom puluhan.' : '.');
    else txt = 'Jumlahkan ke bawah. Satuan: ' + G.d0 + '. Puluhan: ' + p0 + ' + ' + q1 + ' = ' + G.t1 + (G.k1 ? ', tulis ' + G.d1 + ' dan simpan 1 kecil' : '') + '. Ratusan: ' + p1 + ' + ' + q2 + (G.k1 ? ' + 1' : '') + ' = ' + G.t2 + (G.k2 ? ', tulis ' + G.d2 + ' dan simpan 1 kecil' : '') + '.' + (G.d3 ? ' Ribuan: ' + G.d3 + '.' : '') + ' Hasilnya ' + G.total + '.';
    return h + '<p class="spline" style="margin-top:8px">' + txt + '</p>' + (st >= 4 ? '<div class="sd-res">' + a + ' + ' + b + ' = <b>' + G.total + '</b></div>' : '');
  }

  function sdCara4HTML(a, b, st) {
    const G = sdCara4(a, b), cols = ['Puluh ribuan', 'Ribuan', 'Ratusan', 'Puluhan', 'Satuan'];
    const opRow = (arr, lab) => '<tr><td' + (lab ? ' class="pl">+' : '>') + '</td>' + arr.map((x, i) => '<td' + (st >= 1 && st <= 4 && i === st ? ' class="on"' : '') + '>' + x + '</td>').join('') + '</tr>';
    let h = '<table class="sd-add" aria-label="Penjumlahan empat digit"><tr class="hd"><td></td>' + cols.map((c) => '<td>' + c + '</td>').join('') + '</tr>' +
      opRow(['', G.A[0], G.A[1], G.A[2], G.A[3]], false) + opRow(['', G.B[0], G.B[1], G.B[2], G.B[3]], true) + sdLine(5);
    if (st >= 1) h += '<tr class="rs"><td></td>' + sdCell(G.p3 || '', '', st === 1 && G.p3) + sdCell(G.q3, st >= 2 && G.p2 ? G.p2 : '', st === 1 || (st === 2 && G.p2)) +
      sdCell(st >= 2 ? G.q2 : '', st >= 3 && G.p1 ? G.p1 : '', st === 2 || (st === 3 && G.p1)) +
      sdCell(st >= 3 ? G.q1 : '', st >= 4 && G.p0 ? G.p0 : '', st === 3 || (st === 4 && G.p0)) + sdCell(st >= 4 ? G.q0 : '', '', st === 4) + '</tr>';
    if (st >= 5) h += sdLine(5) + (G.k1 || G.k2 || G.k3 ? '<tr class="cy"><td></td><td>' + (G.k3 || '') + '</td><td>' + (G.k2 || '') + '</td><td>' + (G.k1 || '') + '</td><td></td><td></td></tr>' : '') +

    h += '</table>';
    let txt;
    if (st === 0) txt = 'Tekan Lanjut. Jumlahkan langsung ribuan, ratusan, puluhan, dan satuan.';

    else if (st === 2) txt = 'Ratusan: ' + G.A[1] + ' + ' + G.B[1] + ' = ' + G.s2 + '. Tulis ' + G.q2 + ' di kolom ratusan' + (G.p2 ? ', dan ' + G.p2 + ' kecil disimpan di samping kolom ribuan.' : '.');
    else if (st === 3) txt = 'Puluhan: ' + G.A[2] + ' + ' + G.B[2] + ' = ' + G.s1 + '. Tulis ' + G.q1 + ' di kolom puluhan' + (G.p1 ? ', dan ' + G.p1 + ' kecil disimpan di samping kolom ratusan.' : '.');

  /* ----- Pembagian: sisa ditulis kecil di samping angka berikutnya ----- */
  function sdBagiHTML(a, d, st) {
    const G = sdBagi(a, d), ds = G.ds, S = G.steps.length, cur = st >= 1 ? G.steps[st - 1] : null, prev = st >= 2 ? G.steps[st - 2] : null;
    let h = '<div class="sd-dvx" role="img" aria-label="' + a + ' dibagi ' + d + '">';
    ds.forEach((x, i) => {
      h += '<span class="dg' + (cur && cur.idx.indexOf(i) >= 0 ? ' on' : '') + '">' + x + '</span>';
      const k = G.steps.findIndex((z) => z.last === i);
      if (k >= 0 && k < st && k < S - 1 && G.steps[k].r > 0) h += '<sup class="sv' + (k === st - 2 ? ' on' : '') + '">' + G.steps[k].r + '</sup>';
    });
    h += '<span class="op">:</span><span class="dg">' + d + '</span><span class="op">=</span>' + G.steps.map((z, k) => '<span class="dg qd' + (k === st - 1 ? ' on' : '') + '">' + (k < st ? z.q : '?') + '</span>').join('') + (st >= S && G.r ? '<span class="op">sisa</span><span class="dg qd">' + G.r + '</span>' : '') + '</div>';
    let t;
    if (st === 0) t = 'Tekan Lanjut. Bagi dari depan, lalu sisa ditulis kecil di samping angka berikutnya.';
    else {
      const n = cur.chunk;
      if (st === 1) {
        if (G.L === 1) t = G.start === 1 ? 'Angka depan ' + n + ' sudah cukup besar untuk dibagi ' + d + '.' : 'Angka depan ' + ds[0] + ' lebih kecil dari ' + d + ', jadi ambil dua angka: ' + n + '.';
        else t = G.start === 2 ? 'Ambil dua angka depan: ' + n + ' (tidak lebih kecil dari ' + d + ').' : 'Dua angka depan ' + String(a).slice(0, 2) + ' lebih kecil dari ' + d + ', jadi ambil tiga angka: ' + n + '.';
      } else t = prev.r > 0 ? 'Sisa ' + prev.r + ' digabung dengan angka ' + ds[cur.idx[0]] + ' menjadi ' + n + '.' : 'Sisa 0, turunkan angka ' + ds[cur.idx[0]] + ' menjadi ' + n + '.';
      t += ' ' + n + ' : ' + d + ' = ' + cur.q + ', karena ' + d + ' × ' + cur.q + ' = ' + cur.prod + (d >= 10 ? ' (' + d + ' × ' + (cur.q + 1) + ' = ' + d * (cur.q + 1) + ' terlalu besar)' : '') + '. Sisa ' + n + ' − ' + cur.prod + ' = ' + cur.r + '.';
      if (st < S) t += ' Tulis ' + cur.q + ' di hasil' + (cur.r > 0 ? ', dan sisa ' + cur.r + ' kecil di samping angka ' + ds[cur.last] + '.' : '.');
      else t += ' Tulis ' + cur.q + ' di hasil. Hasilnya ' + G.q + (G.r ? ' sisa ' + G.r : '') + '. Cek: ' + G.q + ' × ' + d + (G.r ? ' + ' + G.r : '') + ' = ' + a + '.';
    }
    return h + '<p class="spline" style="margin-top:8px">' + t + '</p>' + (st >= S ? '<div class="sd-res">' + a + ' : ' + d + ' = <b>' + G.q + '</b>' + (G.r ? ' sisa <b>' + G.r + '</b>' : '') + '</div>' : '');
  }

  /* ----- Pengurangan: pinjam 10 dari angka di kiri ----- */
  const SDNM = ['satuan', 'puluhan', 'ratusan', 'ribuan'];
  function sdCaraSubHTML(a, b, st) {
    const G = sdCaraSub(a, b), n = G.n, cur = st >= 1 && st <= n ? st - 1 : -1, bl = String(b).length;
    const lent = [], box = [], struck = [];
    for (let i = 0; i < n; i++) { lent.push(null); box.push(false); struck.push(false); }
    G.steps.slice(0, st).forEach((s) => { if (s.borrow) { struck[s.src] = true; lent[s.src] = s.srcNew; s.chain.forEach((k) => { struck[k] = true; lent[k] = 9; }); box[s.i] = true; } });
    const order = []; for (let i = n - 1; i >= 0; i--) order.push(i);
    const on = (i) => (i === cur ? ' class="on"' : '');
    let h = '<table class="sd-add sd-sub" aria-label="Pengurangan"><tr class="hd"><td></td>' + order.map((i) => '<td>' + SDNM[i].charAt(0).toUpperCase() + SDNM[i].slice(1) + '</td>').join('') + '</tr>' +
      '<tr><td></td>' + order.map((i) => '<td' + on(i) + '><span class="sm">' + (lent[i] !== null ? lent[i] : '') + (box[i] ? (lent[i] !== null ? '\u2009' : '') + '<b>10</b>' : '') + '</span><span class="mn' + (struck[i] ? ' sx' : '') + '">' + G.A[i] + '</span></td>').join('') + '</tr>' +
      '<tr><td class="pl">−</td>' + order.map((i) => '<td' + on(i) + '>' + (i < bl ? G.B[i] : '') + '</td>').join('') + '</tr>' + sdLine(n) +
      '<tr class="rs"><td></td>' + order.map((i) => '<td' + on(i) + '>' + (i < st ? (st >= n && G.lead[i] ? '' : G.res[i]) : '') + '</td>').join('') + '</tr></table>';
    let t;
    if (st === 0) t = 'Tekan Lanjut. Kurangi dari satuan (kanan) ke kiri. Kalau angka atas kurang, pinjam dari angka di kirinya.';
    else {
      const s = G.steps[st - 1], nm = SDNM[s.i].charAt(0).toUpperCase() + SDNM[s.i].slice(1);
      if (!s.borrow) t = nm + ': ' + s.top + ' − ' + s.bot + ' = ' + s.d + '. Tulis ' + s.d + '.';
      else {
        t = nm + ': ' + s.top + ' tidak cukup dikurangi ' + s.bot + '. Pinjam dari ' + SDNM[s.src] + (s.chain.length ? ' (' + s.chain.map((k) => SDNM[k]).join(' dan ') + ' bernilai 0, jadi dilewati)' : '') + ': ' + s.srcOld + ' menjadi ' + s.srcNew +
          (s.chain.length ? ', dan ' + s.chain.map((k) => SDNM[k]).join(' dan ') + ' menjadi 9' : '') + '. ' + nm + ' mendapat tambahan 10: 10 + ' + s.top + ' = ' + s.tot + '. Lalu ' + s.tot + ' − ' + s.bot + ' = ' + s.d + '. Tulis ' + s.d + '.';
      }
      if (st >= n) t += ' Hasilnya ' + G.total + '. Cek: ' + G.total + ' + ' + b + ' = ' + a + '.';
    }
    return h + '<p class="spline" style="margin-top:8px">' + t + '</p>' + (st >= n ? '<div class="sd-res">' + a + ' − ' + b + ' = <b>' + G.total + '</b></div>' : '');
  }

  const SDK_RULE = ['Kurangi dari satuan (kanan) ke kiri.', 'Kalau angka atas lebih kecil dari angka bawah, <b>pinjam</b> dari angka di kirinya: angka itu dicoret dan angka barunya (berkurang 1) ditulis kecil di atasnya.', 'Angka yang meminjam mendapat tambahan <b>10</b> (tulis 10 kecil di dalam kotak), lalu kurangi.'];

  /* ===================== Pecahan (Materi SD) ===================== */
  /* Gambar ekspresi pecahan sebagai SVG: pecahan, tanda, hasil, panah silang, dan angka lama yang dicoret. */
  function frSvg(F) {
    const CW = 17, FS = 28, H = 114, hl = F.hl || [], len = (v) => String(v).length;
    const items = [{ k: 'fr', id: 'f1', n: F.f1.n, d: F.f1.d }];
    if (F.f2) { items.push({ k: 'op', s: F.op }); items.push({ k: 'fr', id: 'f2', n: F.f2.n, d: F.f2.d }); }
    items.push({ k: 'op', s: '=' });
    items.push({ k: 'fr', id: 'r', n: F.rn == null ? '?' : F.rn, d: F.rd == null ? '?' : F.rd });
    if (F.ext) { items.push({ k: 'op', s: '=' }); items.push({ k: 'mix', e: F.ext }); }
    const fw = (n, d) => Math.max(len(n), len(d)) * CW + 22;
    const widthOf = (it) => (it.k === 'op' ? 30 : it.k === 'fr' ? fw(it.n, it.d) : len(it.e.w) * CW + 14 + (it.e.n !== undefined ? fw(it.e.n, it.e.d) : 0));
    const pos = {}; let x = 8, body = '', aria = [];
    const txt = (cx, y, v, color, size) => '<text x="' + cx + '" y="' + y + '" text-anchor="middle" style="font:700 ' + (size || FS) + 'px var(--f-mono);fill:' + color + '">' + v + '</text>';
    const box = (cx, y, l) => '<rect x="' + (cx - l * CW / 2 - 5) + '" y="' + (y - 26) + '" width="' + (l * CW + 10) + '" height="34" rx="7" style="fill:var(--hi)"/>';
    const drawFr = (id, n, d, cx, w, res) => {
      [['n', n, 40], ['d', d, 84]].forEach((p) => {
        const key = id + p[0], hot = hl.indexOf(key) >= 0, v = p[1], unk = v === '?';
        pos[key] = { x: cx, y: p[2], l: len(v) };
        if (hot) body += box(cx, p[2], len(v));
        body += txt(cx, p[2], v, hot ? 'var(--hi-ink)' : unk ? 'var(--muted)' : res ? 'var(--neg)' : 'var(--ink)');
        if (F.old && F.old[key] != null) body += '<text x="' + cx + '" y="' + (p[0] === 'n' ? 13 : 108) + '" text-anchor="middle" style="font:600 15px var(--f-mono);fill:var(--muted);text-decoration:line-through">' + F.old[key] + '</text>';
      });
      body += '<line x1="' + (cx - w / 2 + 3) + '" y1="52" x2="' + (cx + w / 2 - 3) + '" y2="52" style="stroke:' + (res ? 'var(--neg)' : 'var(--ink)') + ';stroke-width:3.5;stroke-linecap:round"/>';
    };
    items.forEach((it) => {
      const w = widthOf(it), cx = x + w / 2;
      if (it.k === 'op') { body += txt(cx, 62, it.s, 'var(--ink)', 30); aria.push(it.s); }
      else if (it.k === 'fr') { drawFr(it.id, it.n, it.d, cx, w, it.id === 'r'); aria.push(it.n + ' per ' + it.d); }
      else {
        const wl = len(it.e.w) * CW + 14;
        body += txt(x + wl / 2, 64, it.e.w, 'var(--neg)', 34);
        if (it.e.n !== undefined) { const fwid = fw(it.e.n, it.e.d), fcx = x + wl + fwid / 2; body += txt(fcx, 40, it.e.n, 'var(--neg)') + txt(fcx, 84, it.e.d, 'var(--neg)') + '<line x1="' + (fcx - fwid / 2 + 3) + '" y1="52" x2="' + (fcx + fwid / 2 - 3) + '" y2="52" style="stroke:var(--neg);stroke-width:3.5;stroke-linecap:round"/>'; }
        aria.push(it.e.n === undefined ? String(it.e.w) : it.e.w + ' ' + it.e.n + ' per ' + it.e.d);
      }
      x += w + 8;
    });
    (F.arrows || []).forEach((ar) => {
      const p = pos[ar[0]], q = pos[ar[1]]; if (!p || !q) return;
      const dir = q.x > p.x ? 1 : -1;
      body += '<line x1="' + (p.x + dir * (p.l * CW / 2 + 6)) + '" y1="' + (p.y - 10) + '" x2="' + (q.x - dir * (q.l * CW / 2 + 6)) + '" y2="' + (q.y - 10) + '" style="stroke:var(--x);stroke-width:3;stroke-linecap:round"' + (ar[2] === 'arrow' ? ' marker-end="url(#frah)"' : '') + '/>';
    });
    const W = x + 4;
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" class="frs" style="width:100%;max-width:' + Math.max(W, 260) + 'px;display:block;margin:2px auto" role="img" aria-label="' + aria.join(' ') + '"><defs><marker id="frah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--x)"/></marker></defs>' + body + '</svg>';
  }

  function frBarSvg(n, d, label) {
    const wholes = Math.max(1, Math.ceil(n / d)), W = 320, bh = 26, gap = 8, H = wholes * (bh + gap) + 2;
    let s = '<svg viewBox="0 0 ' + (W + 4) + ' ' + H + '" style="width:100%;max-width:360px;display:block;margin:3px auto" role="img" aria-label="' + label + '">';
    for (let k = 0; k < wholes; k++) {
      const y = 2 + k * (bh + gap), filled = Math.max(0, Math.min(d, n - k * d)), sw = W / d;
      for (let i = 0; i < d; i++) s += '<rect x="' + (2 + i * sw) + '" y="' + y + '" width="' + sw + '" height="' + bh + '" style="fill:' + (i < filled ? 'var(--c2)' : 'var(--paper)') + ';stroke:var(--ink);stroke-width:2"/>';
    }
    return s + '</svg>';
  }
  function frPieSvg(n, d, label) {
    const wholes = Math.max(1, Math.ceil(n / d)), R = 42, W = wholes * (2 * R + 12) + 2, H = 2 * R + 4;
    let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:' + W + 'px;max-width:100%;display:block" role="img" aria-label="' + label + '">';
    for (let k = 0; k < wholes; k++) {
      const cx = 2 + R + k * (2 * R + 12), cy = R + 2, filled = Math.max(0, Math.min(d, n - k * d));
      for (let i = 0; i < d; i++) {
        const a1 = i * 2 * Math.PI / d - Math.PI / 2, a2 = (i + 1) * 2 * Math.PI / d - Math.PI / 2;
        s += '<path d="M' + cx + ' ' + cy + 'L' + (cx + R * Math.cos(a1)).toFixed(2) + ' ' + (cy + R * Math.sin(a1)).toFixed(2) + 'A' + R + ' ' + R + ' 0 0 1 ' + (cx + R * Math.cos(a2)).toFixed(2) + ' ' + (cy + R * Math.sin(a2)).toFixed(2) + 'Z" style="fill:' + (i < filled ? 'var(--c2)' : 'var(--paper)') + ';stroke:var(--ink);stroke-width:2"/>';
      }
    }
    return s + '</svg>';
  }

  function frRender(sol, st) {
    const F = sol.frames[st], n = sol.steps.length;
    let h = frSvg(F);
    const works = sol.steps.slice(0, st).map((s, i) => '<div' + (i === st - 1 ? ' style="outline:2px solid var(--ink)"' : '') + '>' + s.work + '</div>').join('');
    if (works) h += '<div class="sd-list">' + works + '</div>';
    h += '<p class="spline" style="margin-top:8px">' + (st === 0 ? sol.intro : F.text) + '</p>';
    if (st >= n) h += '<div class="sd-res">' + sol.resultHTML + '</div>';
    return h;
  }

  function frCard(host, cfg) {
    const two = cfg.kind !== 'fz', OP = cfg.op || '';
    let cur = { a: cfg.ex[0][0], b: cfg.ex[0][1], c: cfg.ex[0][2], d: cfg.ex[0][3] }, st = 0, sol = null;
    const exTxt = (p) => p[0] + '/' + p[1] + (two ? ' ' + OP + ' ' + p[2] + '/' + p[3] : '');
    const box = (k, who) => '<span class="frin"><input class="field num" id="' + k + 'n" type="text" inputmode="numeric" maxlength="2" aria-label="Pembilang ' + who + '"><i class="bar" aria-hidden="true"></i><input class="field num" id="' + k + 'd" type="text" inputmode="numeric" maxlength="2" aria-label="Penyebut ' + who + '"></span>';
    host.innerHTML = '<div class="card pop cmp"><h3>' + cfg.title + '</h3><p class="muted cmpdesc" style="margin:4px 0 8px">' + cfg.desc + '</p>' +
      '<div class="chips" id="cex">' + cfg.ex.map((p, i) => '<button type="button" class="chip sm" data-i="' + i + '">' + exTxt(p) + '</button>').join('') + '</div>' +
      '<form class="ins" id="cf" autocomplete="off" style="margin-top:10px;align-items:center">' + box('f1', 'pertama') + (two ? '<span class="big" aria-hidden="true">' + OP + '</span>' + box('f2', 'kedua') : '') +
      '<button class="btn" type="submit">Hitung</button><button class="btn ghost" type="button" id="crand">Acak</button></form>' +
      '<p class="err" id="cerr" style="margin:8px 0 0"></p>' + STEPROW + '<div id="cout" style="margin-top:6px" aria-live="polite"></div></div>';
    const q = (s) => host.querySelector(s);
    function paint() {
      sol = frSolve(cfg.kind, cur.a, cur.b, cur.c, cur.d);
      q('#f1n').value = cur.a; q('#f1d').value = cur.b;
      if (two) { q('#f2n').value = cur.c; q('#f2d').value = cur.d; }
      q('#cerr').textContent = '';
      q('#cout').innerHTML = frRender(sol, st);
      q('#cmu').disabled = st === 0; q('#cma').textContent = st >= sol.steps.length ? 'Ulangi' : 'Lanjut';
    }
    host.addEventListener('click', (e) => {
      const x = e.target.closest('[data-i]');
      if (x) { const p = cfg.ex[+x.dataset.i]; cur = { a: p[0], b: p[1], c: p[2], d: p[3] }; st = 0; paint(); }
      else if (e.target.id === 'crand') { const p = sdProblem(cfg.kind); cur = { a: p.a, b: p.b, c: p.c, d: p.d }; st = 0; paint(); }
      else if (e.target.id === 'cmu') { if (st > 0) { st--; paint(); } }
      else if (e.target.id === 'cma') { st = st >= sol.steps.length ? 0 : st + 1; paint(); }
    });
    q('#cf').addEventListener('submit', (e) => {
      e.preventDefault();
      const r = frCheck(cfg.kind, two ? [q('#f1n').value, q('#f1d').value, q('#f2n').value, q('#f2d').value] : [q('#f1n').value, q('#f1d').value]);
      if (r.err) { q('#cerr').textContent = r.err; return; }
      cur = r; st = 0; paint();
    });
    paint();
    return { show: (a, b, pr) => { cur = { a: a, b: b, c: pr ? pr.c : undefined, d: pr ? pr.d : undefined }; st = 0; paint(); host.scrollIntoView({ block: 'start', behavior: 'smooth' }); } };
  }

  function b2Kenal(c) {

      $('#fsay').textContent = n + '/' + d + ' artinya ' + n + ' bagian dari ' + d + ' bagian yang sama besar.';

      if (n === 0) k = 'Tidak ada bagian yang diambil, jadi nilainya 0.';
      else if (n < d) k = 'Pembilang lebih kecil dari penyebut, jadi nilainya kurang dari 1.';

  function pwRender(sol, st) {
    const F = sol.frames[st], n = sol.steps.length;
    let h = '<div class="pweq" aria-live="polite">' + F.eq + '</div>';
    const works = sol.steps.slice(0, st).map((s, i) => '<div' + (i === st - 1 ? ' style="outline:2px solid var(--ink)"' : '') + '>' + s.work + '</div>').join('');
    if (works) h += '<div class="sd-list">' + works + '</div>';
    h += '<p class="spline" style="margin-top:8px">' + supify(st === 0 ? sol.intro : F.text) + '</p>';
    if (st >= n) h += '<div class="sd-res">' + sol.resultHTML + '</div>';
    return h;
  }

  function pwCard(host, cfg) {
    const kind = cfg.kind, nf = cfg.fields.length;
    let cur = cfg.ex[0].slice(), st = 0, sol = null;
    const exTxt = (v) => { const r = pwRun(kind, v); return r.err ? esc(v.join(', ')) : r.sol.html; };
    host.innerHTML = '<div class="card pop cmp"><h3>' + cfg.title + '</h3><p class="muted cmpdesc" style="margin:4px 0 8px">' + cfg.desc + '</p>' +
      '<div class="chips" id="cex">' + cfg.ex.map((v, i) => '<button type="button" class="chip sm" data-i="' + i + '">' + exTxt(v) + '</button>').join('') + '</div>' +
      '<form class="ins" id="cf" autocomplete="off" style="margin-top:10px;align-items:flex-end">' + cfg.fields.map((f, i) => '<label class="ni"><span>' + f + '</span><input class="field" id="pf' + i + '" type="text" inputmode="text" autocomplete="off" style="width:' + (nf === 1 ? 120 : 84) + 'px"></label>').join('') +
      '<button class="btn" type="submit">Hitung</button><button class="btn ghost" type="button" id="crand">Acak</button></form>' +
      '<p class="err" id="cerr" style="margin:8px 0 0"></p>' + STEPROW + '<div id="cout" style="margin-top:6px" aria-live="polite"></div></div>';
    const q = (s) => host.querySelector(s);
    function paint() {
      const r = pwRun(kind, cur);
      cur.forEach((v, i) => { q('#pf' + i).value = v; });
      if (r.err) { q('#cerr').textContent = r.err; return; }
      sol = r.sol; q('#cerr').textContent = '';
      q('#cout').innerHTML = pwRender(sol, st);
      q('#cmu').disabled = st === 0; q('#cma').textContent = st >= sol.steps.length ? 'Ulangi' : 'Lanjut';
    }
    host.addEventListener('click', (e) => {
      const x = e.target.closest('[data-i]');
      if (x) { cur = cfg.ex[+x.dataset.i].slice(); st = 0; paint(); }
      else if (e.target.id === 'crand') { const p = pwProblem(cfg.rk); if (p) { cur = p.cur.slice(); st = 0; paint(); } }
      else if (e.target.id === 'cmu') { if (st > 0) { st--; paint(); } }
      else if (e.target.id === 'cma' && sol) { st = st >= sol.steps.length ? 0 : st + 1; paint(); }
    });
    q('#cf').addEventListener('submit', (e) => {
      e.preventDefault();
      const vals = []; for (let i = 0; i < nf; i++) vals.push(q('#pf' + i).value);
      const r = pwRun(kind, vals);
      if (r.err) { q('#cerr').textContent = r.err; return; }
      cur = vals.map((v) => v.trim()); st = 0; paint();
    });
    paint();
    return { show: (a, b, pr) => { if (pr && pr.cur) { cur = pr.cur.slice(); st = 0; paint(); host.scrollIntoView({ block: 'start', behavior: 'smooth' }); } } };
  }

  function signTable(sym) {

    return '<table class="sign" aria-label="Aturan tanda">' + rows.map((r) => '<tr><td>' + r[0] + ' ' + sym + ' ' + r[1] + '</td><td class="' + r[3] + '">' + r[2] + '</td></tr>').join('') + '</table>';
  }
  function opExplain(op, a, b) {
    const A = Math.abs(a), B = Math.abs(b);
    let r, text;
    if (op === '+') {
      r = a + b;
      if (a >= 0 && b < 0) text = '(+) ketemu (−) jadi (−), jadi ' + a + ' + (−' + B + ') = ' + a + ' − ' + B + ' = ' + sgn(r) + '.';
      else if (a < 0 && b < 0) text = '(−) disatukan di luar tanda kurung: ' + sgn(a) + ' + ' + par(b) + ' = −(' + A + ' + ' + B + ') = ' + sgn(r) + '.';
      else if (a < 0) text = sgn(a) + ' + ' + b + ' sama dengan ' + b + ' − ' + A + ' = ' + sgn(r) + '.';
      else text = a + ' + ' + b + ' = ' + r + '.';
    } else if (op === '-') {
      r = a - b;
      if (b < 0) text = '(−) ketemu (−) jadi (+): ' + sgn(a) + ' − ' + par(b) + ' = ' + sgn(a) + ' + ' + B + ' = ' + sgn(r) + '.';
      else if (a < 0) text = sgn(a) + ' − ' + b + ' = −(' + A + ' + ' + b + ') = ' + sgn(r) + '.';
      else text = a + ' − ' + b + ' = ' + r + '.';
    } else if (op === '*') {
      r = a * b;
      if (a === 0 || b === 0) text = 'Bilangan apa pun dikali 0 hasilnya 0.';
      else if ((a < 0) === (b < 0)) text = 'Tanda sama, hasilnya positif: ' + A + ' × ' + B + ' = ' + fnum(r) + '.';
      else text = 'Tanda berbeda, hasilnya negatif: ' + A + ' × ' + B + ' = ' + fnum(A * B) + ', jadi ' + sgn(r) + '.';
    } else {
      if (b === 0) return { err: 'Pembagian dengan 0 tidak bisa dihitung. Ganti bilangan kedua.' };
      if (a % b !== 0) return { err: a + ' tidak habis dibagi ' + b + ', hasilnya bukan bilangan bulat. Ganti angkanya atau tekan Acak.' };
      r = a / b;
      if (a === 0) text = '0 dibagi bilangan apa pun (selain 0) hasilnya 0.';
      else if ((a < 0) === (b < 0)) text = 'Tanda sama, hasilnya positif: ' + A + ' : ' + B + ' = ' + fnum(r) + '.';
      else text = 'Tanda berbeda, hasilnya negatif: ' + A + ' : ' + B + ' = ' + fnum(A / B) + ', jadi ' + sgn(r) + '.';
    }
    return { r: r, text: text, line: sgn(a) + ' ' + OPSYM[op] + ' ' + par(b) + ' = ' + sgn(r) };
  }

  /* -- 3. sifat operasi -- */
  function mSifat(c) {
    const ni = (id, v, l) => '<label class="ni"><span>' + l + '</span><input id="' + id + '" type="number" min="-99" max="99" step="1" value="' + v + '"></label>';
    c.innerHTML =
      '<div class="card"><h3>a. Komutatif (pertukaran)</h3><div class="rule">a + b = b + a<br>a × b = b × a</div>' +
      '<div class="ins">' + ni('k1', 4, 'a') + ni('k2', 6, 'b') + '</div><div class="out" id="kout"></div></div>' +
      '<div class="card"><h3>b. Asosiatif (pengelompokan)</h3><div class="rule">(a + b) + c = a + (b + c)<br>(a × b) × c = a × (b × c)</div>' +
      '<div class="ins">' + ni('s1', 5, 'a') + ni('s2', 6, 'b') + ni('s3', 4, 'c') + '</div>' +
      '<div class="chips" style="margin-top:10px"><button type="button" class="chip sm" data-set="s:5,6,4">Contoh buku: 5, 6, 4</button><button type="button" class="chip sm" data-set="s:2,3,4">Contoh buku: 2, 3, 4</button></div>' +
      '<div class="out" id="sout"></div></div>' +
      '<div class="card"><h3>c. Distributif (penyebaran)</h3><div class="rule">a × (b + c) = (a × b) + (a × c)<br>a × (b − c) = (a × b) − (a × c)</div>' +
      '<div class="ins">' + ni('d1', 5, 'a') + ni('d2', 6, 'b') + ni('d3', 4, 'c') + '</div>' +
      '<div class="chips" style="margin-top:10px"><button type="button" class="chip sm" data-set="d:5,6,4">5 × (6 + 4)</button><button type="button" class="chip sm" data-set="d:4,9,5">4 × (9 − 5)</button></div>' +
      '<div class="out" id="dout"></div></div>';
    const blk = (lines) => '<div class="eqblock">' + lines.map(esc).join('<br>') + '</div>';
    const pill = (ok) => ok ? '<span class="ok-pill">Hasilnya sama</span>' : '<span class="bad-pill">Hasilnya berbeda</span>';
    const upd = () => {
      let a = ival('k1'), b = ival('k2');
      if (a == null || b == null) $('#kout').innerHTML = '<p class="err">Isi dengan bilangan bulat.</p>';
      else $('#kout').innerHTML =
        blk([par(a) + ' + ' + par(b) + ' = ' + par(b) + ' + ' + par(a) + ' = ' + sgn(a + b), par(a) + ' × ' + par(b) + ' = ' + par(b) + ' × ' + par(a) + ' = ' + sgn(a * b)]) + pill(true) +
        '<p style="margin:6px 0 0" class="muted">Perhatikan: pengurangan tidak bisa ditukar. ' + par(a) + ' − ' + par(b) + ' = ' + sgn(a - b) + ', sedangkan ' + par(b) + ' − ' + par(a) + ' = ' + sgn(b - a) + (a === b ? ' (sama karena a = b).' : '.') + '</p>';
      a = ival('s1'); b = ival('s2'); let z = ival('s3');
      if (a == null || b == null || z == null) $('#sout').innerHTML = '<p class="err">Isi dengan bilangan bulat.</p>';
      else $('#sout').innerHTML =
        blk(['(' + par(a) + ' + ' + par(b) + ') + ' + par(z) + ' = ' + par(a) + ' + (' + par(b) + ' + ' + par(z) + ')', sgn(a + b) + ' + ' + par(z) + ' = ' + par(a) + ' + ' + sgn(b + z), sgn(a + b + z) + ' = ' + sgn(a + b + z)]) +
        blk(['(' + par(a) + ' × ' + par(b) + ') × ' + par(z) + ' = ' + par(a) + ' × (' + par(b) + ' × ' + par(z) + ')', sgn(a * b) + ' × ' + par(z) + ' = ' + par(a) + ' × ' + sgn(b * z), sgn(a * b * z) + ' = ' + sgn(a * b * z)]) + pill(true);
      a = ival('d1'); b = ival('d2'); z = ival('d3');
      if (a == null || b == null || z == null) $('#dout').innerHTML = '<p class="err">Isi dengan bilangan bulat.</p>';
      else $('#dout').innerHTML =
        blk([par(a) + ' × (' + sgn(b) + ' + ' + par(z) + ') = (' + par(a) + ' × ' + par(b) + ') + (' + par(a) + ' × ' + par(z) + ')', '= ' + sgn(a * b) + ' + ' + par(a * z) + ' = ' + sgn(a * (b + z))]) +
        blk([par(a) + ' × (' + sgn(b) + ' − ' + par(z) + ') = (' + par(a) + ' × ' + par(b) + ') − (' + par(a) + ' × ' + par(z) + ')', '= ' + sgn(a * b) + ' − ' + par(a * z) + ' = ' + sgn(a * (b - z))]) + pill(true);
    };
    c.addEventListener('input', (e) => { if (e.target.matches('input')) upd(); });
    c.addEventListener('click', (e) => {
      const b = e.target.closest('[data-set]'); if (!b) return;
      const p = b.dataset.set.split(':'), v = p[1].split(',');
      ['1', '2', '3'].forEach((n, i) => { $('#' + p[0] + n).value = v[i]; });
      upd();
    });
    upd();
  }

  /* -- 4. operasi campuran -- */
  const cp = { steps: [], shown: 0, err: '', expr: '15 + 27 : 3' };
  const CP_EX = ['15 + 27 : 3', '90 − (5 + 7) × 6', '(27 − (−25)) : 13 − 6 × (−12)', '39 + 7 × 8 : 4 − (46 − 14)'];
  function mCampuran(c) {
    c.innerHTML = '<div class="card"><h3>Aturan operasi hitung campuran</h3><ol class="rules">' +
      '<li>Kalau ada tanda kurung, hitung yang ada dalam tanda kurung duluan.</li>' +

      '<li>Kalau ada perkalian dan pembagian berbarengan, hitung dari sebelah kiri dulu.</li>' +

      '<div class="chips" id="cpex">' + CP_EX.map((e, i) => '<button type="button" class="chip sm" data-i="' + i + '">' + esc(e) + '</button>').join('') + '</div>' +

    $('#cpkeys').addEventListener('click', (e) => {
      const b = e.target.closest('[data-k]'); if (!b) return;

      f.value = f.value.slice(0, s) + b.dataset.k + f.value.slice(en);

  function startCp() {
    cp.expr = $('#expr').value;

  }

      (done ? '<p class="verdict" style="margin-top:10px">Hasil akhir: <mark class="eq">' + esc(cp.steps[cp.steps.length - 1].expr) + '</mark></p>' : '') +
      '<div class="stepbtns">' + (done ? '<button class="btn ghost" type="button" id="again">Ulangi dari awal</button>' :

  /* ---------- Soal Challenge ---------- */
  const L4 = ['A', 'B', 'C', 'D'];
  const ch = { i: 0, ans: [], locked: false, done: false };
  function renderChallenge() { if (ch.done) chResult(); else chQuestion(); }
  function segHTML() {
    return '<div class="seg" aria-hidden="true">' + PG.map((p, i) => '<span class="' + (ch.ans[i] != null ? (ch.ans[i] === p.key ? 'ok' : 'bad') : (i === ch.i ? 'cur' : '')) + '"></span>').join('') + '</div>';
  }
  function chQuestion() {
    const q = PG[ch.i], word = !q.math;
    ch.locked = ch.ans[ch.i] != null;
    view.innerHTML = '<h2>Soal Challenge 1.1</h2><p class="muted" style="margin:4px 0 0">Pilihlah jawaban di bawah ini dengan tepat!</p>' + segHTML() +
      '<div class="card pop"><div class="qn">Soal ' + (ch.i + 1) + ' dari ' + PG.length + '</div>' +
      '<p class="qtext' + (q.math && q.expr ? ' eq' : '') + '">' + esc(q.q) + '</p>' +
      '<div class="opts" id="opts">' + q.opts.map((o, k) => '<button type="button" class="opt' + (q.math || !/^[a-z]/.test(o) ? '' : ' word') + '" data-k="' + k + '"><span class="lt">' + L4[k] + '</span><span class="tx">' + esc(o) + '</span></button>').join('') + '</div>' +
      '<div id="fb" aria-live="polite"></div></div>';
    $('#opts').addEventListener('click', (e) => { const b = e.target.closest('[data-k]'); if (b) chPick(+b.dataset.k); });
    if (ch.locked) chShow();
  }
  function chPick(k) {
    if (ch.locked) return;
    ch.locked = true; ch.ans[ch.i] = k;
    $('.seg').outerHTML = segHTML();
    chShow();
  }
  function chShow() {
    const q = PG[ch.i], k = ch.ans[ch.i], ok = k === q.key;
    $$('#opts .opt').forEach((b, i) => {
      b.disabled = true;
      if (i === q.key) b.classList.add('ok'); else if (i === k) b.classList.add('bad');
    });
    let ex = '';
    if (q.why) ex += '<p>' + esc(q.why) + '</p>';
    if (q.expr) ex += stepsHTML(solve(q.expr).steps);
    const last = ch.i === PG.length - 1;
    $('#fb').innerHTML = '<div class="fb ' + (ok ? 'ok' : 'bad') + '"><strong class="t">' + (ok ? 'Benar!' : 'Belum tepat.') + '</strong>' +
      (ok ? '' : ' Jawaban yang benar: <b>' + L4[q.key] + '. ' + esc(q.opts[q.key]) + '</b>') + ex + '</div>' +
      '<div class="row"><button type="button" class="btn" id="chnext">' + (last ? 'Lihat hasil' : 'Soal berikutnya') + '</button></div>';
    $('#chnext').addEventListener('click', () => {
      if (last) {
        ch.done = true;
        const sc = ch.ans.reduce((n, a, i) => n + (a === PG[i].key ? 1 : 0), 0);
        if (store.best == null || sc > store.best) { store.best = sc; save(); }
        chResult();
      } else { ch.i++; chQuestion(); window.scrollTo(0, 0); }
    });
  }
  function chResult() {
    const sc = ch.ans.reduce((n, a, i) => n + (a === PG[i].key ? 1 : 0), 0), n = PG.length;
    const msg = sc === n ? 'Sempurna. Semua jawabanmu benar.' : sc >= 12 ? 'Bagus sekali. Tinggal sedikit lagi.' : sc >= 8 ? 'Sudah cukup baik. Cek lagi soal yang salah.' : 'Pelajari materinya sekali lagi, lalu coba lagi.';
    view.innerHTML = '<h2>Hasil Challenge 1.1</h2><div class="card pop"><div class="score eq">' + sc + '<span class="muted" style="font-size:.45em"> / ' + n + '</span></div>' +
      '<p class="verdict">' + msg + '</p><p class="muted" style="margin:0">Skor terbaikmu: ' + store.best + ' dari ' + n + '.</p>' +
      '<div class="review">' + PG.map((p, i) => '<span class="' + (ch.ans[i] === p.key ? 'ok' : 'bad') + '">' + (i + 1) + (ch.ans[i] === p.key ? '✓' : '✗') + '</span>').join('') + '</div>' +
      '<div class="row"><button class="btn" id="chagain" type="button">Ulangi dari awal</button><a class="btn ghost" href="#materi" style="text-decoration:none;display:inline-block">Buka materi</a></div></div>';
    $('#chagain').addEventListener('click', () => { ch.i = 0; ch.ans = []; ch.done = false; chQuestion(); window.scrollTo(0, 0); });
  }

    }
  }

  /* ---------- Latihan acak ---------- */
  const TOPICS = [['all', 'Semua'], ['add', 'Penjumlahan'], ['sub', 'Pengurangan'], ['mul', 'Perkalian'], ['div', 'Pembagian'], ['mix', 'Campuran']];
  const LVL = [[1, 'Mudah'], [2, 'Sedang'], [3, 'Tantangan']];
  const lt = { topic: 'mix', level: 1, q: null, counted: false, solved: false };
  function renderLatihan() {
    view.innerHTML = '<h2>Latihan Acak</h2><p class="muted" style="margin:4px 0 0">Pilih topik dan tingkat. Soal baru muncul setiap kali.</p>' +
      '<div class="chips" id="ltopic" role="group" aria-label="Topik" style="margin-top:12px">' + TOPICS.map((t) => '<button type="button" class="chip" data-v="' + t[0] + '" aria-pressed="' + (t[0] === lt.topic) + '">' + t[1] + '</button>').join('') + '</div>' +
      '<div class="chips" id="llevel" role="group" aria-label="Tingkat" style="margin-top:8px">' + LVL.map((t) => '<button type="button" class="chip" data-v="' + t[0] + '" aria-pressed="' + (t[0] === lt.level) + '">' + t[1] + '</button>').join('') + '</div>' +
      '<div class="card pop" id="lq"></div><p class="stats" id="lstat"></p>';
    $('#ltopic').addEventListener('click', (e) => { const b = e.target.closest('[data-v]'); if (!b) return; lt.topic = b.dataset.v; $$('#ltopic .chip').forEach((x) => x.setAttribute('aria-pressed', String(x.dataset.v === lt.topic))); newQ(); });
    $('#llevel').addEventListener('click', (e) => { const b = e.target.closest('[data-v]'); if (!b) return; lt.level = +b.dataset.v; $$('#llevel .chip').forEach((x) => x.setAttribute('aria-pressed', String(+x.dataset.v === lt.level))); newQ(); });
    if (!lt.q) lt.q = makeQ(lt.topic, lt.level);
    drawQ(); lStat();
  }
  function lStat() { const s = store.lat; $('#lstat').innerHTML = '<span>Benar <b>' + s.ok + '</b> dari <b>' + s.total + '</b></span><span>Beruntun <b>' + s.streak + '</b></span><span>Terbaik <b>' + s.bestStreak + '</b></span>'; }
  function newQ() { lt.q = makeQ(lt.topic, lt.level); lt.counted = false; lt.solved = false; drawQ(); }
  function drawQ() {
    const q = lt.q, first = q.steps[0].expr;
    $('#lq').innerHTML = '<div class="qn">Hitunglah</div><p class="qtext eq" style="font-size:24px">' + esc(first) + ' = …</p>' +
      '<form id="lf" autocomplete="off"><div class="ansrow"><input class="field" style="width:130px" id="la" type="text" inputmode="text" aria-label="Jawabanmu"' + (lt.solved ? ' disabled' : '') + '><button type="button" class="mini" id="lsg" aria-label="Ganti tanda">±</button><button class="btn" type="submit">Periksa</button></div></form>' +
      '<div id="lfb" aria-live="polite"></div>' +
      '<div class="row"><button type="button" class="chip sm" id="lshow">Lihat langkah</button><button type="button" class="chip sm" id="lnext">Soal lain</button></div>';
    $('#lsg').addEventListener('click', () => { const f = $('#la'), v = f.value.trim(); f.value = v.charAt(0) === '-' || v.charAt(0) === MINUS ? v.slice(1) : '-' + v; f.focus(); });
    $('#lnext').addEventListener('click', newQ);
    $('#lshow').addEventListener('click', () => { $('#lfb').innerHTML = '<div class="fb"><strong class="t">Langkah penyelesaian</strong>' + stepsHTML(lt.q.steps) + '<p style="margin:8px 0 0"><b>Jawaban: ' + esc(sgn(lt.q.ans)) + '</b></p></div>'; });
    $('#lf').addEventListener('submit', (e) => {
      e.preventDefault();
      const v = parseAns($('#la').value), fb = $('#lfb');
      if (isNaN(v)) { fb.innerHTML = '<div class="fb bad"><strong class="t">Tulis jawabanmu dulu</strong> berupa bilangan bulat.</div>'; return; }
      const ok = v === lt.q.ans, s = store.lat;
      if (!lt.counted) {
        lt.counted = true; s.total++;
        if (ok) { s.ok++; s.streak++; if (s.streak > s.bestStreak) s.bestStreak = s.streak; } else s.streak = 0;
        save(); lStat();
      }
      if (ok) { lt.solved = true; fb.innerHTML = '<div class="fb ok"><strong class="t">Benar!</strong>' + stepsHTML(lt.q.steps) + '<div class="row"><button type="button" class="btn" id="lgo">Soal berikutnya</button></div></div>'; $('#la').disabled = true; $('#lgo').addEventListener('click', newQ); }
      else fb.innerHTML = '<div class="fb bad"><strong class="t">Belum tepat.</strong> Coba lagi, atau tekan Lihat langkah.</div>';
    });
  }

  route();
})();
</script>

<script>
/* ===== Mode terang/gelap dan suara latar (dibuat dengan Web Audio, tanpa berkas audio) ===== */
(function () {
  var KEY = 'smp-ui', st = { theme: 'light', vol: 0.5, on: { music: true, bird: true, wave: true, nature: true } };
  try {
    var j = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (j) {
      if (j.theme === 'light' || j.theme === 'dark') st.theme = j.theme;
      if (typeof j.vol === 'number') st.vol = Math.max(0, Math.min(1, j.vol));
      if (j.on) Object.keys(st.on).forEach(function (k) { if (typeof j.on[k] === 'boolean') st.on[k] = j.on[k]; });
    }
  } catch (e) { /* abaikan */ }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) { /* abaikan */ } }

  var host = document.querySelector('.top .in'); if (!host) return;
  var ctl = document.createElement('div'); ctl.className = 'ctl';
  ctl.innerHTML = '<button type="button" class="ibtn" id="btheme"></button><button type="button" class="ibtn" id="bsound" aria-pressed="false" aria-expanded="false" aria-controls="apanel" aria-label="Suara latar" title="Suara latar">♪<span class="hide-s">Suara</span></button>';
  host.appendChild(ctl);
  var btnTheme = document.getElementById('btheme'), btnSound = document.getElementById('bsound');

  function applyTheme() {
    document.documentElement.setAttribute('data-theme', st.theme);
    var light = st.theme === 'light';
    btnTheme.textContent = light ? '☾' : '☀';
    btnTheme.setAttribute('aria-label', light ? 'Ganti ke mode gelap' : 'Ganti ke mode terang');
    btnTheme.title = light ? 'Mode gelap' : 'Mode terang';
  }
  btnTheme.addEventListener('click', function () { st.theme = st.theme === 'light' ? 'dark' : 'light'; applyTheme(); save(); });
  applyTheme();

  var AC = window.AudioContext || window.webkitAudioContext;
  var LAB = { music: 'Musik', bird: 'Burung', wave: 'Ombak', nature: 'Alam' };
  var panel = document.createElement('div'); panel.className = 'apanel'; panel.id = 'apanel'; panel.hidden = true;
  panel.setAttribute('role', 'dialog'); panel.setAttribute('aria-label', 'Suara latar');
  panel.innerHTML = '<div class="aprow"><b>Suara latar</b><button type="button" class="btn" id="aplay">Putar</button></div>' +
    '<label class="sl apvol"><span>Volume</span><input type="range" id="avol" min="0" max="100" step="1"><output id="avo" class="eq"></output></label>' +
    '<div class="apchips" role="group" aria-label="Pilih suara">' + Object.keys(LAB).map(function (k) { return '<button type="button" class="chip" data-k="' + k + '" aria-pressed="' + st.on[k] + '">' + LAB[k] + '</button>'; }).join('') + '</div>' +
    '<p class="muted">' + (AC ? 'Musik instrumen lembut, kicau burung, deru ombak, serta angin dan jangkrik. Semua dibuat langsung di perangkatmu.' : 'Browser ini belum mendukung suara latar.') + '</p>';
  document.body.appendChild(panel);
  var playBtn = document.getElementById('aplay'), vol = document.getElementById('avol'), vo = document.getElementById('avo');
  vol.value = Math.round(st.vol * 100); vo.textContent = vol.value;
  if (!AC) { playBtn.disabled = true; vol.disabled = true; }

  function openPanel(o) { panel.hidden = !o; btnSound.setAttribute('aria-expanded', String(o)); }
  btnSound.addEventListener('click', function (e) { e.stopPropagation(); openPanel(panel.hidden); });
  panel.addEventListener('click', function (e) { e.stopPropagation(); });
  document.addEventListener('click', function () { if (!panel.hidden) openPanel(false); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !panel.hidden) { openPanel(false); btnSound.focus(); } });

  /* ---- mesin suara ---- */
  var ctx = null, master, rev, bus = {}, noiseBuf, timers = [], running = false;
  var rnd = Math.random;
  function mkNoise() {
    var len = Math.floor(ctx.sampleRate * 4), b = ctx.createBuffer(2, len, ctx.sampleRate);
    for (var c = 0; c < 2; c++) {
      var d = b.getChannelData(c), last = 0;
      for (var i = 0; i < len; i++) { last = (last + 0.02 * (rnd() * 2 - 1)) / 1.02; d[i] = last * 3.5; }
      var fade = 2000; /* sambungan ujung-ke-awal dilunakkan supaya ulangan tidak berklik */
      for (var k = 0; k < fade; k++) { var w = k / fade; d[k] *= w; d[len - 1 - k] *= w; }
    }
    return b;
  }
  function mkImpulse(sec, decay) {
    var len = Math.floor(ctx.sampleRate * sec), b = ctx.createBuffer(2, len, ctx.sampleRate);
    for (var c = 0; c < 2; c++) { var d = b.getChannelData(c); for (var i = 0; i < len; i++) d[i] = (rnd() * 2 - 1) * Math.pow(1 - i / len, decay); }
    return b;
  }
  function loopNoise() { var s = ctx.createBufferSource(); s.buffer = noiseBuf; s.loop = true; return s; }
  function lfoTo(param, freq, depth) {
    var o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.value = freq; g.gain.value = depth;
    o.connect(g); g.connect(param); o.start(); return o;
  }

  function init() {
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = st.vol;
    var comp = ctx.createDynamicsCompressor(); master.connect(comp); comp.connect(ctx.destination);
    rev = ctx.createConvolver(); rev.buffer = mkImpulse(2.6, 2.4);
    var rg = ctx.createGain(); rg.gain.value = 0.5; rev.connect(rg); rg.connect(master);
    Object.keys(LAB).forEach(function (k) {
      var g = ctx.createGain(); g.gain.value = st.on[k] ? 1 : 0; g.connect(master); bus[k] = g;
    });
    bus.music.connect(rev); bus.bird.connect(rev);
    noiseBuf = mkNoise();
    startWaves(); startWind();
    timers.push(setInterval(tick, 250));
  }

  function startWaves() {
    /* dua lapisan deru ombak dengan periode berbeda supaya terdengar alami */
    [[0.10, 600, 380], [0.067, 420, 260]].forEach(function (p, i) {
      var src = loopNoise(), lp = ctx.createBiquadFilter(), g = ctx.createGain();
      lp.type = 'lowpass'; lp.frequency.value = p[1]; lp.Q.value = 0.6; g.gain.value = 0.9;
      lfoTo(g.gain, p[0], 0.65); lfoTo(lp.frequency, p[0], p[2]);
      src.connect(lp); lp.connect(g); g.connect(bus.wave);
      src.start(0, i * 1.3);
    });
  }
  function startWind() {
    var src = loopNoise(), bp = ctx.createBiquadFilter(), g = ctx.createGain();
    bp.type = 'bandpass'; bp.frequency.value = 650; bp.Q.value = 0.7; g.gain.value = 0.38;
    lfoTo(bp.frequency, 0.05, 280); lfoTo(g.gain, 0.08, 0.2);
    src.connect(bp); bp.connect(g); g.connect(bus.nature); src.start(0, 2.1);
  }

  /* kicau burung */
  function birdCall(t) {
    var pan = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
    if (pan) pan.value = rnd() * 1.6 - 0.8;
    var out = ctx.createGain(); out.connect(pan || bus.bird); if (pan) pan.connect(bus.bird);
    var base = 2200 + rnd() * 2400, n = 2 + Math.floor(rnd() * 4), type = Math.floor(rnd() * 3), at = t;
    for (var i = 0; i < n; i++) {
      var dur = 0.07 + rnd() * 0.07, f0 = type === 0 ? base : type === 1 ? base * (1 + (i % 2) * 0.25) : base * (1 + i * 0.06);
      var f1 = type === 0 ? f0 * 1.35 : type === 1 ? f0 * 0.8 : f0 * 1.2;
      var o = ctx.createOscillator(), e = ctx.createGain();
      o.type = 'sine'; o.frequency.setValueAtTime(f0, at); o.frequency.exponentialRampToValueAtTime(f1, at + dur);
      e.gain.setValueAtTime(0.0001, at); e.gain.exponentialRampToValueAtTime(0.09, at + 0.012); e.gain.exponentialRampToValueAtTime(0.0001, at + dur);
      o.connect(e); e.connect(out); o.start(at); o.stop(at + dur + 0.05);
      at += dur + 0.04 + rnd() * 0.06;
    }
  }
  /* jangkrik */
  function cricket(t) {
    var f = 4200 + rnd() * 1000;
    for (var i = 0; i < 3; i++) {
      var at = t + i * 0.065, o = ctx.createOscillator(), e = ctx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      e.gain.setValueAtTime(0.0001, at); e.gain.exponentialRampToValueAtTime(0.03, at + 0.01); e.gain.exponentialRampToValueAtTime(0.0001, at + 0.04);
      o.connect(e); e.connect(bus.nature); o.start(at); o.stop(at + 0.06);
    }
  }

  /* musik: kalimba lembut, tangga nada pentatonik, kord C - Am - F - G */
  var C4 = 261.63, CHORDS = [[0, 4, 7], [-3, 0, 4], [-7, -3, 0], [-5, -1, 2]], PENT = [0, 2, 4, 7, 9, 12, 14, 16, 19];
  function fr(semi) { return C4 * Math.pow(2, semi / 12); }
  function pluck(t, f, vel) {
    var o = ctx.createOscillator(), o2 = ctx.createOscillator(), g = ctx.createGain(), g2 = ctx.createGain();
    o.type = 'triangle'; o.frequency.value = f; o2.type = 'sine'; o2.frequency.value = f * 2; g2.gain.value = 0.25;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vel, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.8);
    o.connect(g); o2.connect(g2); g2.connect(g); g.connect(bus.music);
    o.start(t); o2.start(t); o.stop(t + 1.9); o2.stop(t + 1.9);
  }
  function pad(t, ch) {
    var lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 800; lp.connect(bus.music);
    ch.forEach(function (semi) {
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine'; o.frequency.value = fr(semi - 12);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.05, t + 1.4); g.gain.exponentialRampToValueAtTime(0.0001, t + 5.6);
      o.connect(g); g.connect(lp); o.start(t); o.stop(t + 5.8);
    });
  }
  var STEP = 0.6, nextStep = 0, stepIdx = 0, nextBird = 0, nextCr = 0, lastNote = 7;
  function scheduleStep(t, idx) {
    var ch = CHORDS[Math.floor(idx / 8) % CHORDS.length];
    if (idx % 8 === 0) pad(t, ch);
    if (idx % 4 === 0 && rnd() < 0.9) pluck(t, fr(ch[0] - 12), 0.11);
    if (rnd() < 0.58) {
      var semi = rnd() < 0.7 ? ch[Math.floor(rnd() * 3)] + (rnd() < 0.5 ? 12 : 0) : PENT[Math.floor(rnd() * PENT.length)];
      if (Math.abs(semi - lastNote) > 12) semi -= 12 * Math.sign(semi - lastNote);
      lastNote = semi; pluck(t, fr(semi), 0.08 + rnd() * 0.05);
    }
  }
  function tick() {
    if (!ctx || ctx.state !== 'running') return;
    var now = ctx.currentTime;
    while (nextStep < now + 0.8) { if (st.on.music) scheduleStep(Math.max(nextStep, now), stepIdx); nextStep += STEP; stepIdx++; }
    if (now >= nextBird) { if (st.on.bird) birdCall(now + 0.05); nextBird = now + 1.6 + rnd() * 4.5; }
    if (now >= nextCr) { if (st.on.nature) cricket(now + 0.05); nextCr = now + 0.9 + rnd() * 0.8; }
  }

  function paint() {
    playBtn.textContent = running ? 'Berhenti' : 'Putar';
    btnSound.setAttribute('aria-pressed', String(running));
  }
  function start() {
    if (!AC) return;
    if (!ctx) { init(); var n = ctx.currentTime; nextStep = n + 0.2; nextBird = n + 1.5; nextCr = n + 1; }
    ctx.resume(); running = true; paint();
  }
  function stop() { if (ctx) ctx.suspend(); running = false; paint(); }
  playBtn.addEventListener('click', function () { if (running) stop(); else start(); });
  vol.addEventListener('input', function () {
    st.vol = vol.value / 100; vo.textContent = vol.value; save();
    if (master) master.gain.setTargetAtTime(st.vol, ctx.currentTime, 0.05);
  });
  panel.querySelector('.apchips').addEventListener('click', function (e) {
    var b = e.target.closest('[data-k]'); if (!b) return;
    var k = b.dataset.k; st.on[k] = !st.on[k]; b.setAttribute('aria-pressed', String(st.on[k])); save();
    if (bus[k]) bus[k].gain.setTargetAtTime(st.on[k] ? 1 : 0, ctx.currentTime, 0.3);
    if (!running && st.on[k] && AC) start();
  });
  document.addEventListener('visibilitychange', function () {
    if (!ctx || !running) return;
    if (document.hidden) ctx.suspend(); else ctx.resume();
  });
  paint();
})();
</script>
<script>
/* ===== Layar penuh: tombol, dan otomatis masuk layar penuh pada sentuhan/klik pertama ===== */
(function () {
  var ctl = document.querySelector('.ctl'); if (!ctl) return;
  var de = document.documentElement;
  var req = de.requestFullscreen || de.webkitRequestFullscreen, exit = document.exitFullscreen || document.webkitExitFullscreen;
  if (!req || !exit) return; /* mis. iPhone Safari tidak mendukung layar penuh untuk halaman */
  var KEY = 'smp-fs', auto = true;
  try { auto = localStorage.getItem(KEY) !== 'off'; } catch (e) { /* abaikan */ }
  function setAuto(v) { auto = v; try { localStorage.setItem(KEY, v ? 'on' : 'off'); } catch (e) { /* abaikan */ } }
  function isFs() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
  function enter() { try { var p = req.call(de); if (p && p.catch) p.catch(function () {}); } catch (e) { /* diblokir browser */ } }
  var btn = document.createElement('button');
  btn.type = 'button'; btn.className = 'ibtn'; btn.id = 'bfs'; btn.textContent = '⛶';
  ctl.insertBefore(btn, ctl.firstChild);
  function paint() {
    var on = isFs();
    btn.setAttribute('aria-pressed', String(on));
    btn.setAttribute('aria-label', on ? 'Keluar dari layar penuh' : 'Layar penuh');
    btn.title = on ? 'Keluar dari layar penuh' : 'Layar penuh';
  }
  btn.addEventListener('click', function (e) {
    e.stopPropagation();
    if (isFs()) { setAuto(false); try { var p = exit.call(document); if (p && p.catch) p.catch(function () {}); } catch (x) { /* abaikan */ } }
    else { setAuto(true); enter(); }
  });
  var wasFs = false;
  function onChange() { var on = isFs(); if (wasFs && !on) setAuto(false); /* keluar (Esc atau tombol): jangan paksa masuk lagi */ wasFs = on; paint(); }
  document.addEventListener('fullscreenchange', onChange);
  document.addEventListener('webkitfullscreenchange', onChange);
  /* Browser hanya mengizinkan layar penuh setelah ada interaksi pengguna, jadi dicoba saat sentuhan/klik/tombol pertama */
  var done = false;
  function first(e) {
    if (done) return;
    if (e.type === 'keydown' && (e.key === 'Escape' || e.key === 'Tab')) return;
    if (!auto || isFs()) { done = true; return; }
    done = true; enter();
  }
  ['click', 'touchend', 'keydown'].forEach(function (t) { document.addEventListener(t, first, true); });
  if (auto) enter(); /* hanya berhasil kalau browser mengizinkan (mis. aplikasi terpasang) */
  paint();
})();
</script>
