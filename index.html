<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Seri Matematika SMP</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=IBM+Plex+Mono:wght@400;600&family=Nunito+Sans:wght@400;600;700;800&display=swap">
<style>
/* Tata letak: satu kolom 760px, bilah navigasi menempel di atas, kartu bergaris tinta seperti buku tulis kotak-kotak */
:root{
  --bg:#EDF2F8; --grid:#D9E2EE; --paper:#FFFFFF; --ink:#13203A; --muted:#52607A; --line:#C5D1E2;
  --pos:#0A8776; --pos-soft:#D5F0EA; --neg:#CF3E28; --neg-soft:#FBE2DC;
  --hi:#FFE27A; --hi-ink:#13203A; --focus:#2F5BFF;
  --c0:#FFE9A8; --c1:#BFE8DA; --c2:#C9DAFF; --c3:#FAD1E0; --c4:#E1D3FA; --c5:#FFD2B5; --x:#E0701A; --qb:#1F63C8; --btn:#13203A; --btn-ink:#FFFFFF;
  --f-display:'Baloo 2','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Nunito Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1526; --grid:#16223A; --paper:#15203A; --ink:#E8EEF9; --muted:#9BA9C4; --line:#2B3B5C;
    --pos:#3FD0B9; --pos-soft:#11332E; --neg:#FF7F68; --neg-soft:#3B1F22;
    --hi:#5A4A10; --hi-ink:#FFF1B8; --focus:#8FA8FF;
    --c0:#5A4A10; --c1:#11433A; --c2:#22386B; --c3:#5B2540; --c4:#43306F; --c5:#5E3414; --x:#FFA24D; --qb:#8DB8FF; --btn:#E8EEF9; --btn-ink:#0D1526; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1526; --grid:#16223A; --paper:#15203A; --ink:#E8EEF9; --muted:#9BA9C4; --line:#2B3B5C;
  --pos:#3FD0B9; --pos-soft:#11332E; --neg:#FF7F68; --neg-soft:#3B1F22;
  --hi:#5A4A10; --hi-ink:#FFF1B8; --focus:#8FA8FF;
    --c0:#5A4A10; --c1:#11433A; --c2:#22386B; --c3:#5B2540; --c4:#43306F; --c5:#5E3414; --x:#FFA24D; --qb:#8DB8FF; --btn:#E8EEF9; --btn-ink:#0D1526; color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px; color:var(--ink); font:16px/1.55 var(--f-body); min-height:100vh;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--paper);z-index:10}
.in{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance}
h2{font-size:22px;font-weight:800}
h3{font-size:18px;font-weight:800}
p{margin:.6em 0}
mark{background:var(--hi);color:var(--hi-ink);padding:0 .25em;border-radius:4px;font-weight:700}
.muted{color:var(--muted)}
.eq{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.big{font-size:18px}

/* bilah atas */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--paper);border-bottom:2px solid var(--ink)}
.brandrow{display:flex;align-items:center;gap:10px;padding-top:10px}
.brand{font:800 18px/1 var(--f-display);color:var(--ink);text-decoration:none;display:flex;align-items:center;gap:8px}
.brand b{display:inline-grid;place-items:center;background:var(--ink);color:var(--paper);border-radius:12px 12px 12px 3px;padding:5px 9px;font-size:14px}
.top nav{display:flex;gap:4px;overflow-x:auto;padding:6px 0 8px;scrollbar-width:none}
.top nav::-webkit-scrollbar{display:none}
.top nav a{flex:0 0 auto;padding:7px 13px;border-radius:999px;color:var(--ink);text-decoration:none;font-weight:700;font-size:14px;border:2px solid transparent}
.top nav a.on{background:var(--hi);color:var(--hi-ink);border-color:var(--ink)}
main.in{padding-block:22px 64px}

/* beranda */
.bubble{background:var(--ink);color:var(--bg);border-radius:32px 32px 32px 8px;padding:14px 26px 14px 14px;display:flex;align-items:center;gap:14px;width:fit-content;max-width:100%}
.bubble .bab{font:800 15px/1.05 var(--f-display);background:var(--bg);color:var(--ink);border-radius:50%;width:58px;height:58px;display:grid;place-items:center;text-align:center;flex:0 0 auto}
.bubble h1{font-size:clamp(34px,10vw,56px);font-weight:800;letter-spacing:.01em}
.lead{font-size:17px;max-width:56ch}
.hero .nl{margin-top:8px}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:22px}
.mcard{display:flex;flex-direction:column;gap:6px;background:var(--paper);border:2px solid var(--ink);border-radius:14px;padding:16px;color:var(--ink);text-decoration:none;box-shadow:4px 4px 0 var(--ink);transition:transform .12s}
.mcard:hover{transform:translate(-2px,-2px)}
.mcard h3{font-size:20px}
.mcard p{margin:0;color:var(--muted)}
.mcard .st{margin-top:auto;padding-top:8px;font-weight:700;font-size:14px}

/* kartu umum */
.card{background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:16px;margin-top:16px}
.card.pop{border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink)}
.tabs,.chips{display:flex;flex-wrap:wrap;gap:8px}
.tabs{margin:2px 0 0}
.chip{font:700 14px var(--f-body);background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.chip.sm{padding:4px 10px;font-family:var(--f-mono);font-weight:600;font-size:13px;border-color:var(--line)}
.btn{font:800 16px var(--f-display);background:var(--btn);color:var(--btn-ink);border:2px solid var(--btn);border-radius:12px;padding:9px 18px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}
.rule{background:var(--hi);color:var(--hi-ink);border-radius:10px;padding:10px 12px;font-family:var(--f-mono);font-size:14px;line-height:1.7;overflow-wrap:anywhere}
.rule + .rule{margin-top:6px}
.sign{width:100%;border-collapse:collapse;font-family:var(--f-mono);font-size:15px;margin-top:10px}
.sign td{border:1.5px solid var(--line);padding:6px 10px;text-align:center}
.sign td.p{color:var(--pos);font-weight:700}
.sign td.n{color:var(--neg);font-weight:700}

/* garis bilangan */
.nl{width:100%;max-width:560px;height:auto;display:block}
.nl .tk{stroke:var(--ink);stroke-width:1.5}
.nl .ax{stroke:var(--ink);stroke-width:2.5}
.nl .tl{fill:var(--muted);font:600 11px var(--f-mono);text-anchor:middle}
.nl .mk{stroke:var(--paper);stroke-width:2}
.nl .mk.pos{fill:var(--pos)} .nl .mk.neg{fill:var(--neg)} .nl .mk.zero{fill:var(--ink)}
.nl .ml{font:800 12px var(--f-body);fill:var(--ink);text-anchor:middle}
.nl .zn{fill:var(--neg-soft)} .nl .zp{fill:var(--pos-soft)}
.nl .zl{font:700 11px var(--f-body);fill:var(--muted);text-anchor:middle}
.nl .jp{fill:none;stroke-width:3}
.nl .jp.pos{stroke:var(--pos)} .nl .jp.neg{stroke:var(--neg)}
.nl .jl{font:700 12px var(--f-mono);text-anchor:middle}
.nl .jl.pos{fill:var(--pos)} .nl .jl.neg{fill:var(--neg)}
.nl .ahp{fill:var(--pos)} .nl .ahn{fill:var(--neg)}

/* masukan */
.sliders{display:grid;gap:10px;margin-top:6px}
.sl{display:grid;grid-template-columns:auto 1fr 3ch;align-items:center;gap:12px;font-weight:700}
.sl input{width:100%;accent-color:var(--focus)}
.sl output{font-family:var(--f-mono);text-align:right}
.ins{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px}
.ni{display:grid;gap:4px;font-weight:700;font-size:14px}
.ni input,.field{font:600 18px var(--f-mono);background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:10px;padding:8px 10px;width:96px}
.field.wide{width:100%}
.verdict{font-weight:700}
.out{margin-top:12px;display:grid;gap:8px}
.eqblock{font-family:var(--f-mono);font-size:15px;line-height:1.8;background:var(--bg);border-radius:10px;padding:10px 12px;overflow-x:auto}
.ok-pill,.bad-pill{display:inline-block;border-radius:999px;padding:2px 10px;font-weight:800;font-size:13px}
.ok-pill{background:var(--pos-soft);color:var(--pos)} .bad-pill{background:var(--neg-soft);color:var(--neg)}
.err{color:var(--neg);font-weight:700}
ol.rules{padding-left:1.3em;margin:8px 0 0} ol.rules li{margin:4px 0}

/* langkah */
ol.steps{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px}
ol.steps li{border-left:4px solid var(--ink);padding:2px 0 2px 12px}
ol.steps .eq{font-size:16px;font-weight:600;overflow-wrap:anywhere}
ol.steps .why{display:flex;flex-wrap:wrap;gap:4px 10px;color:var(--muted);font-size:14px}
ol.steps .why .eq{color:var(--ink);font-size:14px}
.stepbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}

/* soal */
.seg{display:flex;gap:4px;margin:14px 0 0}
.seg span{flex:1;height:8px;border-radius:4px;background:var(--line)}
.seg .ok{background:var(--pos)} .seg .bad{background:var(--neg)} .seg .cur{background:var(--ink)}
.qn{font:800 14px var(--f-display);color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.qtext{font-size:17px;margin:8px 0 12px}
.qtext.eq{font-size:21px}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;width:100%;font:600 17px var(--f-body);background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:12px;padding:10px 12px;cursor:pointer}
.opt .lt{flex:0 0 auto;display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--paper);font:800 14px var(--f-display)}
.opt .tx{min-width:0;overflow-wrap:anywhere;font-family:var(--f-mono);font-size:16px}
.opt.word .tx{font-family:var(--f-body)}
.opt.ok{background:var(--pos-soft);border-color:var(--pos)} .opt.bad{background:var(--neg-soft);border-color:var(--neg)}
.opt:disabled{cursor:default;color:var(--ink)}
.fb{margin-top:14px;border-radius:12px;padding:12px 14px;border:2px solid var(--line)}
.fb.ok{background:var(--pos-soft);border-color:var(--pos)} .fb.bad{background:var(--neg-soft);border-color:var(--neg)}
.fb strong.t{font:800 18px var(--f-display)}
.score{font:800 clamp(44px,14vw,72px)/1 var(--f-display)}
.review{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.review span{display:inline-grid;place-items:center;min-width:38px;height:34px;border-radius:8px;font:700 14px var(--f-mono)}
.review .ok{background:var(--pos-soft);color:var(--pos)} .review .bad{background:var(--neg-soft);color:var(--neg)}
.ansrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.unit{font-weight:700;color:var(--muted)}
.mini{font:700 14px var(--f-mono);background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:10px;padding:8px 10px;cursor:pointer}
.stats{display:flex;flex-wrap:wrap;gap:6px 18px;font-weight:700;font-size:14px;color:var(--muted);margin-top:10px}
.stats b{color:var(--ink);font-family:var(--f-mono)}
@media (prefers-reduced-motion:reduce){.mcard{transition:none}}

/* Trik Perkalian */
.p0{--pp:var(--c0)} .p1{--pp:var(--c1)} .p2{--pp:var(--c2)} .p3{--pp:var(--c3)} .p4{--pp:var(--c4)} .p5{--pp:var(--c5)}
.field.num{width:110px}
.field.sel{width:auto;max-width:100%;font:600 15px var(--f-body);padding:6px 8px}
.kwrap{overflow-x:auto;margin-top:8px;padding-bottom:4px}
.kotak{border-collapse:separate;border-spacing:5px;font-family:var(--f-mono)}
.kotak th{font:600 13px var(--f-mono);color:var(--muted);padding:2px 6px;text-align:center;white-space:nowrap}
.kotak th.rh{text-align:right}
.kc{min-width:78px;height:72px;border-radius:12px;text-align:center;vertical-align:middle;padding:4px 6px;background:var(--pp);color:var(--ink);transition:opacity .15s}
.kc.empty{background:var(--bg);color:var(--muted);border:2px dashed var(--line);font-size:22px}
.kc .m,.kc .tg{display:block;color:var(--ink);opacity:.8}
.kc .m{font-size:11px}
.kc b{display:block;font-size:20px;line-height:1.15}
.kc .tg{font:600 10px/1.15 var(--f-body)}
.kc.off{opacity:.4}
.kc.on{outline:3px solid var(--ink);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:12px;font-size:13px;font-weight:700}
.lg{display:inline-flex;align-items:center;gap:6px}
.lg i{width:14px;height:14px;border-radius:4px;background:var(--pp);border:1.5px solid var(--ink)}
.gsteps{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:10px}
.gstep{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--paper);min-width:0}
.gstep.cur{border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink)}
.gstep h4{font:800 16px var(--f-display);margin:0 0 4px}
.gstep .eqblock{margin:6px 0;overflow-wrap:anywhere}
.gstep .tt{color:var(--muted);font-size:14px;margin:0 0 8px}

/* Pengerjaan cepat (kali silang) */
.duo{display:flex;flex-wrap:wrap;gap:0 18px;align-items:flex-start}
.kcol{flex:0 1 auto;min-width:0;max-width:100%}
.quick{flex:1 1 270px;min-width:0;border:1.5px solid var(--line);border-radius:14px;padding:10px 12px 14px;margin-top:12px;background:var(--paper)}
.quick h4{font:800 15px var(--f-display);margin:0 0 2px}
.quick .sub{color:var(--muted);font-size:13px;margin:0 0 6px}
.qsvg{display:block;width:100%;max-width:250px;height:auto;margin:0 auto}
.qsvg text{font-family:var(--f-display);font-weight:800;fill:var(--ink)}
.qsvg .qd{font-size:34px;text-anchor:middle}
.qsvg .qs{font-size:26px;text-anchor:middle;fill:var(--muted)}
.qsvg .qx{stroke:var(--x);stroke-width:3.5;stroke-linecap:round}
.qsvg .qrule{stroke:var(--qb);stroke-width:3;stroke-linecap:round}
.qcalc{margin:8px 0 0;display:grid;gap:2px;min-height:1.6em}
.qline{font:700 15px var(--f-mono);color:var(--qb);overflow-wrap:anywhere}
.qline.on{background:var(--hi);color:var(--hi-ink);border-radius:6px;padding:0 6px;margin:0 -6px}
.qstack{display:flex;flex-wrap:nowrap;justify-content:center;gap:6px;margin-top:12px;overflow-x:auto;padding-bottom:2px}
.qcell{flex:0 0 auto;min-width:42px;text-align:center;border-bottom:4px solid var(--pos);padding:2px 3px 3px;font:800 30px/1.1 var(--f-display);white-space:nowrap;color:var(--ink)}
.qcell sup{font:700 15px var(--f-mono);color:var(--x);margin-left:2px;vertical-align:super}
.qcell sup.cy{color:var(--pos)}
.qcell.empty{color:var(--muted);font-weight:600}
.qcell.cy{color:var(--pos)}
.qres{margin-top:10px;font:800 22px var(--f-display);text-align:center}
.qres .eq{font-family:var(--f-mono)}

.stepcap{font-weight:700;margin:14px 0 0}

/* ===== Mode padat global: seluruh halaman ===== */
body{font-size:15px;line-height:1.45}
.in{padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
p{margin:.45em 0}
h2{font-size:20px}
h3{font-size:16px}
.big{font-size:16px}
.bubble{padding:9px 20px 9px 9px;gap:10px;border-radius:26px 26px 26px 6px}
.bubble .bab{width:46px;height:46px;font-size:12.5px}
.bubble h1{font-size:clamp(26px,8vw,40px)}
.lead{font-size:15px}
.hero .nl{margin-top:4px}
.menu{gap:8px;margin-top:10px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.mcard{padding:10px 13px;gap:2px;border-radius:12px;box-shadow:3px 3px 0 var(--ink)}
.mcard h3{font-size:17px}
.mcard .st{padding-top:4px;font-size:13px}
.card{padding:12px;margin-top:10px;border-radius:12px}
.card.pop{box-shadow:3px 3px 0 var(--ink)}
.tabs,.chips{gap:6px}
.chip{font-size:13px;padding:4px 11px}
.chip.sm{padding:3px 9px;font-size:12px}
.btn{font-size:14px;padding:6px 14px;border-radius:10px}
.row{gap:6px;margin-top:6px}
.rule{padding:7px 10px;font-size:13px;line-height:1.5}
.sign{font-size:13px;margin-top:6px}
.sign td{padding:3px 8px}
.sliders{gap:6px}
.sl{gap:8px;font-size:14px}
.ins{gap:8px;margin-top:6px}
.ni{gap:2px;font-size:12px}
.ni input,.field{font-size:16px;padding:5px 8px;border-radius:8px}
.field.num{width:84px}
.out{margin-top:8px;gap:6px}
.eqblock{font-size:13.5px;line-height:1.55;padding:6px 10px;border-radius:8px}
ol.rules{margin:6px 0 0}
ol.rules li{margin:2px 0}
ol.steps{margin:6px 0 0;gap:5px}
ol.steps li{padding:1px 0 1px 10px}
ol.steps .eq{font-size:14px}
ol.steps .why{font-size:12.5px}
.stepbtns{margin-top:8px;gap:6px}
.seg{margin:8px 0 0}
.seg span{height:6px}
.qn{font-size:12px}
.qtext{font-size:15px;margin:6px 0 8px}
.qtext.eq{font-size:18px}
.opts{gap:6px}
.opt{font-size:15px;padding:7px 10px;gap:10px;border-radius:10px}
.opt .lt{width:26px;height:26px;font-size:13px}
.opt .tx{font-size:14px}
.fb{margin-top:10px;padding:9px 11px;border-radius:10px}
.fb strong.t{font-size:16px}
.score{font-size:clamp(36px,12vw,56px)}
.review{gap:4px;margin-top:8px}
.review span{min-width:32px;height:28px;font-size:13px}
.mini{font-size:13px;padding:5px 8px}
.stats{gap:4px 14px;font-size:13px;margin-top:8px}
.kwrap{margin-top:4px}
.legend{margin-top:8px;font-size:12px}

/* ===== Mode padat: kartu "Coba sendiri" muat satu layar di HP, tablet, desktop ===== */
.top .in{display:flex;align-items:center;gap:8px}
.brandrow{padding-top:0;flex:0 0 auto}
.brand{font-size:15px}
.brand b{font-size:13px;padding:4px 8px}
.top nav{flex:1 1 auto;min-width:0;padding:5px 0}
.top nav a{padding:4px 10px;font-size:13px}
main.in{padding-block:12px 48px}
.top .in{max-width:980px}


.cmp{container-type:inline-size;padding:10px 12px;margin-top:10px}
.cmphead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 10px}
.cmphead h3{font-size:16px}
.cmp .chips{gap:6px;margin:0!important}
.cmp .chip.sm{padding:3px 9px;font-size:12px}
.cmpdesc{margin:4px 0 0!important;font-size:12px;line-height:1.4}
@media (max-width:560px){.cmpdesc{display:none}}
.cmp .ins{gap:8px;margin-top:8px;align-items:flex-end}
.cmp .ni{font-size:11px;gap:2px;color:var(--muted)}
.cmp .field.num{width:68px;font-size:16px;padding:5px 8px;border-radius:8px}
.cmp .ins .big{padding-bottom:6px!important;font-size:16px}
.cmp .btn{font-size:14px;padding:6px 12px;border-radius:10px}

.cmp .rule{font-size:12.5px;line-height:1.45}
.cmp .stepbtns{margin-top:8px}
.spwrap{margin-top:2px}
.spsvg{display:block;width:100%;max-width:460px;height:auto;margin:4px auto 0}

.spsvg .spk{stroke:var(--ink)}

/* Materi SD: penjumlahan */
.sd-two{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:10px}
.sd-grp{border:2px solid var(--ink);border-radius:14px;padding:12px;background:var(--bg)}
.sd-grp h4{font:800 18px var(--f-display);margin:6px 0 0}
.sd-badge{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;border:2px solid var(--neg);color:var(--neg);font:800 18px var(--f-display)}
.sd-stairs{display:flex;align-items:flex-end;margin:12px 0 8px;overflow-x:auto;padding-bottom:2px}
.sd-st{flex:0 0 auto;min-width:48px;border-left:3px solid var(--ink);border-top:3px solid var(--ink);padding:2px 10px;font:800 19px var(--f-display);background:var(--paper);display:flex;align-items:flex-start}
.sd-st.t{background:var(--hi);color:var(--hi-ink)}
/* tangga peta penjumlahan: ukuran setengah */
.sd-two .sd-stairs{margin:6px 0 4px}
.sd-two .sd-st{min-width:24px;padding:1px 5px;font-size:11px;border-left-width:2px;border-top-width:2px}
.sd-two .sd-grp{padding:8px}
.sd-two .sd-grp h4{font-size:15px;margin:3px 0 0}
.sd-two .sd-badge{width:22px;height:22px;font-size:12px;border-width:1.5px}
.sd-two .sd-grp p{font-size:13px}
.sd-lv{display:inline-block;font:800 13px var(--f-body);padding:2px 10px;border-radius:999px;background:var(--ink);color:var(--paper)}
.sd-srow{display:flex;align-items:center;gap:14px;width:100%;padding:6px 10px;border-radius:12px;border:2px solid transparent;background:none;color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.sd-srow.on{border-color:var(--ink);background:var(--hi);color:var(--hi-ink)}
.sd-srow .n{font:800 28px var(--f-display);min-width:34px}
.sd-stars{display:flex;gap:6px;min-width:190px}
.sd-star{width:28px;height:28px;fill:var(--paper);stroke:var(--ink);stroke-width:1.8;stroke-linejoin:round}
.sd-srow.on .sd-star{fill:var(--hi)}
.sd-trees{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px;margin-top:10px}
.sd-tree{border:2px solid var(--line);border-radius:12px;padding:8px 6px;text-align:center;background:var(--paper)}
.sd-tree .hd{font:800 24px var(--f-display);line-height:1}
.sd-tree .pr{font:600 17px/1.55 var(--f-mono)}
.sd-tree .pr i{font-style:normal;color:var(--x);font-weight:700;padding:0 3px}
.sd-ten{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px;margin-top:10px}
.sd-ten .sd-tree{border-color:var(--ink)}
.sd-ten .lt{font:800 22px var(--f-display);color:var(--neg);margin-top:2px}
.sd-ten .ar{color:var(--neg);line-height:1}
.sd-ten .nm{font:600 12px var(--f-body);color:var(--muted)}
.sd-demo{display:flex;flex-wrap:wrap;gap:22px;align-items:flex-end;justify-content:center;min-height:132px;padding:12px 4px;margin-top:8px}
.sd-dg{display:flex;flex-direction:column;align-items:center;gap:6px}
.sd-dots{display:grid;grid-template-columns:repeat(5,20px);gap:6px}
.sd-dot{width:20px;height:20px;border-radius:50%;background:var(--qb)}
.sd-dot.o{background:var(--x)}
.sd-dot.m{background:var(--x);outline:3px solid var(--neg);outline-offset:2px}
.sd-box{width:70px;height:70px;border:3px solid var(--ink);border-radius:10px;display:grid;place-items:center;font:800 26px var(--f-display);background:var(--hi);color:var(--hi-ink)}
.sd-cap{font:700 12px var(--f-body);color:var(--muted)}
.sd-plus{font:800 28px var(--f-display);align-self:center}
.sd-res{font:800 clamp(24px,7vw,34px) var(--f-display);text-align:center;margin-top:4px}
.sd-res b{color:var(--neg)}
.sd-tbl{border-collapse:collapse;width:100%;font-family:var(--f-mono);font-size:15px;margin-top:8px}
.sd-tbl th{font:700 12px var(--f-body);color:var(--muted);padding:3px 6px;text-align:center;border-bottom:2px solid var(--ink)}
.sd-tbl td{padding:3px 6px;text-align:center}
.sd-tbl td.r{color:var(--neg);font-weight:700}
.sd-tbl tr.k td{padding-top:6px}
.sd-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:8px 14px;margin-top:6px}
.sd-sum h5{margin:0 0 4px;font:800 15px var(--f-display);color:var(--qb)}
.sd-sum div{font:600 14px/1.8 var(--f-mono)}
.sd-add{border-collapse:separate;border-spacing:3px 0;font-family:var(--f-mono);font-weight:700;font-size:clamp(24px,7vw,34px);margin:6px auto}
.sd-add td{min-width:1.55em;text-align:center;padding:0 2px}
.sd-add .cy td{font-size:.52em;color:var(--x);height:1.3em;padding:0}
.sd-add .ln td{border-top:3px solid var(--ink)}
.sd-add .rs td{color:var(--neg)}
.sd-add .pl{text-align:right;color:var(--muted)}
.sd-add .hd td{font:700 11px var(--f-body);color:var(--muted);padding:0}
.sd-list{display:grid;gap:8px;margin-top:8px}
.sd-list div{font:600 15px/1.5 var(--f-mono);background:var(--bg);border-radius:8px;padding:6px 10px;overflow-wrap:anywhere}
.sd-list div b{color:var(--neg)}
.sd-run{border-collapse:collapse;font-family:var(--f-mono);font-size:clamp(20px,6vw,28px);font-weight:700;margin:6px auto}
.sd-run td{padding:1px 10px;text-align:right}
.sd-run .pm{text-align:left;padding:1px 0 1px 2px;font-weight:700;color:var(--ink)}
.sd-run .sb{font-size:.6em;color:var(--x);text-align:left;font-weight:600}
.sd-run .ln td{border-top:3px solid var(--ink)}
.sd-run .rs td{color:var(--neg)}
.sd-note{background:var(--hi);color:var(--hi-ink);border-radius:10px;padding:8px 12px;font-weight:700;margin-top:10px}
.sd-sum b{color:var(--neg)}
.sd-things{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:12px 0 8px;min-height:64px}
.sd-th{font-size:40px;line-height:1;background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:6px 8px;cursor:pointer;position:relative;color:inherit}
.sd-th.m{border-color:var(--ink);background:var(--hi)}
.sd-th[data-c]::after{content:attr(data-c);position:absolute;right:-6px;top:-8px;min-width:22px;height:22px;border-radius:11px;background:var(--ink);color:var(--paper);font:800 13px/22px var(--f-display);text-align:center}
.sd-numpad{display:flex;gap:8px;flex-wrap:wrap}
.sd-nb{flex:1 1 54px;font:800 24px var(--f-display);padding:10px 0;border-radius:12px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);cursor:pointer}
.sd-nb.ok{background:var(--pos-soft);border-color:var(--pos)}
.sd-nb.bad{background:var(--neg-soft);border-color:var(--neg)}
.sd-nb:disabled{opacity:.6;cursor:default}
.sd-run s{text-decoration-color:var(--neg);text-decoration-thickness:3px}
.sd-run tr.cur td{background:var(--hi);color:var(--hi-ink);border-radius:6px}
.sd-add td.on{background:var(--hi);color:var(--hi-ink);border-radius:6px}
.sd-add td.nt{font:600 13px var(--f-mono);color:var(--x);text-align:left;white-space:nowrap;padding-left:8px}
.sd-add .ln td.nt{border-top:0}
.sd-add sup.sv{font:700 .5em var(--f-mono);color:var(--x);margin-left:2px;vertical-align:super}
.sd-add .rs sup.sv{color:var(--x)}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .22em;line-height:1.15;font-family:var(--f-mono);font-weight:700}
.fr>span:first-child{border-bottom:.1em solid currentColor;padding:0 .3em}
.fr>span:last-child{padding:0 .3em}
.frin{display:inline-flex;flex-direction:column;align-items:center;gap:3px}
.frin .bar{display:block;width:100%;height:3px;border-radius:2px;background:var(--ink)}
.frin .field.num{width:64px;text-align:center}
.b2vis{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:center;margin-top:6px}
.sd-sub td{vertical-align:bottom;min-width:2.1em}
.sd-sub .sm{display:block;font:700 .5em var(--f-mono);color:var(--x);height:1.6em;line-height:1.6em;white-space:nowrap}
.sd-sub .sm b{display:inline-block;border:2px solid var(--ink);border-radius:5px;padding:0 3px;line-height:1.15;margin-left:3px;color:var(--ink)}
.sd-sub .mn.sx{text-decoration:line-through;text-decoration-thickness:3px;text-decoration-color:var(--neg)}
.sd-dvx{display:flex;justify-content:center;align-items:baseline;flex-wrap:wrap;gap:2px 4px;font:700 clamp(30px,9vw,44px) var(--f-mono);margin:12px 0 6px}
.sd-dvx .dg{padding:0 3px;border-bottom:4px solid transparent;border-radius:6px 6px 0 0}
.sd-dvx .dg.on{background:var(--hi);color:var(--hi-ink);border-bottom-color:var(--ink)}
.sd-dvx .dg.qd{color:var(--neg)}
.sd-dvx .op{color:var(--muted);padding:0 4px}
.sd-dvx sup.sv{font:700 .5em var(--f-mono);color:var(--x);margin:0 3px 0 -1px;vertical-align:super;border-radius:4px;padding:0 2px}
.sd-dvx sup.sv.on{background:var(--hi);color:var(--hi-ink)}
.sd-timer{display:flex;align-items:center;gap:10px;margin:8px 0}
.sd-tbar{flex:1;height:14px;border:2px solid var(--ink);border-radius:999px;background:var(--paper);overflow:hidden}
.sd-tbar i{display:block;height:100%;width:100%;background:var(--pos);transition:width .1s linear}
.sd-timer b{font:800 30px var(--f-display);min-width:2em;text-align:right}
.sd-timer.low .sd-tbar i{background:var(--neg)}
.sd-timer.low b{color:var(--neg)}
.sd-stairs.kt{overflow:visible;gap:0}
.sd-stairs.kt .sd-st{flex:1 1 0;min-width:0;padding:3px 5px}
.sd-stairs.kt .sd-st:first-child,.sd-stairs.kt .sd-st:last-child{flex-grow:.7}
.sd-stairs.kt .sd-st:not(:first-child):not(:last-child){flex-grow:1.2}
.sd-sb{font:800 14px/1.2 var(--f-display);overflow-wrap:normal}
.sd-sb small{display:block;font:700 11px var(--f-body);color:var(--muted)}
.sd-st.t .sd-sb small{color:inherit}
.sd-kbs{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:10px 0}
.sd-kb{border:3px solid var(--ink);border-radius:8px;padding:6px;min-width:50px;display:grid;grid-template-columns:repeat(3,12px);gap:4px;justify-content:center;align-content:center;background:var(--paper)}
.sd-dot.s{width:12px;height:12px}
.sd-kts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-top:10px}
.sd-kh{margin:0 0 4px;font:800 15px var(--f-display);color:var(--qb)}
.sd-kts .sd-tbl{margin-top:0}
.sd-kts tr.kr td{border-top:1px solid var(--line);padding:6px}
.sd-kts tr.kr{cursor:pointer}
.sd-kts.sd-hide td.r{visibility:hidden}
.sd-kts.sd-hide tr.rv td.r{visibility:visible}
.sd-nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:18px}
/* ===== Mode ringkas: kurangi gulir vertikal ===== */
main.in{padding-block:8px 40px}
h2{font-size:19px}
p{margin:.35em 0}
.card{margin-top:8px;padding:10px 12px}
.cmp{padding:8px 10px;margin-top:8px}
.spline{margin-top:3px}
/* deretan tab dan contoh: satu baris yang bisa digeser ke samping */
.tabs,#sdsub,#cex,#tkchips,#tkex,#tsex,#ctabs,#opchips,#oex,#mtabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-right:-12px;padding:0 24px 2px 0;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 22px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 22px),transparent)}
.tabs::-webkit-scrollbar,#sdsub::-webkit-scrollbar,#cex::-webkit-scrollbar,#tkchips::-webkit-scrollbar,#tkex::-webkit-scrollbar,#tsex::-webkit-scrollbar,#ctabs::-webkit-scrollbar,#opchips::-webkit-scrollbar,#oex::-webkit-scrollbar,#mtabs::-webkit-scrollbar{display:none}
.tabs>*,#sdsub>*,#cex>*,#tkchips>*,#tkex>*,#tsex>*,#ctabs>*,#opchips>*,#oex>*,#mtabs>*{flex:0 0 auto;white-space:nowrap}
#sdsub,#sdtabs,#mtabs{margin-top:6px!important}
@media (min-width:700px){.tabs,#sdsub,#cex,#tkchips,#tkex,#tsex,#ctabs,#opchips,#oex,#mtabs{flex-wrap:wrap;overflow:visible;margin-right:0;padding-right:0;-webkit-mask-image:none;mask-image:none}.tabs>*,#sdsub>*,#cex>*,#tkchips>*,#tkex>*,#tsex>*,#ctabs>*,#opchips>*,#oex>*,#mtabs>*{white-space:normal}}
/* aturan dilipat: terbuka otomatis di layar lebar */
.rules-d{padding:0}
.rules-d summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;padding:8px 12px;font:800 15px var(--f-display)}
.rules-d summary::-webkit-details-marker{display:none}
.rules-d summary::after{content:"+";font:800 18px var(--f-mono);color:var(--muted)}
.rules-d[open] summary::after{content:"\2212"}
.rules-d ol{margin:0;padding:0 12px 10px 32px}
.rules-d li{margin:2px 0}
/* pemutar audio dan pembuka latihan */
#sdbar .card,#abar .card{padding:5px 10px;margin-top:6px}
#sdbar .muted,#abar .muted{margin:4px 0 0!important}
/* gambar dan hasil langkah */
.frs{max-height:clamp(70px,20vh,104px)}
.sd-add{font-size:clamp(20px,6vw,28px);margin:2px auto}
.sd-dvx{font-size:clamp(24px,7.5vw,34px);margin:4px 0 2px}
.sd-res{font-size:clamp(20px,6vw,28px);margin-top:2px}
.sd-list{gap:4px;margin-top:6px}
.sd-list div{font-size:13.5px;line-height:1.4;padding:3px 8px}
.sd-nav{margin-top:10px}
.sd-timer{margin:4px 0;gap:8px}
.sd-tbar{height:10px}
.sd-timer b{font-size:22px}
.sd-demo{min-height:96px;padding:6px 4px;gap:14px}
.sd-things{margin:8px 0 4px;min-height:48px}
.sd-th{font-size:32px}
.sd-box{width:56px;height:56px;font-size:22px}
.sd-two{gap:8px}
.sd-grp{padding:8px}
.b2vis{margin-top:2px}
.frin .field.num{padding:3px 6px;font-size:15px;width:60px}
.mcard p{font-size:13px;line-height:1.35}
@media (max-width:560px){.hide-s{display:none}.mcard p{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}}

/* ===== Bab 2: bilangan berpangkat ===== */
/* ===== Warna bertingkat: menu atas (kuning), submenu (biru), bagian materi (hijau), pilihan dalam kartu (oranye) ===== */
#sdsub .chip{border-color:var(--qb);color:var(--qb)}
#sdsub .chip[aria-pressed="true"]{background:var(--qb);border-color:var(--qb);color:var(--paper)}
#sdtabs .chip,#pwtabs .chip,#mtabs .chip{border-color:var(--pos);color:var(--ink)}
