<script>
/* ===== Mesin hitung langkah demi langkah + data soal (murni, bisa diuji di Node) ===== */
const MINUS = '−';
const OPSYM = { '+': '+', '-': MINUS, '*': '×', '/': ':' };

function fnum(n) { return String(Math.abs(n)).replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }
function sgn(n) { return (n < 0 ? MINUS : '') + fnum(n); }
function par(n) { return n < 0 ? '(' + MINUS + fnum(n) + ')' : fnum(n); }

function tokenize(src) {
  if (/[0-9]\s+[0-9]/.test(String(src))) throw new Error('Tulis tanda operasi di antara dua bilangan.');
  const s = String(src).replace(/\s+/g, '');
  if (!s) throw new Error('Tulis soalnya dulu.');
  const out = [];
  let i = 0;
  const digits = (from) => { let j = from; while (j < s.length && /[0-9]/.test(s.charAt(j))) j++; return j; };
  while (i < s.length) {
    const c = s.charAt(i);
    if (/[0-9]/.test(c)) {
      const j = digits(i);
      out.push({ t: 'n', v: parseInt(s.slice(i, j), 10) });
      i = j; continue;
    }
    if (c === '(' || c === ')') { out.push({ t: c }); i++; continue; }
    if ('+-−–'.indexOf(c) >= 0) {
      const p = out[out.length - 1];
      const unary = !p || p.t === 'o' || p.t === '(';
      if (unary) {
        if (c === '+') { i++; continue; }
        if (!/[0-9]/.test(s.charAt(i + 1))) throw new Error('Tanda minus harus langsung di depan angka, misalnya (−3).');
        const j = digits(i + 1);
        out.push({ t: 'n', v: -parseInt(s.slice(i + 1, j), 10) || 0 });
        i = j; continue;
      }
      out.push({ t: 'o', v: c === '+' ? '+' : '-' }); i++; continue;
    }
    if (c === '*' || c === 'x' || c === 'X' || c === '×' || c === '·') { out.push({ t: 'o', v: '*' }); i++; continue; }
    if (c === ':' || c === '/' || c === '÷') { out.push({ t: 'o', v: '/' }); i++; continue; }
    throw new Error('Karakter "' + c + '" tidak dikenali.');
  }
  return out;
}

function validate(tk) {
  let expectOperand = true, depth = 0;
  for (const t of tk) {
    if (expectOperand) {
      if (t.t === 'n') expectOperand = false;
      else if (t.t === '(') depth++;
      else throw new Error('Susunan soal belum benar. Periksa tanda operasi dan kurungnya.');
    } else {
      if (t.t === 'o') expectOperand = true;
      else if (t.t === ')') { depth--; if (depth < 0) throw new Error('Ada tanda kurung tutup yang berlebih.'); }
      else throw new Error('Tulis tanda operasi di antara dua bilangan.');
    }
  }
  if (expectOperand) throw new Error('Soal belum lengkap, ada operasi tanpa bilangan di ujungnya.');
  if (depth !== 0) throw new Error('Ada tanda kurung yang belum ditutup.');
}

function collapse(tk) {
  let changed = true;
  while (changed) {
    changed = false;
    for (let i = 0; i + 2 < tk.length; i++) {
      if (tk[i].t === '(' && tk[i + 1].t === 'n' && tk[i + 2].t === ')') {
        tk = tk.slice(0, i).concat([tk[i + 1]], tk.slice(i + 3));
        changed = true; break;
      }
    }
  }
  return tk;
}

function render(tk) {
  const parts = [];
  for (let i = 0; i < tk.length; i++) {
    const t = tk[i];
    if (t.t === 'n') {
      const prev = tk[i - 1];
      parts.push(t.v < 0 ? ((i === 0 || prev.t === '(') ? MINUS + fnum(t.v) : '(' + MINUS + fnum(t.v) + ')') : fnum(t.v));
    } else if (t.t === 'o') parts.push(OPSYM[t.v]);
    else parts.push(t.t);
  }
  return parts.join(' ').replace(/\( /g, '(').replace(/ \)/g, ')');
}

function reduceStep(tk, lo, hi, inParen) {
  let idx = -1, mult = false, mulOps = 0, addOps = 0;
  for (let k = lo + 1; k < hi; k += 2) {
    const v = tk[k].v;
    if (v === '*' || v === '/') { mulOps++; if (idx < 0) { idx = k; mult = true; } } else addOps++;
  }
  if (idx < 0) idx = lo + 1;
  const a = tk[idx - 1].v, b = tk[idx + 1].v, op = tk[idx].v;
  let r;
  if (op === '+') r = a + b;
  else if (op === '-') r = a - b;
  else if (op === '*') r = a * b;
  else {
    if (b === 0) throw new Error('Pembagian dengan nol tidak bisa dihitung.');
    if (a % b !== 0) throw new Error('Hasil bagi bukan bilangan bulat.');
    r = a / b;
  }
  if (r === 0) r = 0;
  const why = [];
  if (inParen) why.push('Isi kurung dihitung dulu.');
  if (mult) {
    if (addOps > 0) why.push('Perkalian dan pembagian dihitung sebelum penjumlahan dan pengurangan.');
    if (mulOps > 1) why.push('Kalau berbarengan, hitung dari kiri dulu.');
  } else if (addOps > 1) why.push('Penjumlahan dan pengurangan dihitung dari kiri dulu.');
  if (op === '+') {
    if (b < 0 && a >= 0) why.push('(+) ketemu (−) jadi (−).');
    else if (b < 0 && a < 0) why.push('Dua bilangan negatif: jumlahkan angkanya, hasilnya negatif.');
  } else if (op === '-') {
    if (b < 0) why.push('(−) ketemu (−) jadi (+).');
  } else if ((a < 0 || b < 0) && a !== 0) {
    why.push((a < 0) === (b < 0) ? 'Tanda sama, hasilnya positif.' : 'Tanda berbeda, hasilnya negatif.');
  }
  return {
    tokens: tk.slice(0, idx - 1).concat([{ t: 'n', v: r }], tk.slice(idx + 2)),
    eq: sgn(a) + ' ' + OPSYM[op] + ' ' + par(b) + ' = ' + sgn(r),
    why: why.join(' ')
  };
}

function solve(src) {
  let tk = collapse(tokenize(src));
  validate(tk);
  const steps = [{ expr: render(tk), eq: '', why: '' }];
  let guard = 0;
  while (tk.length > 1 && guard++ < 200) {
    let open = -1, close = -1;
    for (let i = 0; i < tk.length; i++) {
      if (tk[i].t === '(') open = i;
      if (tk[i].t === ')') { close = i; break; }
    }
    const inParen = open >= 0;
    const res = reduceStep(tk, inParen ? open + 1 : 0, inParen ? close : tk.length, inParen);
    tk = collapse(res.tokens);
    steps.push({ expr: render(tk), eq: res.eq, why: res.why });
  }
  return { steps: steps, value: tk[0].v };
}

function parseAns(str) {
  let s = String(str).trim().replace(/[−–]/g, '-').replace(/\s+/g, '');
  s = s.replace(/[^0-9.,\-]/g, '');
  if (!/^-?[0-9.,]+$/.test(s)) return NaN;
  if (/^-?\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
  else s = s.replace(',', '.');
  const v = Number(s);
  return isFinite(v) ? v : NaN;
}

/* ===== Pembuat soal acak ===== */
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const nz = (b) => { let v = 0; while (v === 0) v = rnd(-b, b); return v; };
const gOp = (n, first) => (n < 0 ? (first ? '-' + (-n) : '(-' + (-n) + ')') : String(n));
const LEVELS = { 1: { r: 9, m: 6, d: 6 }, 2: { r: 20, m: 10, d: 9 }, 3: { r: 50, m: 15, d: 12 } };

function makeQ(topic, level) {
  const L = LEVELS[level] || LEVELS[1];
  if (topic === 'all') topic = ['add', 'sub', 'mul', 'div', 'mix'][rnd(0, 4)];
  let e, a, b, c, d, q;
  if (topic === 'add') { a = nz(L.r); b = nz(L.r); e = gOp(a, true) + '+' + gOp(b); }
  else if (topic === 'sub') { a = nz(L.r); b = nz(L.r); e = gOp(a, true) + '-' + gOp(b); }
  else if (topic === 'mul') { a = nz(L.m); b = nz(L.m); e = gOp(a, true) + '*' + gOp(b); }
  else if (topic === 'div') { b = nz(L.d); q = nz(L.d); a = b * q; e = gOp(a, true) + ':' + gOp(b); }
  else {
    const t = rnd(1, 5);
    const ra = Math.max(5, Math.round(L.r / 2));
    if (t === 1) { a = nz(ra); b = nz(L.m); c = nz(L.m); e = gOp(a, true) + '+' + gOp(b) + '*' + gOp(c); }
    else if (t === 2) { a = nz(ra); b = nz(ra); c = nz(L.m); e = '(' + gOp(a, true) + '-' + gOp(b) + ')*' + gOp(c); }
    else if (t === 3) { a = nz(ra); c = nz(L.d); q = nz(L.d); b = c * q; e = gOp(a, true) + '-' + gOp(b) + ':' + gOp(c); }
    else if (t === 4) { a = nz(L.m); b = nz(ra); c = nz(ra); e = gOp(a, true) + '*(' + gOp(b, true) + '+' + gOp(c) + ')'; }
    else {
      a = nz(ra); c = nz(L.d); q = nz(L.d); b = c * q - a; d = nz(ra);
      if (b === 0) b = c;
      if ((a + b) % c !== 0) { b = c * q - a; if (b === 0) { a = a + 1; b = c * q - a; } }
      e = '(' + gOp(a, true) + '+' + gOp(b) + '):' + gOp(c) + '-' + gOp(d);
    }
  }
  const r = solve(e);
  return { expr: e, ans: r.value, steps: r.steps, topic: topic };
}

/* ===== Soal Challenge 1.1 (15 soal pilihan ganda dari buku) ===== */
const PG = [
  { q: 'Pernyataan yang benar adalah ….', opts: ['1 > 2', '3 < −7', '−2 > −3', '4 < −5'], key: 2,
    why: 'Di garis bilangan, makin ke kanan makin besar. −2 berada di sebelah kanan −3, jadi −2 > −3.' },
  { q: '−23 + 11 = ….', math: 1, expr: '-23+11', opts: ['11', '12', '−11', '−12'], key: 3 },
  { q: '14 − (−25) = ….', math: 1, expr: '14-(-25)', opts: ['11', '39', '−11', '−39'], key: 1 },
  { q: '−24 × (−5) = ….', math: 1, expr: '-24*(-5)', opts: ['60', '120', '−120', '−240'], key: 1 },
  { q: '26 : (−13) = ….', math: 1, expr: '26:(-13)', opts: ['1', '2', '−2', '−3'], key: 2 },
  { q: '(35 − (−17)) × (−30 + 27) = ….', math: 1, expr: '(35-(-17))*(-30+27)', opts: ['−54', '−156', '156', '639'], key: 1 },
  { q: '77 : (−11) × (−16) = ….', math: 1, expr: '77:(-11)*(-16)', opts: ['112', '256', '−112', '−462'], key: 0 },
  { q: '35 × (−11 − 19) = ….', math: 1, expr: '35*(-11-19)', opts: ['280', '350', '−280', '−1.050'], key: 3 },
  { q: '(27 − (−25)) : 13 − 6 × (−12) = ….', math: 1, expr: '(27-(-25)):13-6*(-12)', opts: ['−68', '−74', '74', '76'], key: 3 },
  { q: '9 × (28 + 23) senilai dengan ….', math: 1, opts: ['(9 + 28) × (9 + 23)', '(9 + 28) + (9 + 23)', '(9 × 28) × (9 × 23)', '(9 × 28) + (9 × 23)'], key: 3,
    why: 'Ini sifat distributif: a × (b + c) = (a × b) + (a × c).' },
  { q: 'Aldo memiliki beberapa permen untuk dibagikan kepada beberapa temannya. Setiap temannya mendapatkan permen yang banyaknya sama. Untuk menentukan banyaknya permen yang diperoleh teman-teman Aldo, maka operasi hitung yang digunakan adalah ….',
    opts: ['penjumlahan', 'pengurangan', 'pembagian', 'perkalian'], key: 2,
    why: 'Membagi permen sama banyak kepada beberapa orang berarti pembagian.' },
  { q: 'Erni memiliki 5 sisir buah pisang. Setiap sisir berisi 9 buah pisang. Untuk menentukan total jumlah pisang, maka operasi hitung yang digunakan adalah ….',
    opts: ['penjumlahan', 'pengurangan', 'perkalian', 'pembagian'], key: 2,
    why: '5 sisir yang masing-masing berisi 9 pisang berarti 5 × 9 = 45 pisang. Kelompok yang isinya sama banyak dihitung dengan perkalian.' },
  { q: 'Ranu baru saja membeli 20 buah kelereng. Di perjalanan, kelerengnya jatuh ke selokan sebanyak 4 buah. Kelereng yang dimiliki Ranu sekarang sebanyak ….',
    expr: '20-4', opts: ['7', '8', '12', '16'], key: 3 },
  { q: 'Ibu membeli 5 kg salak. Setiap kg berisi 12 buah. Ayah juga membeli salak sebanyak 2 kg. Setiap kg berisi 15. Banyak semua salak yang dibeli Ayah dan Ibu adalah ….',
    expr: '5*12+2*15', opts: ['60', '90', '120', '135'], key: 1 },
  { q: 'Ayah menurunkan suhu kulkas sebesar 17°C dari suhu semula. Jika suhu awal 13°C, maka suhu kulkas sekarang adalah …°C.',
    expr: '13-17', opts: ['3', '4', '−3', '−4'], key: 3 }
];

/* ===== Soal uraian (10 soal dari buku) ===== */
// Catatan: angka ketinggian pesawat pada soal 7 terpotong di foto buku; dipakai 18 m.
const TINGGI_PESAWAT = 18;
const URAIAN = [
  { q: '54 + 108 : 9 = ….', math: 1, expr: '54+108:9', ans: 66, hint: 'Pembagian dikerjakan lebih dulu daripada penjumlahan.' },
  { q: '48 − 3 × 11 + 62 = ….', math: 1, expr: '48-3*11+62', ans: 77, hint: 'Kerjakan perkalian dulu, lalu pengurangan dan penjumlahan dari kiri.' },
  { q: '84 : (20 − 13) − 5 = ….', math: 1, expr: '84:(20-13)-5', ans: 7, hint: 'Hitung isi kurung dulu.' },
  { q: '39 + 7 × 8 : 4 − (46 − 14) = ….', math: 1, expr: '39+7*8:4-(46-14)', ans: 21, hint: 'Urutannya: kurung, perkalian dan pembagian dari kiri, lalu penjumlahan dan pengurangan dari kiri.' },
  { q: 'Siswa kelas 9 sedang mengerjakan soal ujian. Pada penilaian tersebut terdapat aturan bahwa setiap soal yang dijawab benar mendapat nilai 2. Soal yang dijawab salah bernilai −1 dan soal yang tidak dijawab tidak mendapat nilai (nol). Dari 50 soal, Devi menjawab 45 soal dan yang benar 38 soal. Total nilai yang diperoleh Devi adalah ….',
    ans: 69, chk: '38*2+7*(-1)', hint: 'Cari dulu banyak soal yang dijawab salah.',
    steps: ['Soal dijawab salah = 45 − 38 = 7 soal.', 'Nilai soal benar = 38 × 2 = 76.', 'Nilai soal salah = 7 × (−1) = −7.', 'Soal tidak dijawab bernilai 0.', 'Total nilai = 76 + (−7) + 0 = 69.'] },
  { q: 'Sebuah toko memproduksi donat untuk dijual. Banyak donat yang dibuat pada produksi pertama ada 730 buah. Kemudian memproduksi lagi sebanyak 950 donat. Semua donat tersebut dimasukkan ke dalam kotak, di mana setiap kotak berisi 12 donat. Kemudian, donat tersebut terjual sebanyak 82 kotak. Banyak donat yang belum terjual adalah … kotak.',
    ans: 58, unit: 'kotak', chk: '(730+950):12-82', hint: 'Cari total donat, ubah ke kotak, lalu kurangi yang terjual.',
    steps: ['Total donat = 730 + 950 = 1.680 buah.', 'Banyak kotak = 1.680 : 12 = 140 kotak.', 'Belum terjual = 140 − 82 = 58 kotak.'] },
  { q: 'Seekor ikan paus berada di kedalaman 15 m di bawah permukaan laut. Sebuah pesawat yang sedang terbang berada di ketinggian ' + TINGGI_PESAWAT + ' m di atas permukaan laut. Jarak pesawat dengan paus adalah ….',
    ans: 15 + TINGGI_PESAWAT, unit: 'm', chk: '15+' + TINGGI_PESAWAT, hint: 'Di bawah permukaan laut diberi tanda negatif. Jarak dihitung dari selisih dua posisi.',
    steps: ['Posisi paus = −15 m, posisi pesawat = ' + TINGGI_PESAWAT + ' m.', 'Jarak = ' + TINGGI_PESAWAT + ' − (−15) = ' + TINGGI_PESAWAT + ' + 15 = ' + (15 + TINGGI_PESAWAT) + ' m.'] },
  { q: 'Cika mempunyai pita sepanjang 7 m. Kemudian Cika membeli pita sepanjang 8 m. Pita tersebut dibagikan untuk dirinya dan kedua adiknya sama rata. Panjang pita yang didapat masing-masing adalah ….',
    ans: 5, unit: 'm', chk: '(7+8):3', hint: 'Yang membagi pita ada 3 orang: Cika dan kedua adiknya.',
    steps: ['Panjang pita seluruhnya = 7 + 8 = 15 m.', 'Dibagi untuk 3 orang = 15 : 3 = 5 m.'] },
  { q: 'Suhu di dalam kulkas −6°C. Sedangkan suhu di ruangan 25°C. Perbedaan suhu di dalam kulkas dan di ruangan adalah ….',
    ans: 31, unit: '°C', chk: '25-(-6)', hint: 'Perbedaan suhu adalah suhu yang lebih tinggi dikurangi suhu yang lebih rendah.',
    steps: ['Perbedaan = 25 − (−6).', '(−) ketemu (−) jadi (+), maka 25 + 6 = 31°C.'] },
  { q: 'Seorang pedagang mempunyai 8 drum minyak. Masing-masing berisi 250 liter. Jika semua minyak dipindahkan ke dalam jeriken berukuran 20 liter, maka banyak jeriken yang harus disediakan adalah ….',
    ans: 100, unit: 'jeriken', chk: '8*250:20', hint: 'Cari dulu seluruh minyaknya, lalu bagi dengan isi satu jeriken.',
    steps: ['Seluruh minyak = 8 × 250 = 2.000 liter.', 'Banyak jeriken = 2.000 : 20 = 100 jeriken.'] }
];

if (typeof module !== 'undefined') module.exports = { solve, tokenize, parseAns, makeQ, PG, URAIAN, LEVELS, render, collapse };
/* ===== Trik Perkalian: mesin langkah murni (bisa diuji di Node) =====
   Pokok metode: pecah bilangan menurut nilai tempat, kalikan tiap pasang angka dalam kotak,
   kelompokkan hasil kali yang nilai tempatnya sama, lalu jumlahkan dari depan (nilai tempat terbesar). */
const G_PLACE = ['satuan', 'puluhan', 'ratusan', 'ribuan', 'puluh ribuan', 'ratus ribuan', 'juta'];
const G_PV = [1, 10, 100, 1000, 10000, 100000];
const G_ARROW = '→';
const G_TIMES = '×';
const G_KINDS = { '22': { na: 2, nb: 2 }, '31': { na: 3, nb: 1 }, '32': { na: 3, nb: 2 }, '33': { na: 3, nb: 3 } };

function gf(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }
function gdigs(n) { return String(n).split('').map(Number); }
const grnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));

/* Angka ke kata bahasa Indonesia supaya suara pembaca tidak salah ucap. */
const G_SAT = ['nol', 'satu', 'dua', 'tiga', 'empat', 'lima', 'enam', 'tujuh', 'delapan', 'sembilan', 'sepuluh', 'sebelas'];
function terb(n) {
  n = Math.floor(n);
  if (n < 0) return 'min ' + terb(-n);
  if (n < 12) return G_SAT[n];
  if (n < 20) return G_SAT[n - 10] + ' belas';
  if (n < 100) return G_SAT[Math.floor(n / 10)] + ' puluh' + (n % 10 ? ' ' + G_SAT[n % 10] : '');
  if (n < 200) return 'seratus' + (n > 100 ? ' ' + terb(n - 100) : '');
  if (n < 1000) return G_SAT[Math.floor(n / 100)] + ' ratus' + (n % 100 ? ' ' + terb(n % 100) : '');
  if (n < 2000) return 'seribu' + (n > 1000 ? ' ' + terb(n - 1000) : '');
  if (n < 1000000) return terb(Math.floor(n / 1000)) + ' ribu' + (n % 1000 ? ' ' + terb(n % 1000) : '');
  return terb(Math.floor(n / 1000000)) + ' juta' + (n % 1000000 ? ' ' + terb(n % 1000000) : '');
}

function gRange(nd) { return nd === 1 ? [2, 9] : [Math.pow(10, nd - 1), Math.pow(10, nd) - 1]; }
function gCheck(kind, as, bs) {
  const K = G_KINDS[kind];
  const one = (s, nd, nama) => {
    const t = String(s).trim();
    const r = gRange(nd);
    if (!/^\d+$/.test(t)) return { err: nama + ' harus berupa bilangan bulat positif.' };
    const v = parseInt(t, 10);
    if (v < r[0] || v > r[1]) return { err: nama + ' harus ' + (nd === 1 ? 'satu angka (2 sampai 9)' : nd + ' digit (' + r[0] + ' sampai ' + r[1] + ')') + '.' };
    return { v: v };
  };
  const a = one(as, K.na, 'Bilangan pertama'); if (a.err) return a;
  const b = one(bs, K.nb, 'Bilangan kedua'); if (b.err) return b;
  return { a: a.v, b: b.v };
}
function gProblem(kind) {
  const K = G_KINDS[kind];
  const pick = (nd) => { const r = gRange(nd); let v; do { v = grnd(r[0], r[1]); } while (nd > 1 && v % 10 === 0); return v; };
  return { a: pick(K.na), b: pick(K.nb) };
}

/* Pola kolom dengan huruf, mis. 3 digit x 2 digit: ribuan = a x d ; ratusan = a x e + b x d ; ... */
function gPattern(na, nb) {
  const LA = 'abcdef'.slice(0, na).split(''), LB = 'abcdef'.slice(na, na + nb).split('');
  const out = [];
  for (let p = na + nb - 2; p >= 0; p--) {
    const t = [];
    for (let i = 0; i < na; i++) for (let j = 0; j < nb; j++) if ((na - 1 - i) + (nb - 1 - j) === p) t.push(LA[i] + ' ' + G_TIMES + ' ' + LB[j]);
    out.push({ name: G_PLACE[p], expr: (t.length > 1 ? t.map((x) => '(' + x + ')') : t).join(' + ') });
  }
  return { la: LA, lb: LB, cols: out };
}

function gPlan(a, b) {
  const A = gdigs(a), B = gdigs(b), na = A.length, nb = B.length, cells = [];
  for (let i = 0; i < na; i++) for (let j = 0; j < nb; j++) {
    const pa = na - 1 - i, pb = nb - 1 - j;
    cells.push({ i: i, j: j, da: A[i], db: B[j], pa: pa, pb: pb, p: pa + pb, prod: A[i] * B[j] });
  }
  const cols = []; let run = 0;
  for (let p = na + nb - 2; p >= 0; p--) {
    const terms = cells.filter((c) => c.p === p);
    const sum = terms.reduce((s, c) => s + c.prod, 0);
    const val = sum * G_PV[p], before = run;
    run += val;
    const exs = terms.map((t) => terms.length > 1 ? '(' + t.da + ' ' + G_TIMES + ' ' + t.db + ')' : t.da + ' ' + G_TIMES + ' ' + t.db), prs = terms.map((t) => t.prod);
    const calc = terms.length === 1 ? exs[0] + ' = ' + prs[0] : exs.join(' + ') + ' = ' + prs.join(' + ') + ' = ' + sum;
    cols.push({ p: p, name: G_PLACE[p], terms: terms, sum: sum, val: val, before: before, run: run, calc: calc });
  }
  return { a: a, b: b, A: A, B: B, na: na, nb: nb, cells: cells, cols: cols, total: a * b };
}

function gDecomp(n) {
  const d = gdigs(n), L = d.length;
  const parts = d.map((x, i) => x * G_PV[L - 1 - i]).filter((x) => x > 0);
  return { parts: parts, text: L === 1 ? gf(n) + ' (satu angka, tidak perlu dipecah)' : gf(n) + ' = ' + parts.map(gf).join(' + '),
    say: L === 1 ? terb(n) + ' cukup satu angka' : terb(n) + ' sama dengan ' + parts.map(terb).join(' tambah ') };
}

/* Pengerjaan cepat (kali silang): hasil tiap kolom ditulis bergeser satu tempat, lalu angka yang bertumpuk dijumlahkan. */
function gStack(P) {
  const adds = {};
  P.cols.forEach((c) => {
    String(c.sum).split('').reverse().forEach((ch, k) => { (adds[c.p + k] = adds[c.p + k] || []).push({ d: +ch, from: c.p, k: k }); });
  });
  let top = 0;
  Object.keys(adds).forEach((q) => { if (+q > top) top = +q; });
  const low = []; let carry = 0, q = 0;
  while (q <= top || carry > 0) {
    const a = (adds[q] || []).slice().sort((x, y) => x.k - y.k);
    const total = a.reduce((s, x) => s + x.d, 0) + carry;
    low.push({ q: q, adds: a, carryIn: carry, total: total, digit: total % 10, carryOut: Math.floor(total / 10) });
    carry = Math.floor(total / 10); q++;
  }
  while (low.length > 1) {
    const t = low[low.length - 1];
    if (!t.adds.length && !t.carryIn && t.digit === 0) low.pop(); else break;
  }
  const value = low.reduce((s, c) => s + c.digit * Math.pow(10, c.q), 0);
  return { cells: low.slice().reverse(), low: low, value: value };
}

function gLesson(a, b) {
  const P = gPlan(a, b), steps = [], da = gDecomp(a), db = gDecomp(b);
  steps.push({
    h: 'Pecah menurut nilai tempat', f: [da.text, db.text],
    t: 'Setiap angka membawa nilai tempatnya. Angka nol boleh dilewati.',
    say: 'Soalnya ' + terb(a) + ' kali ' + terb(b) + '. Pertama, pecah bilangan menurut nilai tempat. ' + da.say + '. ' + db.say + '.'
  });
  steps.push({
    h: 'Buat kotak nilai tempat', f: ['Banyak kotak: ' + P.na + ' ' + G_TIMES + ' ' + P.nb + ' = ' + (P.na * P.nb)], grid: true,
    t: 'Kalikan setiap pasang angka. Kotak yang warnanya sama punya nilai tempat yang sama.',
    say: 'Selanjutnya buat kotak nilai tempat. Ada ' + terb(P.na * P.nb) + ' kotak. Kalikan setiap pasang angka. Kotak yang warnanya sama punya nilai tempat yang sama, jadi nanti dijumlahkan bersama.'
  });
  P.cols.forEach((c, k) => {
    const ex = c.terms.map((t) => c.terms.length > 1 ? '(' + t.da + ' ' + G_TIMES + ' ' + t.db + ')' : t.da + ' ' + G_TIMES + ' ' + t.db), pr = c.terms.map((t) => t.prod);
    const l1 = c.terms.length === 1 ? ex[0] + ' = ' + pr[0] : ex.join(' + ') + ' = ' + pr.join(' + ') + ' = ' + c.sum;
    const f = [l1, c.sum + ' ' + c.name + ' = ' + gf(c.val),
      k === 0 ? 'Total sementara: ' + gf(c.run) : 'Total sementara: ' + gf(c.before) + ' + ' + gf(c.val) + ' = ' + gf(c.run)];
    let say = 'Kolom ' + c.name + '. ' + c.terms.map((t) => terb(t.da) + ' kali ' + terb(t.db) + ' sama dengan ' + terb(t.prod) + '.').join(' ');
    if (c.terms.length > 1) say += ' Dijumlahkan, ' + pr.map(terb).join(' tambah ') + ' sama dengan ' + terb(c.sum) + '.';
    say += ' Jadi ada ' + terb(c.sum) + ' ' + c.name + ', nilainya ' + terb(c.val) + '.';
    say += k === 0 ? ' Total sementara ' + terb(c.run) + '.' : ' ' + terb(c.before) + ' tambah ' + terb(c.val) + ' sama dengan ' + terb(c.run) + '.';
    steps.push({ h: 'Kolom ' + c.name, f: f, t: 'Jumlahkan semua hasil kali yang warnanya sama. Hitung dari depan, mulai nilai tempat terbesar.', p: c.p, say: say });
  });
  const S = gStack(P);
  const sl = [], ss = [];
  S.low.forEach((c) => {
    const ds = c.adds.map((x) => x.d), name = G_PLACE[c.q], many = ds.length + (c.carryIn ? 1 : 0) > 1;
    let t = name + ': ' + (ds.length ? ds.join(' + ') : '0') + (c.carryIn ? ' + ' + c.carryIn + ' (simpan)' : '');
    if (many) t += ' = ' + c.total;
    if (c.carryOut) t += '  ' + G_ARROW + '  tulis ' + c.digit + ', simpan ' + c.carryOut;
    sl.push(t);
    let say = name + ', ';
    if (!many) say += terb(c.total) + '.';
    else {
      say += ds.map(terb).join(' tambah ') + (c.carryIn ? ' tambah simpanan ' + terb(c.carryIn) : '') + ' sama dengan ' + terb(c.total) + '.';
      if (c.carryOut) say += ' Tulis ' + terb(c.digit) + ', simpan ' + terb(c.carryOut) + '.';
    }
    ss.push(say);
  });
  steps.push({
    h: 'Cara cepat: tumpuk angkanya', f: sl, stack: true,
    t: 'Tulis hasil tiap kolom, geser satu tempat setiap kolom, lalu tambahkan angka yang bertumpuk mulai dari satuan. Kalau jumlahnya lebih dari 9, simpan angka puluhannya ke tempat di sebelah kirinya.',
    say: 'Sekarang cara cepat, yaitu kali silang. Tulis hasil tiap kolom, geser satu tempat ke kiri untuk setiap kolom. Lalu jumlahkan angka yang bertumpuk, mulai dari satuan. ' + ss.join(' ')
  });
  const runs = P.cols.map((c) => c.run);
  steps.push({
    h: 'Hasil akhir', f: [gf(a) + ' ' + G_TIMES + ' ' + gf(b) + ' = ' + gf(P.total), 'Mencongak: ' + runs.map(gf).join(' ' + G_ARROW + ' ')],
    t: 'Total sementara yang terakhir adalah hasilnya. Saat berlatih menghitung di kepala, sebut saja urutan angka di atas.', final: true,
    say: 'Jadi, ' + terb(a) + ' kali ' + terb(b) + ' sama dengan ' + terb(P.total) + '. Saat mencongak, cukup sebut: ' + runs.map(terb).join(', lalu ') + '.'
  });
  return { plan: P, steps: steps, total: P.total, grid: true, stack: S };
}

/* Trik khusus: puluhan sama, satuan berjumlah 10. (10t+u)(10t+v) = 100 t(t+1) + uv */
function gSpecial(a, b) {
  if (!(a >= 10 && a <= 99 && b >= 10 && b <= 99)) return { err: 'Trik ini untuk dua bilangan dua digit.' };
  const t1 = Math.floor(a / 10), t2 = Math.floor(b / 10), u = a % 10, v = b % 10;
  if (t1 !== t2) return { err: 'Angka puluhannya harus sama. Di sini puluhannya ' + t1 + ' dan ' + t2 + '.' };
  if (u + v !== 10) return { err: 'Angka satuannya harus berjumlah 10. Di sini ' + u + ' + ' + v + ' = ' + (u + v) + '.' };
  const front = t1 * (t1 + 1), back = u * v, bs = back < 10 ? '0' + back : String(back), total = front * 100 + back;
  const steps = [
    { h: 'Cek syarat', f: ['Puluhan sama: ' + t1 + ' dan ' + t2, 'Satuan: ' + u + ' + ' + v + ' = 10'], t: 'Kedua syarat terpenuhi, jadi trik ini bisa dipakai.',
      say: 'Soalnya ' + terb(a) + ' kali ' + terb(b) + '. Periksa dulu syaratnya. Angka puluhan sama, yaitu ' + terb(t1) + '. Angka satuan ' + terb(u) + ' tambah ' + terb(v) + ' sama dengan sepuluh. Syarat terpenuhi.' },
    { h: 'Dua angka depan', f: [t1 + ' ' + G_TIMES + ' (' + t1 + ' + 1) = ' + t1 + ' ' + G_TIMES + ' ' + (t1 + 1) + ' = ' + front], t: 'Kalikan angka puluhan dengan angka puluhan ditambah satu.',
      say: 'Dua angka depan. Kalikan angka puluhan dengan angka puluhan tambah satu. ' + terb(t1) + ' kali ' + terb(t1 + 1) + ' sama dengan ' + terb(front) + '.' },
    { h: 'Dua angka belakang', f: [u + ' ' + G_TIMES + ' ' + v + ' = ' + back + (back < 10 ? '  ' + G_ARROW + '  tulis ' + bs : '')], t: 'Bagian belakang selalu ditulis dua angka. Kalau hasilnya satu angka, tambahkan 0 di depannya.',
      say: 'Dua angka belakang. Kalikan angka satuan. ' + terb(u) + ' kali ' + terb(v) + ' sama dengan ' + terb(back) + (back < 10 ? '. Tulis nol ' + terb(back) + ', karena bagian belakang selalu dua angka' : '') + '.' },
    { h: 'Gabungkan', f: [front + ' | ' + bs + '  ' + G_ARROW + '  ' + gf(total)], t: 'Tempel bagian depan dan bagian belakang.', final: true,
      say: 'Gabungkan bagian depan dan belakang. ' + terb(a) + ' kali ' + terb(b) + ' sama dengan ' + terb(total) + '.' }
  ];
  return { steps: steps, total: total, grid: false, sp: { a: a, b: b, t: t1, u: u, v: v, front: front, bs: bs, total: total } };
}

if (typeof module !== 'undefined') module.exports = { terb, gStack, gPlan, gLesson, gSpecial, gCheck, gProblem, gPattern, gRange, G_KINDS, gf };
/* ===== Materi SD: penjumlahan (mesin murni, bisa diuji di Node) ===== */
const SD_PLACE = ['Satuan', 'Puluhan', 'Ratusan', 'Ribuan'];

/* Pasangan bilangan yang jumlahnya n (1 sampai 10): 1 = 1 + 0, 4 = 3 + 1 dan 2 + 2, dst. */
function sdPairs(n) {
  if (n === 1) return [[1, 0]];
  const o = [];
  for (let a = n - 1; a >= Math.ceil(n / 2); a--) o.push([a, n - a]);
  return o;
}

/* Titik untuk a + b: ambil (10 - a) titik dari b supaya a menjadi 10, sisanya ditulis di belakang. */
function sdDots(a, b) {
  const move = a >= 10 ? 0 : 10 - a;
  return { a: a, b: b, move: move, rest: b - move, sum: a + b, ten: a >= 10 };
}

/* Jumlah per kolom nilai tempat. cin[i] = 1 jika kolom di kanannya "menyimpan" 1 ke kolom i. */
function sdCols(a, b) {
  const n = Math.max(String(a).length, String(b).length);
  const A = String(a).padStart(n, '0').split('').map(Number), B = String(b).padStart(n, '0').split('').map(Number);
  const s = A.map((x, i) => x + B[i]), cin = new Array(n).fill(0);
  for (let i = n - 1; i >= 1; i--) cin[i - 1] = s[i] + cin[i] >= 10 ? 1 : 0;
  const d = s.map((x, i) => (x + cin[i]) % 10), lead = s[0] + cin[0] >= 10 ? 1 : 0;
  const total = parseInt((lead ? '1' : '') + d.join(''), 10);
  return { n: n, A: A, B: B, s: s, cin: cin, d: d, lead: lead, total: total };
}

/* Cara lambat: jumlahkan tiap nilai tempat dulu, lalu gabungkan. */
function sdLambat(a, b) {
  const C = sdCols(a, b), pv = (i) => Math.pow(10, C.n - 1 - i);
  const pa = C.A.map((x, i) => x * pv(i)), pb = C.B.map((x, i) => x * pv(i)), ps = C.s.map((x, i) => x * pv(i));
  return { C: C, pa: pa, pb: pb, ps: ps, total: ps.reduce((x, y) => x + y, 0) };
}

/* Cara cepat: kerjakan dari depan, lihat kolom di sebelah kanannya. Jika kanan 10 atau lebih, simpan 1. */
function sdCepat(a, b) {
  const C = sdCols(a, b), lines = [];
  for (let i = 0; i < C.n; i++) {
    const nm = SD_PLACE[C.n - 1 - i], ai = C.A[i], bi = C.B[i];
    let t = nm + ': ' + ai + ' + ' + bi + ' = ' + C.s[i];
    if (i < C.n - 1) {
      const rn = SD_PLACE[C.n - 2 - i], rv = C.s[i + 1];
      if (C.cin[i]) t += '. Lihat kanan (' + rn + ') ' + rv + (rv >= 10 ? ', 10 atau lebih' : ', ditambah 1 simpanan jadi 10') + ', simpan 1: ' + C.s[i] + ' + 1 = ' + (C.s[i] + 1);
      else t += '. Lihat kanan (' + rn + ') ' + rv + ', kurang dari 10, tidak ada simpanan';
    }
    t += ' → tulis ' + C.d[i];
    lines.push(t);
  }
  return { C: C, lines: lines, total: C.total };
}

/* Dua digit: pisahkan puluhan dan satuan. */
function sdSplit(a, b) {
  const ta = Math.floor(a / 10) * 10, ua = a % 10, tb = Math.floor(b / 10) * 10, ub = b % 10;
  const st = ta + tb, su = ua + ub, carry = su >= 10, total = a + b, L = [];
  L.push(a + ' = ' + ta + ' + ' + ua + (b >= 10 ? ' dan ' + b + ' = ' + tb + ' + ' + ub : ''));
  L.push('Puluhan: ' + ta + ' + ' + tb + ' = ' + st);
  L.push('Satuan: ' + ua + ' + ' + ub + ' = ' + su);
  if (carry) {
    L.push(su + ' = 10 + ' + (su - 10) + '. Yang 10 pindah ke puluhan: ' + st + ' + 10 = ' + (st + 10));
    L.push('Gabungkan: ' + (st + 10) + ' + ' + (su - 10) + ' = ' + total);
  } else L.push('Gabungkan: ' + st + ' + ' + su + ' = ' + total);
  return { lines: L, total: total, carry: carry };
}

function sdRunning(list) { let s = 0; return list.map((x) => (s += x)); }

/* Soal acak. Hasil: { ans, a, b } atau { ans, list } */
function sdProblem(kind) {
  const r = (lo, hi) => lo + Math.floor(Math.random() * (hi - lo + 1));
  if (kind.charAt(0) === 'k') return klProblem(kind);
  if (kind === 'dasar') { const s = r(2, 10), a = r(1, s - 1); return { a: a, b: s - a, ans: s }; }
  if (kind === 'mahir') { const a = r(2, 9), b = r(Math.max(2, 11 - a), 9); return { a: a, b: b, ans: a + b }; }
  if (kind === 'n9') { const b = r(2, 9); return { a: 9, b: b, ans: 9 + b }; }
  if (kind === 'd1') { const a = r(11, 98), b = r(2, 9); return { a: a, b: b, ans: a + b }; }
  if (kind === 'd2') { const a = r(11, 89), b = r(11, 89); return { a: a, b: b, ans: a + b }; }
  if (kind === 'd3') { const a = r(101, 899), b = r(101, 899); return { a: a, b: b, ans: a + b }; }
  if (/^(pw[mdprv]|q5|q50)$/.test(kind)) return pwProblem(kind);
  if (/^f[asmdz]$/.test(kind)) {
    const mk = (improperOk) => { let n, dd, t = 0; do { dd = r(2, 12); n = r(1, dd + (improperOk ? 2 : 0)); t++; } while (frGcd(n, dd) !== 1 && t < 80); return [n, dd]; };
    let a, b, c, d, op = null;
    if (kind === 'fz') { let p, q, t = 0; do { p = r(1, 14); q = r(2, 14); t++; } while ((frGcd(p, q) !== 1 || p === q) && t < 200); const g = r(2, 7); a = p * g; b = q * g; }
    else {
      const imp = kind === 'fm' || kind === 'fd';
      do {
        [a, b] = mk(imp); [c, d] = mk(imp);
        if (kind === 'fs' && a * d < c * b) { const t1 = a, t2 = b; a = c; b = d; c = t1; d = t2; }
      } while (kind === 'fs' && a * d === c * b);
      op = { fa: '+', fs: '−', fm: '×', fd: '÷' }[kind];
    }
    const sol = frSolve(kind, a, b, c, d);
    return { fr: true, kind: kind, a: a, b: b, c: c, d: d, op: op, lab: kind === 'fz' ? 'Sederhanakan' : null, ansN: sol.n, ansD: sol.d, ans: sol.n / sol.d, show: sol.show };
  }
  if (/^s[1-4]$/.test(kind)) {
    const lo = { s1: [10, 99, 1, 9], s2: [10, 99, 10, 99], s3: [100, 999, 100, 999], s4: [1000, 9999, 1000, 9999] }[kind];
    const wantBorrow = Math.random() < 0.8; let a, b, tries = 0;
    do { a = r(lo[0], lo[1]); b = r(lo[2], lo[3]); tries++; } while (a <= b || (wantBorrow && tries < 60 && sdCaraSub(a, b).borrows === 0));
    return { a: a, b: b, ans: a - b, op: '−' };
  }
  if (kind === 'p3s') {
    let a, dd;
    do { dd = Math.random() < 0.5 ? r(2, 9) : r(11, 60); a = r(100, 999); } while (a % dd === 0);
    return { a: a, b: dd, ans: Math.floor(a / dd), rem: a % dd, op: ':' };
  }
  if (kind === 'p31' || kind === 'p32') { const dd = kind === 'p31' ? r(2, 9) : r(11, 60), q = r(Math.max(2, Math.ceil(100 / dd)), Math.floor(999 / dd)); return { a: dd * q, b: dd, ans: q, op: ':' }; }
  if (kind === 'd4') { const a = r(1001, 8999), b = r(1001, 8999); return { a: a, b: b, ans: a + b }; }
  const list = []; for (let i = 0; i < 6; i++) list.push(r(2, 9));
  return { list: list, ans: list.reduce((x, y) => x + y, 0) };
}

/* Cek isian dua bilangan. kind: 'd1' (2 digit + 1 digit), 'd2' (2 + 2), 'd3' (3 + 3), 'd4' (4 + 4), 'p31' (3 : 1), 'p32' (3 : 2), 'p3s' (3 : 1 atau 2, bersisa), 's1'..'s4' (pengurangan 2-1, 2-2, 3-3, 4-4 digit). */
function sdCheck(kind, as, bs) {
  const K = { d1: [10, 99, 1, 9], d2: [10, 99, 10, 99], d3: [100, 999, 100, 999], d4: [1000, 9999, 1000, 9999], p31: [100, 999, 2, 9], p32: [100, 999, 10, 99], p3s: [100, 999, 2, 99], s1: [10, 99, 1, 9], s2: [10, 99, 10, 99], s3: [100, 999, 100, 999], s4: [1000, 9999, 1000, 9999] }[kind];
  const get = (s, lo, hi, nama) => {
    const t = String(s).trim();
    if (!/^\d+$/.test(t)) return { err: nama + ' harus berupa bilangan bulat.' };
    const v = parseInt(t, 10);
    if (v < lo || v > hi) return { err: nama + ' harus antara ' + lo + ' dan ' + hi + '.' };
    return { v: v };
  };
  const a = get(as, K[0], K[1], 'Bilangan pertama'); if (a.err) return a;
  const b = get(bs, K[2], K[3], 'Bilangan kedua'); if (b.err) return b;
  if (/^s[1-4]$/.test(kind) && a.v < b.v) return { err: 'Bilangan pertama tidak boleh lebih kecil dari bilangan kedua.' };
  return { a: a.v, b: b.v };
}

/* Penjumlahan tiga digit: jumlahkan ratusan, puluhan, satuan langsung, tulis bertingkat (tiap baris geser satu tempat), lalu jumlahkan ke bawah. */
function sdCara3(a, b) {
  const a2 = Math.floor(a / 100), a1 = Math.floor(a / 10) % 10, a0 = a % 10, b2 = Math.floor(b / 100), b1 = Math.floor(b / 10) % 10, b0 = b % 10;
  const s2 = a2 + b2, s1 = a1 + b1, s0 = a0 + b0;
  const d0 = s0 % 10, t1 = Math.floor(s0 / 10) + (s1 % 10), d1 = t1 % 10, k1 = Math.floor(t1 / 10);
  const t2 = Math.floor(s1 / 10) + (s2 % 10) + k1, d2 = t2 % 10, k2 = Math.floor(t2 / 10), d3 = Math.floor(s2 / 10) + k2;
  return { a2: a2, a1: a1, a0: a0, b2: b2, b1: b1, b0: b0, s2: s2, s1: s1, s0: s0, d0: d0, t1: t1, d1: d1, k1: k1, t2: t2, d2: d2, k2: k2, d3: d3, digits: [d3, d2, d1, d0], total: s2 * 100 + s1 * 10 + s0 };
}

/* Penjumlahan empat digit: sama seperti tiga digit, ditambah satu kolom (ribuan). Tiap jumlah kolom ditulis sebagai puluhan (p, kecil) dan satuan (q). */
function sdCara4(a, b) {
  const dg = (n) => [Math.floor(n / 1000), Math.floor(n / 100) % 10, Math.floor(n / 10) % 10, n % 10];
  const A = dg(a), B = dg(b);
  const s3 = A[0] + B[0], s2 = A[1] + B[1], s1 = A[2] + B[2], s0 = A[3] + B[3];
  const p3 = Math.floor(s3 / 10), q3 = s3 % 10, p2 = Math.floor(s2 / 10), q2 = s2 % 10, p1 = Math.floor(s1 / 10), q1 = s1 % 10, p0 = Math.floor(s0 / 10), q0 = s0 % 10;
  const d0 = q0, t1 = p0 + q1, d1 = t1 % 10, k1 = Math.floor(t1 / 10);
  const t2 = p1 + q2 + k1, d2 = t2 % 10, k2 = Math.floor(t2 / 10);
  const t3 = p2 + q3 + k2, d3 = t3 % 10, k3 = Math.floor(t3 / 10), d4 = p3 + k3;
  return { A: A, B: B, s3: s3, s2: s2, s1: s1, s0: s0, p3: p3, q3: q3, p2: p2, q2: q2, p1: p1, q1: q1, p0: p0, q0: q0, d0: d0, t1: t1, d1: d1, k1: k1, t2: t2, d2: d2, k2: k2, t3: t3, d3: d3, k3: k3, d4: d4, digits: [d4, d3, d2, d1, d0], total: s3 * 1000 + s2 * 100 + s1 * 10 + s0 };
}

/* Pengurangan: kurangi dari satuan ke kiri. Kalau angka atas kurang, pinjam dari angka kiri terdekat yang bukan 0
   (angka itu berkurang 1, angka 0 yang dilewati menjadi 9) dan angka yang meminjam mendapat tambahan 10. Syarat: a >= b. */
function sdCaraSub(a, b) {
  const n = String(a).length, A = [], B = [];
  for (let i = 0; i < n; i++) { A.push(Math.floor(a / Math.pow(10, i)) % 10); B.push(Math.floor(b / Math.pow(10, i)) % 10); }
  const cur = A.slice(), steps = [], res = [];
  let borrows = 0;
  for (let i = 0; i < n; i++) {
    const s = { i: i, top: cur[i], bot: B[i], borrow: false, chain: [] };
    if (cur[i] < B[i]) {
      let j = i + 1; while (j < n && cur[j] === 0) j++;
      s.borrow = true; s.src = j; s.srcOld = cur[j];
      for (let k = i + 1; k < j; k++) { s.chain.push(k); cur[k] = 9; }
      cur[j] -= 1; s.srcNew = cur[j];
      cur[i] += 10; s.tot = cur[i];
      borrows++;
    }
    s.d = cur[i] - B[i]; res.push(s.d); steps.push(s);
  }
  const lead = res.map((x, i) => i > 0 && res.slice(i).every((y) => y === 0));
  return { n: n, A: A, B: B, steps: steps, res: res, lead: lead, borrows: borrows, total: a - b };
}

/* ===== Pecahan. Penjumlahan dan pengurangan dengan kali silang, perkalian dengan coret silang, pembagian dengan balik lalu kali ===== */
function frGcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { const t = a % b; a = b; b = t; } return a; }
function frFactors(n) { const f = []; for (let i = 1; i <= n; i++) if (n % i === 0) f.push(i); return f; }
function frH(n, d) { return '<span class="fr"><span>' + n + '</span><span>' + d + '</span></span>'; }
function frMixH(e) { return e.n === undefined ? String(e.w) : e.w + ' ' + frH(e.n, e.d); }

/* kind: 'fa' (+), 'fs' (-), 'fm' (x), 'fd' (:), 'fz' (sederhanakan). Mengembalikan bingkai tiap langkah untuk digambar. */
function frCheck(kind, vals) {
  const names = kind === 'fz' ? ['Pembilang', 'Penyebut'] : ['Pembilang pertama', 'Penyebut pertama', 'Pembilang kedua', 'Penyebut kedua'];
  const v = [];
  for (let i = 0; i < names.length; i++) {
    const t = String(vals[i] == null ? '' : vals[i]).trim();
    if (!/^\d+$/.test(t)) return { err: names[i] + ' harus berupa bilangan bulat.' };
    const x = parseInt(t, 10);
    if (x < 1 || x > 99) return { err: names[i] + ' harus antara 1 dan 99.' };
    v.push(x);
  }
  const r = { a: v[0], b: v[1], c: v[2], d: v[3] };
  if (kind === 'fs' && r.a * r.d < r.c * r.b) return { err: 'Pecahan pertama tidak boleh lebih kecil dari pecahan kedua.' };
  return r;
}

function frSolve(kind, a, b, c, d) {
  const OPS = { fa: '+', fs: '−', fm: '×', fd: '÷', fz: null }, one = kind === 'fz';
  const S = { f1: { n: a, d: b }, f2: one ? null : { n: c, d: d }, op: OPS[kind], rn: null, rd: null, old: {}, ext: null };
  const cp = (o) => (o ? { n: o.n, d: o.d } : null);
  const steps = [];
  const snap = (text, work, hl, arrows) => { steps.push({ text: text, work: work, hl: (hl || []).slice(), arrows: (arrows || []).map((x) => x.slice()), f1: cp(S.f1), f2: cp(S.f2), op: S.op, rn: S.rn, rd: S.rd, old: Object.assign({}, S.old), ext: S.ext }); };
  const init = { f1: cp(S.f1), f2: cp(S.f2), op: S.op, rn: null, rd: null, old: {}, ext: null, hl: [], arrows: [] };
  const tail = (n2, d2) => {
    if (d2 === 1) { S.ext = { w: n2 }; snap('Penyebutnya 1, jadi hasilnya bilangan bulat ' + n2 + '.', n2 + '/1 = <b>' + n2 + '</b>', ['rn', 'rd']); }
    else if (n2 > d2) {
      const w = Math.floor(n2 / d2), r = n2 % d2; S.ext = { w: w, n: r, d: d2 };
      snap('Pembilang lebih besar dari penyebut, jadi hasilnya lebih dari 1. Ubah ke pecahan campuran: ' + n2 + ' ÷ ' + d2 + ' = ' + w + ' sisa ' + r + ', jadi ' + w + ' ' + r + '/' + d2 + '.', n2 + '/' + d2 + ' = <b>' + w + ' ' + r + '/' + d2 + '</b>', ['rn', 'rd']);
    }
    return { n: n2, d: d2 };
  };
  const finish = (N, D) => {
    if (N === 0) { S.ext = { w: 0 }; snap('Hasil pengurangannya 0, jadi kedua pecahan sama besar. Hasilnya 0.', '0/' + D + ' = <b>0</b>', ['rn']); return { n: 0, d: 1 }; }
    const g = frGcd(N, D), n2 = N / g, d2 = D / g;
    if (g > 1) {
      S.old.rn = N; S.old.rd = D; S.rn = n2; S.rd = d2;
      snap('Sederhanakan. FPB dari ' + N + ' dan ' + D + ' adalah ' + g + '. Bagi pembilang dan penyebut dengan ' + g + ': ' + N + ' ÷ ' + g + ' = ' + n2 + ' dan ' + D + ' ÷ ' + g + ' = ' + d2 + '.', 'FPB(' + N + ', ' + D + ') = <b>' + g + '</b> → ' + n2 + '/' + d2, ['rn', 'rd']);
    } else snap('FPB dari ' + N + ' dan ' + D + ' adalah 1, jadi ' + N + '/' + D + ' sudah paling sederhana.', 'FPB(' + N + ', ' + D + ') = <b>1</b> → sudah sederhana', ['rn', 'rd']);
    return tail(n2, d2);
  };
  let res, intro;
  if (kind === 'fa' || kind === 'fs') {
    const plus = kind === 'fa', verb = plus ? 'Jumlahkan' : 'Kurangkan', sg = plus ? '+' : '−';
    const both = [['f1n', 'f2d', 'arrow'], ['f2n', 'f1d', 'arrow']];
    let N, D;
    intro = 'Tekan Lanjut. ' + (plus ? 'Jumlahkan' : 'Kurangkan') + ' dua pecahan dengan cara silang.';
    if (b === d) {
      D = b; S.rd = D;
      snap('Penyebutnya sama, yaitu ' + D + '. Jadi penyebut hasil tetap ' + D + ', tidak perlu kali silang.', 'Penyebut sama → tetap <b>' + D + '</b>', ['f1d', 'f2d', 'rd']);
      N = plus ? a + c : a - c; S.rn = N;
      snap(verb + ' pembilangnya: ' + a + ' ' + sg + ' ' + c + ' = ' + N + '.', 'Pembilang: ' + a + ' ' + sg + ' ' + c + ' = <b>' + N + '</b>', ['f1n', 'f2n', 'rn']);
    } else {
      const X = a * d, Y = c * b;
      snap('Kali silang pertama: pembilang pertama × penyebut kedua, yaitu ' + a + ' × ' + d + ' = ' + X + '.', a + ' × ' + d + ' = <b>' + X + '</b>', ['f1n', 'f2d'], [both[0]]);
      snap('Kali silang kedua: pembilang kedua × penyebut pertama, yaitu ' + c + ' × ' + b + ' = ' + Y + '.', c + ' × ' + b + ' = <b>' + Y + '</b>', ['f2n', 'f1d'], both);
      N = plus ? X + Y : X - Y; S.rn = N;
      snap(verb + ' kedua hasil silang untuk mendapat pembilang: ' + X + ' ' + sg + ' ' + Y + ' = ' + N + '.', 'Pembilang: ' + X + ' ' + sg + ' ' + Y + ' = <b>' + N + '</b>', ['rn'], both);
      D = b * d; S.rd = D;
      snap('Kalikan kedua penyebut: ' + b + ' × ' + d + ' = ' + D + '. Itu penyebut hasilnya.', 'Penyebut: ' + b + ' × ' + d + ' = <b>' + D + '</b>', ['f1d', 'f2d', 'rd']);
    }
    res = finish(N, D);
  } else if (kind === 'fm' || kind === 'fd') {
    let A = a, B = b, C = c, E = d;
    intro = kind === 'fm' ? 'Tekan Lanjut. Coret silang dulu supaya angkanya kecil, lalu kalikan.' : 'Tekan Lanjut. Balik pecahan kedua, lalu kalikan pembilang dengan pembilang dan penyebut dengan penyebut.';
    if (kind === 'fd') {
      C = d; E = c; S.old.f2n = c; S.old.f2d = d; S.f2 = { n: C, d: E }; S.op = '×';
      snap('Balik pecahan kedua: pembilang dan penyebutnya ditukar, ' + c + '/' + d + ' menjadi ' + C + '/' + E + '. Tanda bagi diubah menjadi kali.', c + '/' + d + ' dibalik → <b>' + C + '/' + E + '</b>, ÷ jadi ×', ['f2n', 'f2d']);
    }
    const lines = [['f1n', 'f2d', 'line']];
    if (kind === 'fm') {
    const g1 = frGcd(A, E), oA = A, oE = E;
    if (g1 > 1) {
      A = A / g1; E = E / g1; S.old.f1n = oA; S.old.f2d = oE; S.f1.n = A; S.f2.d = E;
      snap('Coret silang pertama: ' + oA + ' dan ' + oE + ' sama-sama habis dibagi ' + g1 + '. ' + oA + ' ÷ ' + g1 + ' = ' + A + ' dan ' + oE + ' ÷ ' + g1 + ' = ' + E + '.', 'FPB(' + oA + ', ' + oE + ') = <b>' + g1 + '</b> → ' + A + ' dan ' + E, ['f1n', 'f2d'], lines);
    } else snap('Coret silang pertama: ' + A + ' dan ' + E + ' tidak punya faktor persekutuan selain 1, jadi tidak ada yang dicoret.', 'FPB(' + A + ', ' + E + ') = <b>1</b> → tidak dicoret', ['f1n', 'f2d'], lines);
    lines.push(['f2n', 'f1d', 'line']);
    const g2 = frGcd(C, B), oC = C, oB = B;
    if (g2 > 1) {
      C = C / g2; B = B / g2; S.old.f2n = oC; S.old.f1d = oB; S.f2.n = C; S.f1.d = B;
      snap('Coret silang kedua: ' + oC + ' dan ' + oB + ' sama-sama habis dibagi ' + g2 + '. ' + oC + ' ÷ ' + g2 + ' = ' + C + ' dan ' + oB + ' ÷ ' + g2 + ' = ' + B + '.', 'FPB(' + oC + ', ' + oB + ') = <b>' + g2 + '</b> → ' + C + ' dan ' + B, ['f2n', 'f1d'], lines);
    } else snap('Coret silang kedua: ' + C + ' dan ' + B + ' tidak punya faktor persekutuan selain 1, jadi tidak ada yang dicoret.', 'FPB(' + C + ', ' + B + ') = <b>1</b> → tidak dicoret', ['f2n', 'f1d'], lines);
    }
    const N = A * C; S.rn = N;
    snap('Kalikan pembilang dengan pembilang: ' + A + ' × ' + C + ' = ' + N + '.', 'Pembilang: ' + A + ' × ' + C + ' = <b>' + N + '</b>', ['f1n', 'f2n', 'rn']);
    const D = B * E; S.rd = D;
    snap('Kalikan penyebut dengan penyebut: ' + B + ' × ' + E + ' = ' + D + '.', 'Penyebut: ' + B + ' × ' + E + ' = <b>' + D + '</b>', ['f1d', 'f2d', 'rd']);
    res = finish(N, D);
  } else {
    const g = frGcd(a, b);
    intro = 'Tekan Lanjut. Bagi pembilang dan penyebut dengan FPB-nya.';
    snap('Cari FPB (faktor persekutuan terbesar) dari ' + a + ' dan ' + b + '. Faktor ' + a + ': ' + frFactors(a).join(', ') + '. Faktor ' + b + ': ' + frFactors(b).join(', ') + '. Faktor yang sama dan terbesar adalah ' + g + '.', 'FPB(' + a + ', ' + b + ') = <b>' + g + '</b>', ['f1n', 'f1d']);
    S.rn = a / g; S.rd = b / g;
    if (g > 1) snap('Bagi pembilang dan penyebut dengan ' + g + ': ' + a + ' ÷ ' + g + ' = ' + S.rn + ' dan ' + b + ' ÷ ' + g + ' = ' + S.rd + '.', a + '/' + b + ' = <b>' + S.rn + '/' + S.rd + '</b>', ['rn', 'rd']);
    else snap('FPB-nya 1, jadi ' + a + '/' + b + ' sudah paling sederhana.', a + '/' + b + ' sudah sederhana', ['rn', 'rd']);
    res = tail(S.rn, S.rd);
  }
  const lhs = frH(a, b) + (one ? '' : ' ' + OPS[kind] + ' ' + frH(c, d)), lhsT = a + '/' + b + (one ? '' : ' ' + OPS[kind] + ' ' + c + '/' + d);
  const mixed = S.ext && S.ext.n !== undefined ? S.ext : null;
  return {
    frames: [init].concat(steps), steps: steps, n: res.n, d: res.d, ext: S.ext, intro: intro,
    resultHTML: lhs + ' = <b>' + (res.d === 1 ? res.n : frH(res.n, res.d)) + '</b>' + (mixed ? ' = ' + frMixH(mixed) : ''),
    show: lhsT + ' = ' + (res.d === 1 ? res.n : res.n + '/' + res.d) + (mixed ? ' (= ' + mixed.w + ' ' + mixed.n + '/' + mixed.d + ')' : '')
  };
}

/* ===== Bab 2: bilangan berpangkat. Perkalian, pembagian, pemangkatan, akar, dan kuadrat cepat ===== */
function idn(v) { return String(v).replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }
function pwExp(n, d) { const g = frGcd(n, d) || 1, s = d < 0 ? -1 : 1; return { n: s * n / g, d: s * d / g }; }
function pwRAdd(a, b) { return pwExp(a.n * b.d + b.n * a.d, a.d * b.d); }
function pwRSub(a, b) { return pwExp(a.n * b.d - b.n * a.d, a.d * b.d); }
function pwRMul(a, b) { return pwExp(a.n * b.n, a.d * b.d); }
function pwParseExp(str) {
  const t = String(str == null ? '' : str).trim().replace(/[−–]/g, '-').replace(/\s+/g, '');
  const m = /^(-?)(\d{1,2})(?:\/(\d{1,2}))?$/.exec(t); if (!m) return null;
  const n = parseInt(m[2], 10) * (m[1] ? -1 : 1), d = m[3] === undefined ? 1 : parseInt(m[3], 10);
  return d === 0 ? null : pwExp(n, d);
}
function pwTxt(e) { return (e.n < 0 ? '−' : '') + Math.abs(e.n) + (e.d === 1 ? '' : '/' + e.d); }
function pwPar(e) { return e.n < 0 ? '(' + pwTxt(e) + ')' : pwTxt(e); }
function pwQ(x, e) { return e.d === 1 && e.n >= 0 ? x + '^' + e.n : x + '^(' + pwTxt(e) + ')'; }
function pwEH(e) { const n = Math.abs(e.n); return (e.n < 0 ? '−' : '') + (e.d === 1 ? n : frH(n, e.d)); }
function pwH(x, eh) { return '<span class="pw">' + x + '<sup>' + eh + '</sup></span>'; }
function pwPow(x, e) { return pwH(x, pwEH(e)); }
function pwIRoot(b, q) {
  const r0 = BigInt(Math.round(Math.pow(Number(b), 1 / q)));
  for (let k = r0 - 1n; k <= r0 + 1n; k++) if (k >= 1n && k ** BigInt(q) === b) return k;
  return null;
}
/* Nilai x^e untuk x bilangan bulat positif dan e rasional: {t:'int',v} | {t:'frac',n,d} | {t:'irr'} | {t:'big'} */
function pwEval(x, e) {
  let base = BigInt(x);
  if (e.d > 1) { const r = pwIRoot(base, e.d); if (r === null) return { t: 'irr' }; base = r; }
  if (Math.abs(e.n) > 60) return { t: 'big' };
  const p = (base ** BigInt(Math.abs(e.n))).toString();
  if (p.length > 15) return { t: 'big' };
  return e.n >= 0 ? { t: 'int', v: p } : { t: 'frac', n: '1', d: p };
}
function pwValTxt(v, x, s) { return v.t === 'int' ? idn(v.v) : v.t === 'frac' ? '1/' + idn(v.d) : pwQ(x, s); }
function pwValHTML(v) { return '<span class="eqres">' + (v.t === 'int' ? idn(v.v) : frH(1, idn(v.d))) + '</span>'; }

/* kind: 'pm' (x^a × x^b), 'pd' (x^a : x^b), 'pp' ((x^a)^b), 'pr' (akar ke-c dari x^b). a = basis; b, c = pangkat rasional */
function pwSolve(kind, x, b, c) {
  const OP = '<span class="op">', CL = '</span>', steps = [], parts = [];
  const eq = () => parts.join(OP + ' = ' + CL);
  const snap = (text, work) => steps.push({ text: text, work: work, eq: eq() });
  const sup = (s) => '<sup>' + s + '</sup>';
  let q, intro, s;
  if (kind === 'pm' || kind === 'pd') {
    const mul = kind === 'pm', sym = mul ? '+' : '−', op = mul ? '×' : ':';
    q = pwQ(x, b) + ' ' + op + ' ' + pwQ(x, c);
    parts.push(pwPow(x, b) + OP + ' ' + op + ' ' + CL + pwPow(x, c));
    intro = 'Tekan Lanjut. Kalau basisnya sama, pangkatnya ' + (mul ? 'dijumlahkan.' : 'dikurangkan.');
    parts.push(pwH(x, pwEH(b) + ' ' + sym + ' ' + (c.n < 0 ? '(' + pwEH(c) + ')' : pwEH(c))));
    snap('Basisnya sama, yaitu ' + x + '. Kalau basis sama, pangkatnya ' + (mul ? 'dijumlahkan' : 'dikurangkan') + ': x^m ' + op + ' x^n = x^(m ' + sym + ' n).', 'x' + sup('m') + ' ' + op + ' x' + sup('n') + ' = x' + sup('m ' + sym + ' n'));
    s = mul ? pwRAdd(b, c) : pwRSub(b, c);
    parts.push(pwPow(x, s));
    let t = (mul ? 'Jumlahkan' : 'Kurangkan') + ' pangkatnya: ' + pwTxt(b) + ' ' + sym + ' ' + pwPar(c) + ' = ' + pwTxt(s) + '.';
    if (b.d !== c.d) t += ' Penyebutnya berbeda, jadi samakan penyebutnya dulu (cara silang).';
    if (!mul && c.n < 0) t += ' Mengurangi bilangan negatif sama dengan menambah: ' + pwTxt(b) + ' + ' + pwTxt({ n: -c.n, d: c.d }) + '.';
    snap(t, pwTxt(b) + ' ' + sym + ' ' + pwPar(c) + ' = <b>' + pwTxt(s) + '</b>');

/* Pembagian: bagi dari depan. Ambil angka depan yang sudah >= pembagi, sisa ditulis kecil di samping angka berikutnya. */
function sdBagi(a, d) {
  const ds = String(a).split('').map(Number), L = String(d).length;
  let start = L; if (parseInt(String(a).slice(0, L), 10) < d) start = L + 1;
  start = Math.min(start, ds.length);
  const steps = []; let r = 0, pos = 0;
  for (let k = 0; pos < ds.length; k++) {
    let chunk; const idx = [];
    if (k === 0) { chunk = parseInt(String(a).slice(0, start), 10); for (let i = 0; i < start; i++) idx.push(i); pos = start; }
    else { idx.push(pos); chunk = r * 10 + ds[pos]; pos++; }
    const q = Math.floor(chunk / d); r = chunk % d;
    steps.push({ chunk: chunk, q: q, r: r, prod: q * d, idx: idx, last: pos - 1 });
  }
  return { ds: ds, L: L, start: start, steps: steps, q: parseInt(steps.map((x) => x.q).join(''), 10), r: r };
}

/* Menjumlahkan deret satu digit: coret angka bila jumlah berjalan 10 atau lebih, tulis sisanya. */

    const before = run, sum = run + d, strike = sum >= 10;
    if (strike) { run = sum - 10; tens++; } else run = sum;
    steps.push({ d: d, before: before, sum: sum, strike: strike, rem: run, tens: tens });

    const W = 360, H = o.h || 108, pad = 20, y = o.y || 54, min = o.min, max = o.max;
    const sp = (W - 2 * pad) / (max - min);
    const sx = (v) => pad + (v - min) * sp;
    let step = 1;
    [1, 2, 5, 10, 20, 50].some((s) => { step = s; return sp * s >= 26; });
    let s = '<svg class="nl" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(o.label || 'Garis bilangan') + '">';
    s += '<defs><marker id="ahp" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="ahp"/></marker>' +
      '<marker id="ahn" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="ahn"/></marker></defs>';
    const x0 = sx(0);
    if (o.zones) {
      s += '<rect class="zn" x="' + (pad - 12) + '" y="' + (y - 30) + '" width="' + (x0 - pad + 12) + '" height="56" rx="10"/>';
      s += '<rect class="zp" x="' + x0 + '" y="' + (y - 30) + '" width="' + (W - pad + 12 - x0) + '" height="56" rx="10"/>';
    }
    s += '<line class="ax" x1="' + (pad - 12) + '" y1="' + y + '" x2="' + (W - pad + 12) + '" y2="' + y + '"/>';
    s += '<polygon points="' + (pad - 19) + ',' + y + ' ' + (pad - 9) + ',' + (y - 5) + ' ' + (pad - 9) + ',' + (y + 5) + '" fill="var(--ink)"/>';
    s += '<polygon points="' + (W - pad + 19) + ',' + y + ' ' + (W - pad + 9) + ',' + (y - 5) + ' ' + (W - pad + 9) + ',' + (y + 5) + '" fill="var(--ink)"/>';
    for (let v = min; v <= max; v++) {
      const lab = v % step === 0;
      if (!lab && sp < 5) continue;
      const x = sx(v);
      s += '<line class="tk" x1="' + x + '" y1="' + (y - (lab ? 5 : 3)) + '" x2="' + x + '" y2="' + (y + (lab ? 5 : 3)) + '"/>';
      if (lab) s += '<text class="tl" x="' + x + '" y="' + (y + 22) + '">' + vv(v) + '</text>';
    }
    if (o.zones && o.zoneLabels) {
      s += '<text class="zl" x="' + ((pad + x0) / 2) + '" y="' + (y + 46) + '">Bilangan negatif</text>';
      s += '<text class="zl" x="' + x0 + '" y="' + (y + 46) + '">Nol</text>';
      s += '<text class="zl" x="' + ((x0 + W - pad) / 2) + '" y="' + (y + 46) + '">Bilangan positif</text>';
    }
    if (o.jump && o.jump.from !== o.jump.to) {
      const j = o.jump, x1 = sx(j.from), x2 = sx(j.to), xm = (x1 + x2) / 2;
      const ht = Math.min(44, 18 + Math.abs(x2 - x1) / 4);
      const c = j.to > j.from ? 'pos' : 'neg';
      s += '<path class="jp ' + c + '" d="M' + x1 + ' ' + (y - 9) + ' Q' + xm + ' ' + (y - 9 - ht) + ' ' + x2 + ' ' + (y - 9) + '" marker-end="url(#' + (c === 'pos' ? 'ahp' : 'ahn') + ')"/>';
      s += '<text class="jl ' + c + '" x="' + xm + '" y="' + (y - 9 - ht / 2 - 6) + '">' + esc(j.label || '') + '</text>';
    }
    (o.marks || []).forEach((m) => {
      const x = sx(m.v);
      s += '<circle class="mk ' + (m.cls || 'zero') + '" cx="' + x + '" cy="' + y + '" r="7"/>';
      if (m.label) {
        const ly = o.markPos === 'below' ? y + 42 : y - 16 - (m.dy || 0);
        s += '<text class="ml" x="' + x + '" y="' + ly + '">' + esc(m.label) + '</text>';
      }
    });
    return s + '</svg>';
  }
  const cls = (v) => (v < 0 ? 'neg' : v > 0 ? 'pos' : 'zero');

  /* ---------- suara pembaca materi (Web Speech API, bahasa Indonesia) ---------- */
  const NARASI = {

    3: 'Aturan operasi hitung campuran. Satu, kalau ada tanda kurung, hitung yang ada dalam tanda kurung duluan. Dua, perkalian dan pembagian dihitung duluan sebelum penjumlahan dan pengurangan. Tiga, kalau ada perkalian dan pembagian berbarengan, hitung dari sebelah kiri dulu. Empat, kalau ada penjumlahan dan pengurangan berbarengan, hitung dari sebelah kiri dulu.'
  };
  const TTS = { ok: 'speechSynthesis' in window && typeof SpeechSynthesisUtterance !== 'undefined', voices: [], uri: null, on: false };
  const FEMALE = /female|wanita|perempuan|gadis|damayanti|ayu|siti|putri|gadis/i;
  const MALE = /andika|male|pria|laki|ardi|rizki|budi|bagus|joko/i;
  const isMale = (v) => !!v && !FEMALE.test(v.name) && MALE.test(v.name);
  function loadVoices() {
    if (!TTS.ok) return;
    TTS.voices = speechSynthesis.getVoices().filter((v) => /^id([-_]|$)/i.test(v.lang) || /indones/i.test(v.name));
    TTS.voices.sort((a, b) => (isMale(b) ? 1 : 0) - (isMale(a) ? 1 : 0));
    if (!TTS.uri || !TTS.voices.some((v) => v.voiceURI === TTS.uri)) TTS.uri = TTS.voices.length ? TTS.voices[0].voiceURI : null;
  }
  if (TTS.ok) { loadVoices(); speechSynthesis.addEventListener('voiceschanged', () => { loadVoices(); if ($('#abar')) drawAudio(); refreshPlayers(); }); }
  function stopSpeech() {
    TTS.tk = (TTS.tk || 0) + 1;

  /* ---------- Trik Perkalian ---------- */
  const gPlayers = [];
  function refreshPlayers() { gPlayers.forEach((p) => p.drawBar()); }

  function speakSeq(items, from, rate, onStep, onDone, onStop) {
    stopSpeech();
    const v = TTS.voices.find((x) => x.voiceURI === TTS.uri) || null, tkn = TTS.tk;
    TTS.on = true; TTS.stopCb = onStop || null;

    for (let i = from; i < items.length; i++) {
      const parts = (items[i].match(/[^.!?]+[.!?]?/g) || [items[i]]).map((t) => t.trim()).filter(Boolean);
      parts.forEach((t, k) => chunks.push({ t: t, i: i, first: k === 0 }));
    }
    chunks.forEach((c, idx) => {
      const u = new SpeechSynthesisUtterance(c.t);
      u.lang = 'id-ID'; if (v) u.voice = v;
      u.rate = rate; u.pitch = !v || isMale(v) ? 1.2 : 1.0;
      if (c.first) u.onstart = () => { if (TTS.tk === tkn && onStep) onStep(c.i); };
      if (idx === chunks.length - 1) u.onend = () => { if (TTS.tk === tkn) { TTS.on = false; TTS.stopCb = null; if (onDone) onDone(); } };
      u.onerror = (ev) => {
        if (TTS.tk === tkn && ev.error !== 'interrupted' && ev.error !== 'canceled') { TTS.on = false; const cb = TTS.stopCb; TTS.stopCb = null; if (cb) cb(); }
      };
      speechSynthesis.speak(u);
    });
  }

  function gridHTML(L, cur) {

  /* Cara cepat ala kertas: 76 × 74 = 5624, kurung atas = bagian belakang, kurung bawah = bagian depan */

  function qcalcHTML(t) {

  function quickHTML(L, cur) {
    const P = L.plan, S = L.stack, nCols = P.cols.length, nc = Math.max(P.na, P.nb);

    const revealed = cur < 2 ? 0 : Math.min(nCols, cur - 1);
    const stackOn = cur >= nCols + 2;
    const active = cur >= 2 && cur - 2 < nCols ? P.cols[cur - 2] : null;
    const mids = nCols > 2 ? P.cols.slice(1, nCols - 1) : [];

    const yA = topH + 36, yB = topH + 88, yR = topH + 99, H = topH + 105;

    P.B.forEach((d, j) => { svg += '<text class="qd" x="' + xb(j) + '" y="' + yB + '">' + d + '</text>'; });
    svg += '<text class="qs" x="12" y="' + (yB - 3) + '">×</text><line class="qrule" x1="6" y1="' + yR + '" x2="' + (W - 4) + '" y2="' + yR + '"/>';
    /* hasil tiap kolom ditulis seperti di kertas: ujung kiri, ujung kanan, dan bagian tengah di atas angka */
    const endRes = (k, side) => {
      if (k < 0 || k >= revealed) return '';
      const c = P.cols[k], t = String(c.sum), w = Math.round(t.length * 14.5 + 6), on = isOn(c);

    else svg += endRes(0, 'l') + endRes(nCols - 1, 'r');
    mids.forEach((c, r) => {
      if (r + 1 >= revealed) return;
      const pr = c.terms.map((t) => t.prod), lead = pr.length > 1 ? pr.join(' + ') + ' = ' : '', sum = String(c.sum);
      const yT = 8 + r * RH + 13, w = Math.round((lead.length + sum.length) * 9 + 10), on = isOn(c);
      if (on) svg += '<rect class="qhl" x="' + Math.round(mx - w / 2) + '" y="' + (yT - 14) + '" width="' + w + '" height="19" rx="5"/>';
      svg += '<text class="qm' + (on ? ' on' : '') + '" x="' + mx + '" y="' + yT + '">' + (lead ? '<tspan>' + lead + '</tspan>' : '') + '<tspan class="qv">' + sum + '</tspan></text>' +
        '<path class="qarc" d="M' + (mx - 14) + ' ' + (yT + 8) + ' Q' + mx + ' ' + (yT + 1) + ' ' + (mx + 14) + ' ' + (yT + 8) + '"/>';

    const calc = active ? '<div class="qline on">' + qcalcHTML(active.calc) + '</div>' : '';
    const seen = {};
    P.cols.slice(0, revealed).forEach((c) => { seen[c.p] = true; });
    const cells = S.cells.map((cell) => {
      const ad = cell.adds.filter((x) => stackOn || seen[x.from]);

    return '<div class="quick"><div class="qtop"><h4>Pengerjaan cepat</h4><p class="sub">Kali silang: angka disusun bertumpuk.</p>' + svg +
      '<div class="qcalc">' + calc + '</div></div><div class="qbot"><div class="qstack" aria-label="Angka yang bertumpuk menurut nilai tempat">' + cells + '</div>' +
      '<div class="qres">' + (stackOn ? '= <mark class="eq">' + gf(P.total) + '</mark>' : '= ?') + '</div></div></div>';
  }

  function makePlayer(host, o) {
    const st = { L: null, cur: 0, all: false, playing: false, rate: 0.95 };
    host.innerHTML = '<div data-a="bar"></div><div data-a="out" aria-live="polite"></div>';
    const q = (n) => host.querySelector('[data-a="' + n + '"]');

    function drawBar() {
      const b = q('bar'); if (!b) return;
      if (!TTS.ok) { b.innerHTML = '<p class="muted" style="margin:0;font-size:14px">Browser ini belum mendukung suara pembaca. Langkahnya tetap bisa dibaca di bawah. Coba Chrome, Edge, atau Safari untuk audio.</p>'; return; }
      const cur = TTS.voices.find((x) => x.voiceURI === TTS.uri);
      const sel = '';
      const info = TTS.voices.length ? (cur && isMale(cur) ? 'Memakai suara laki-laki dengan nada dibuat lebih muda.' : 'Suara mengikuti perangkatmu. Pilih suara lain di daftar bila tersedia.') :
        'Belum ada suara bahasa Indonesia di perangkat ini. Pasang suara Indonesia di pengaturan perangkat, atau coba Chrome dan Edge.';
      b.innerHTML = '<div class="ansrow"><button type="button" class="btn" data-a="play">' + (st.playing ? 'Berhenti' : 'Putar tutorial audio') + '</button>' +
        '<label class="ni"><span>Kecepatan</span><select data-a="rate" class="field sel">' +
        [[0.8, 'Lambat'], [0.95, 'Normal'], [1.1, 'Cepat']].map((r) => '<option value="' + r[0] + '"' + (r[0] === st.rate ? ' selected' : '') + '>' + r[1] + '</option>').join('') + '</select></label></div>' +
        (TTS.voices.length ? '' : '<p class="muted vinfo vwarn" style="margin:8px 0 0;font-size:14px">' + info + '</p>');
    }

    function draw() {
      const out = q('out'), L = st.L;
      if (!out) return;
      if (!L) { out.innerHTML = ''; return; }
      const last = L.steps.length - 1, upto = st.all ? last : st.cur, atEnd = upto >= last;
      let h = '';
      if (L.grid) { const cc = st.all ? last : st.cur; h += '<div class="duo"><div class="kcol" style="--ncol:' + L.plan.nb + '">' + gridHTML(L, cc) + '</div>' + quickHTML(L, cc) + '</div>'; }
      if (L.sp) h += spHTML(L, upto);
      if (L.grid || L.sp) h += '<div class="stepfoot"><p class="stepcap">Langkah ' + (upto + 1) + ' dari ' + (last + 1) + ': ' + esc(L.steps[upto].h) + '</p>';
      else h += '<ol class="gsteps">' + L.steps.slice(0, upto + 1).map((s, i) =>
        '<li class="gstep' + (i === st.cur && !st.all ? ' cur' : '') + (s.final ? ' fin' : '') + '"><h4>' + esc(s.h) + '</h4><div class="eqblock">' + s.f.map(esc).join('<br>') + '</div><p class="tt">' + esc(s.t) + '</p>' +
        (TTS.ok ? '<button type="button" class="chip sm" data-a="from" data-i="' + i + '">Dengar langkah ini</button>' : '') + '</li>').join('') + '</ol>';
      h += '<div class="stepbtns">' + (st.cur > 0 || st.all ? '<button class="btn ghost" type="button" data-a="prev">Sebelumnya</button>' : '') +
        (atEnd ? '<button class="btn ghost" type="button" data-a="again">Ulangi dari awal</button>' :
          '<button class="btn" type="button" data-a="next">' + 'Berikutnya' + '</button><button class="btn ghost" type="button" data-a="all">' + 'Lihat semua' + '</button>') + '</div>' + (L.grid || L.sp ? '</div>' : '');
      out.innerHTML = h;
    }

    function play(from) {
      if (!TTS.ok || !st.L) return;
      speakSeq(st.L.steps.map((s) => s.say), from, st.rate,
        (i) => {
          st.cur = i; st.all = false; draw();
          const el = host.querySelector('.gstep.cur');
          if (el && el.scrollIntoView) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        },
        () => { st.playing = false; drawBar(); draw(); },
        () => { st.playing = false; drawBar(); });
      st.playing = true; drawBar();
    }

    host.addEventListener('click', (e) => {
      const b = e.target.closest('[data-a]'); if (!b || !st.L) return;
      const a = b.dataset.a, last = st.L.steps.length - 1;
      if (a === 'play') { if (st.playing) stopSpeech(); else play(0); return; }
      if (a === 'from') { play(+b.dataset.i); return; }
      if (a === 'next' || a === 'prev' || a === 'all' || a === 'again') {
        stopSpeech();
        if (a === 'next') st.cur = Math.min(last, st.cur + 1);
        else if (a === 'prev') { if (st.all) { st.all = false; st.cur = last; } else st.cur = Math.max(0, st.cur - 1); }
        else if (a === 'all') st.all = true;
        else { st.all = false; st.cur = 0; }
        draw();
      }
    });
    host.addEventListener('change', (e) => {
      const t = e.target;
      if (t.dataset.a === 'rate') st.rate = +t.value;
      else if (t.dataset.a === 'voice') { TTS.uri = t.value; drawBar(); }
    });

    const api = {
      drawBar: drawBar,
      set: (a, b) => {
        stopSpeech();
        const L = o.lesson(a, b);
        if (L.err) { st.L = null; const out = q('out'); out.innerHTML = '<p class="err">' + esc(L.err) + '</p>'; return; }
        st.L = L; st.cur = 0; st.all = false; drawBar(); draw();
      }
    };
    gPlayers.push(api);
    drawBar();
    return api;
  }

  const sdRange = (lo, hi) => { const o = []; for (let i = lo; i <= hi; i++) o.push(i); return o; };
